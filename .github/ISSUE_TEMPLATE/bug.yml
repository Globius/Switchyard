name: Bug report
description: Something does not work as documented
labels: [bug]
body:
  - type: textarea
    id: what
    attributes:
      label: What happened, and what did you expect?
    validations: {required: true}
  - type: textarea
    id: steps
    attributes:
      label: How to reproduce it
      description: Commands, config, or a request. Remove secrets, tokens and real addresses.
    validations: {required: true}
  - type: input
    id: version
    attributes:
      label: Version
      description: "`syctl version`, or Admin > Upgrades"
  - type: dropdown
    id: where
    attributes:
      label: How do you run it?
      options: [Docker Compose, Proxmox VMs or LXC, Kubernetes (Helm), From source]
