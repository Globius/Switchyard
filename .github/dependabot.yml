version: 2
updates:
  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: weekly
  - package-ecosystem: docker
    directory: /deploy/controller
    schedule:
      interval: weekly
    ignore:
      # The controller targets Python 3.12 only (requires-python is >=3.12,<3.13 and CI tests 3.12).
      - dependency-name: python
        update-types: [version-update:semver-major, version-update:semver-minor]
  - package-ecosystem: docker
    directory: /deploy/proxy
    schedule:
      interval: weekly
    ignore:
      # The UI is built and tested on Node 22 (the LTS line CI uses); move the Dockerfile and ci.yml together.
      - dependency-name: node
        update-types: [version-update:semver-major]
