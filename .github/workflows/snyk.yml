# Snyk scans (docs/security/snyk.md): open source dependencies, Snyk Code (SAST), IaC and the two container images.
# Results go to GitHub code scanning as SARIF. Findings never fail the run; an absent SNYK_TOKEN (forks, new
# clones) skips every scan and the run stays green. GitLab has its own scanners; this file is GitHub-only.
name: snyk
on:
  push:
    branches: [main]
  pull_request:
  schedule:
    - cron: "17 4 * * 1" # weekly, Mondays: new advisories appear without new commits
  workflow_dispatch:
concurrency:
  group: snyk-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}
permissions:
  contents: read

env:
  SNYK_TOKEN: ${{ secrets.SNYK_TOKEN }}
  SNYK_CFG_ORG: ${{ vars.SNYK_ORG }} # optional; the token's default organization applies when unset

jobs:
  scan:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      security-events: write # upload SARIF to code scanning
    strategy:
      fail-fast: false
      matrix:
        include:
          - {id: deps, title: Snyk Open Source, cmd: "snyk test --all-projects --exclude=node_modules,.venv,docs"}
          - {id: code, title: Snyk Code, cmd: "snyk code test"}
          - {id: iac, title: Snyk IaC, cmd: "snyk iac test deploy se-image provider"}
          - {id: container-controller, title: Snyk Container (controller), image: switchyard-controller, dockerfile: deploy/controller/Dockerfile}
          - {id: container-proxy, title: Snyk Container (proxy), image: switchyard-proxy, dockerfile: deploy/proxy/Dockerfile}
    steps:
      - id: gate
        name: Check for SNYK_TOKEN
        run: |
          if [ -n "$SNYK_TOKEN" ]; then echo "enabled=true" >> "$GITHUB_OUTPUT"
          else echo "::notice::SNYK_TOKEN is not set (fork, or secret not added yet); skipping ${{ matrix.title }}"; fi
      - if: steps.gate.outputs.enabled == 'true'
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - if: steps.gate.outputs.enabled == 'true'
        uses: snyk/actions/setup@11b673cfb4b0dc0d860a1323caa199d54950dcce # master, no semver tag is current
      - if: steps.gate.outputs.enabled == 'true' && matrix.dockerfile
        run: docker build -f ${{ matrix.dockerfile }} -t ${{ matrix.image }} .
      - if: steps.gate.outputs.enabled == 'true'
        name: Scan
        run: |
          cmd='${{ matrix.cmd }}'
          [ -n '${{ matrix.image }}' ] && cmd="snyk container test ${{ matrix.image }} --file=${{ matrix.dockerfile }}"
          # Exit 1 means "issues found": report them, do not fail. Anything above 1 is a real error.
          set +e
          $cmd --sarif-file-output=snyk.sarif
          rc=$?
          [ "$rc" -le 1 ] || exit "$rc"
          [ -f snyk.sarif ] || echo '{"version":"2.1.0","runs":[]}' > snyk.sarif
          # Snyk Container writes a non-numeric "security-severity" (null) on some rules and code scanning rejects the
          # file ("invalid security severity value, is not a number: null"). Keep the property only where it is a
          # number (or a numeric string); a rule without it is valid. Log what was seen so a new shape shows up.
          jq -c '[.runs[]?.tool.driver.rules[]?.properties["security-severity"]] | group_by(.) | map({v: .[0], n: length})' snyk.sarif
          jq 'del(.runs[]?.tool.driver.rules[]? | .properties? | select(. != null) | ."security-severity"? | select((tostring | test("^[0-9]+([.][0-9]+)?$")) | not))' snyk.sarif > snyk.clean.sarif
          mv snyk.clean.sarif snyk.sarif
      - if: steps.gate.outputs.enabled == 'true' && github.event.pull_request.head.repo.fork != true
        uses: github/codeql-action/upload-sarif@9b3254085494b55a0f7c4c2b3d2d52cc712ce370 # v4.39.1
        with:
          sarif_file: snyk.sarif
          category: ${{ matrix.id }}
