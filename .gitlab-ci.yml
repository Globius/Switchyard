# Same gates as controller/Makefile.

# A new push cancels the older pipelines of the same branch (their interruptible jobs).
workflow:
  auto_cancel:
    on_new_commit: interruptible

stages: [check, deploy]

# Docker Hub images come through the globius-oss group's Dependency Proxy (a cache, so no Docker Hub rate limit).
# ghcr.io and quay.io images are pulled directly.
default:
  image: ghcr.io/astral-sh/uv:python3.12-bookworm
  # Runner group 250 runs jobs in Docker; jobs that start a Docker daemon (dind) ask for `docker-privileged` below.
  tags: [docker, x86_64]
  interruptible: true
  cache:
    key: uv-$CI_COMMIT_REF_SLUG
    paths: [.cache/uv]

variables:
  UV_CACHE_DIR: $CI_PROJECT_DIR/.cache/uv

.controller:
  stage: check
  before_script:
    - cd controller
    - uv sync --frozen

lint:
  extends: .controller
  script:
    - uv run ruff check .
    - uv run ruff format --check .

typecheck:
  extends: .controller
  script:
    - uv run mypy

# Tests in two tiers. Every push and MR: the tests that need no Docker plus a small container smoke set.
# The full suite (every container test and the coverage gate) runs on main, on version tags (v*),
# nightly from a schedule, and by hand ("Run pipeline" with FULL_TESTS=1).
test:
  extends: .controller
  script:
    - uv run pytest -m "not docker"

.docker-tests:
  extends: .controller
  tags: [docker-privileged]
  # Docker-backed tests (PostgreSQL, HAProxy) need a Docker daemon; use the dind service.
  services:
    - name: ${CI_DEPENDENCY_PROXY_GROUP_IMAGE_PREFIX}/docker:27-dind
      alias: docker
  variables:
    DOCKER_HOST: tcp://docker:2375
    DOCKER_TLS_CERTDIR: ""
    TESTCONTAINERS_HOST_OVERRIDE: docker
    TESTCONTAINERS_RYUK_DISABLED: "true"   # the pod is thrown away anyway; saves a Docker Hub pull
  before_script:
    - cd controller
    - uv sync --frozen
    - for i in $(seq 60); do uv run python -c "import docker; docker.from_env().ping()" 2>/dev/null && break; sleep 2; done
    # The SDK-created test containers do not pull missing images, and dind starts empty.
    - uv run python -m tests.ci_pull_images

test-smoke:
  extends: .docker-tests
  rules:
    - if: $CI_COMMIT_TAG || $CI_COMMIT_BRANCH == $CI_DEFAULT_BRANCH || $CI_PIPELINE_SOURCE == "schedule" || $FULL_TESTS
      when: never
    - when: on_success
  script:
    # RLS isolation, the apply pipeline end to end, and HAProxy validation of the rendered golden cases.
    # Bind mounts are resolved by dind: keep pytest's temporary files on the build volume it shares.
    - uv run pytest --basetemp="$CI_PROJECT_DIR/.pytest-tmp" -p no:cacheprovider
      tests/integration/test_rls.py tests/integration/test_apply_pipeline.py
      "tests/integration/test_golden_haproxy.py::test_haproxy_accepts_rendered_config[01-minimal-http]"

test-full:
  extends: .docker-tests
  timeout: 3h
  interruptible: false
  rules:
    - if: $CI_COMMIT_TAG || $CI_COMMIT_BRANCH == $CI_DEFAULT_BRANCH || $CI_PIPELINE_SOURCE == "schedule" || $FULL_TESTS
  script:
    - uv run pytest --basetemp="$CI_PROJECT_DIR/.pytest-tmp" --cov --cov-report=term-missing --cov-report=xml
    - uv run coverage report --include="switchyard/domain/*,switchyard/render/*,switchyard/pipeline/*" --fail-under=85
  coverage: '/TOTAL.*\s+(\d+(?:\.\d+)?)%/'
  artifacts:
    reports:
      coverage_report:
        coverage_format: cobertura
        path: controller/coverage.xml

openapi-breaking:
  extends: .controller
  rules:
    - if: $CI_MERGE_REQUEST_ID
  script:
    - git fetch origin $CI_MERGE_REQUEST_TARGET_BRANCH_NAME
    - git show origin/$CI_MERGE_REQUEST_TARGET_BRANCH_NAME:docs/api/openapi.json > /tmp/old-openapi.json || exit 0
    - uv run python -m switchyard.api.openapi_check /tmp/old-openapi.json ../docs/api/openapi.json

# The agent (Go) and the SE image recipe. The image test provisions Debian 13 with every binary and runs
# se-image/test/check.sh (units, sysctls, the auth sidecar slot, Data Plane API over mTLS).
agent:
  stage: check
  image: ${CI_DEPENDENCY_PROXY_GROUP_IMAGE_PREFIX}/golang:1.26
  script:
    - cd agent
    - test -z "$(gofmt -l .)"
    - go vet ./...
    - go test ./...

# The web UI (ui/): lint, format, types, tests, build, and "the generated API client matches the spec".
# New with ADR 0206, so both hosts check the UI (.github/workflows/ci.yml has the same job).
ui:
  stage: check
  image: ${CI_DEPENDENCY_PROXY_GROUP_IMAGE_PREFIX}/node:22
  cache:
    key: pnpm-$CI_COMMIT_REF_SLUG
    paths: [.pnpm-store]
  script:
    - corepack enable
    - cd ui
    - pnpm config set store-dir "$CI_PROJECT_DIR/.pnpm-store"
    - pnpm install --frozen-lockfile
    - pnpm lint
    - pnpm format:check
    - pnpm typecheck
    - pnpm test
    - pnpm build
    - pnpm gen:api:check

# The device posture agent (ADR 0196): standard library only, builds for the three desktop systems.
posture-agent:
  stage: check
  image: ${CI_DEPENDENCY_PROXY_GROUP_IMAGE_PREFIX}/golang:1.26
  script:
    - cd posture-agent
    - test -z "$(gofmt -l .)"
    - go vet ./...
    - go test ./...
    - GOOS=windows GOARCH=amd64 go build -o /dev/null ./cmd/sy-posture
    - GOOS=darwin GOARCH=arm64 go build -o /dev/null ./cmd/sy-posture
    - GOOS=linux GOARCH=amd64 go build -o /dev/null ./cmd/sy-posture

# Known-vulnerability scans of the lock files (docs/security/2026-10-13-review.md). They warn instead of
# failing the pipeline, so a new advisory never blocks an unrelated merge; make them blocking once a run is clean.
audit-python:
  stage: check
  allow_failure: true
  script:
    - cd controller
    - uv export --no-dev --no-hashes --frozen -o /tmp/requirements.txt > /dev/null
    - uvx pip-audit -r /tmp/requirements.txt --no-deps --disable-pip

audit-go:
  stage: check
  allow_failure: true
  image: ${CI_DEPENDENCY_PROXY_GROUP_IMAGE_PREFIX}/golang:1.26
  script:
    - go install golang.org/x/vuln/cmd/govulncheck@v1.9.0
    - for d in agent posture-agent provider; do (cd $d && "$(go env GOPATH)/bin/govulncheck" ./...); done

audit-ui:
  stage: check
  allow_failure: true
  image: ${CI_DEPENDENCY_PROXY_GROUP_IMAGE_PREFIX}/node:22-slim
  script:
    - corepack enable
    - cd ui
    - pnpm audit --prod

se-image:
  stage: check
  tags: [docker-privileged]
  image: ${CI_DEPENDENCY_PROXY_GROUP_IMAGE_PREFIX}/docker:27
  services:
    - name: ${CI_DEPENDENCY_PROXY_GROUP_IMAGE_PREFIX}/docker:27-dind
      alias: docker
  variables:
    DOCKER_HOST: tcp://docker:2375
    DOCKER_TLS_CERTDIR: ""
  rules:
    - changes: [se-image/**/*, agent/**/*]
  script:
    - for i in $(seq 60); do docker info >/dev/null 2>&1 && break; sleep 2; done  # dind starts after the job
    - echo "$CI_DEPENDENCY_PROXY_PASSWORD" | docker login -u "$CI_DEPENDENCY_PROXY_USER" --password-stdin "$CI_DEPENDENCY_PROXY_SERVER"
    - docker build -q --build-arg REGISTRY="$CI_DEPENDENCY_PROXY_GROUP_IMAGE_PREFIX/" -f se-image/test/Dockerfile -t sy-se-image-test .

# The Helm chart (deploy/helm): lint, render with the value sets people use, check the invariants.
helm:
  stage: check
  image:
    name: ${CI_DEPENDENCY_PROXY_GROUP_IMAGE_PREFIX}/alpine/helm:3.18.6
    entrypoint: [""]
  rules:
    - changes: [deploy/helm/**/*]
  script:
    - sh deploy/helm/test.sh

# The live checks (.p12 import, 412/428 conflict responses: deploy/lab/checks/live.sh) need a running stack and the lab
# scripts; they are run by hand, see docs/runbooks/lab-hosts.md.

# Docs site (ADR 0190): strict MkDocs build with link checking on every pipeline, published to GitLab
# Pages from main. Same as `make docs` locally.
# Secret scan over the whole history (gitleaks). Findings that were reviewed and are not secrets are in
# .gitleaksignore; a new one fails the job. Mark a deliberate example with `gitleaks:allow` on its line.
gitleaks:
  stage: check
  image:
    name: ${CI_DEPENDENCY_PROXY_GROUP_IMAGE_PREFIX}/zricethezav/gitleaks:v8.21.2
    entrypoint: [""]
  variables:
    GIT_DEPTH: "0"
    GIT_STRATEGY: clone   # a reused checkout can still hold refs from before the history rewrite
  script:
    - git config --global --add safe.directory "$CI_PROJECT_DIR"
    - gitleaks detect --source . --config .gitleaks.toml --redact --no-banner -v

# Licensing and SBOMs (ADR 0200, docs/sbom-and-licensing.md).
reuse:
  stage: check
  image:
    name: ${CI_DEPENDENCY_PROXY_GROUP_IMAGE_PREFIX}/fsfe/reuse:5
    entrypoint: [""]
  script:
    - reuse lint

# SBOMs in SPDX JSON, made by Syft. Artifacts of every pipeline on main and on v* tags (and by hand with SBOM=1).
.sbom:
  stage: check
  image:
    name: ${CI_DEPENDENCY_PROXY_GROUP_IMAGE_PREFIX}/anchore/syft:v1.19.0-debug
    entrypoint: [""]
  rules:
    - if: $CI_COMMIT_TAG || $CI_COMMIT_BRANCH == $CI_DEFAULT_BRANCH || $SBOM
    - if: $CI_MERGE_REQUEST_ID
      changes: [.gitlab-ci.yml]
  variables:
    SYFT_CHECK_FOR_APP_UPDATE: "false"
  before_script: [mkdir -p sbom]
  artifacts:
    paths: [sbom/]
    expire_in: 90 days

sbom-controller:
  extends: .sbom
  script: [/syft scan dir:controller --source-name switchyard-controller -o spdx-json=sbom/switchyard-controller.spdx.json]

sbom-ui:
  extends: .sbom
  script: [/syft scan dir:ui --source-name switchyard-ui -o spdx-json=sbom/switchyard-ui.spdx.json]

sbom-agent:
  extends: .sbom
  script:
    - /syft scan dir:agent --source-name sy-agent -o spdx-json=sbom/sy-agent.spdx.json
    - /syft scan dir:provider --source-name terraform-provider-switchyard -o spdx-json=sbom/switchyard-provider.spdx.json

sbom-helm:
  extends: .sbom
  script: [/syft scan dir:deploy/helm --source-name switchyard-helm-chart -o spdx-json=sbom/switchyard-helm-chart.spdx.json]

# The SE image: build the image the se-image job tests (Debian 13 plus every binary) and scan it.
sbom-se-image:
  extends: .sbom
  tags: [docker-privileged]
  image: ${CI_DEPENDENCY_PROXY_GROUP_IMAGE_PREFIX}/docker:27
  services:
    - name: ${CI_DEPENDENCY_PROXY_GROUP_IMAGE_PREFIX}/docker:27-dind
      alias: docker
  variables:
    DOCKER_HOST: tcp://docker:2375
    DOCKER_TLS_CERTDIR: ""
  script:
    - for i in $(seq 60); do docker info >/dev/null 2>&1 && break; sleep 2; done
    - echo "$CI_DEPENDENCY_PROXY_PASSWORD" | docker login -u "$CI_DEPENDENCY_PROXY_USER" --password-stdin "$CI_DEPENDENCY_PROXY_SERVER"
    - docker build -q --build-arg REGISTRY="$CI_DEPENDENCY_PROXY_GROUP_IMAGE_PREFIX/" -f se-image/test/Dockerfile -t sy-se-image-test .
    - docker pull -q ${CI_DEPENDENCY_PROXY_GROUP_IMAGE_PREFIX}/anchore/syft:v1.19.0
    - mkdir -p sbom
    # Syft in a container on the dind daemon (host network: the daemon listens on 127.0.0.1:2375 there) reads the image from it.
    - docker run --rm --network host -e DOCKER_HOST=tcp://127.0.0.1:2375 ${CI_DEPENDENCY_PROXY_GROUP_IMAGE_PREFIX}/anchore/syft:v1.19.0 scan docker:sy-se-image-test --source-name switchyard-se-image -o spdx-json > sbom/switchyard-se-image.spdx.json

# On a v* tag: the SBOMs go to the Package Registry and onto the GitLab release.
release:
  stage: deploy
  interruptible: false
  image: registry.gitlab.com/gitlab-org/release-cli:latest
  rules:
    - if: '$RELEASE_HOST && $RELEASE_HOST != "gitlab"'
      when: never
    - if: '$CI_COMMIT_TAG =~ /^v\d+\.\d+\.\d+(-rc\.?\d+)?$/'
  needs: [sbom-controller, sbom-ui, sbom-agent, sbom-helm, sbom-se-image, release-version, release-build]
  before_script: [apk add --no-cache curl]
  script:
    - |
      for f in sbom/*.spdx.json; do
        curl --fail --header "JOB-TOKEN: $CI_JOB_TOKEN" --upload-file "$f"           "$CI_API_V4_URL/projects/$CI_PROJECT_ID/packages/generic/switchyard-sbom/$CI_COMMIT_TAG/$(basename "$f")"
      done
  release:
    tag_name: $CI_COMMIT_TAG
    description: "Signed upgrade bundle, release feed and SPDX SBOMs for $CI_COMMIT_TAG (docs/upgrades.md, docs/sbom-and-licensing.md)."
    assets:
      links:
        - {name: "SBOM: controller", url: "$CI_API_V4_URL/projects/$CI_PROJECT_ID/packages/generic/switchyard-sbom/$CI_COMMIT_TAG/switchyard-controller.spdx.json"}
        - {name: "SBOM: UI", url: "$CI_API_V4_URL/projects/$CI_PROJECT_ID/packages/generic/switchyard-sbom/$CI_COMMIT_TAG/switchyard-ui.spdx.json"}
        - {name: "SBOM: agent", url: "$CI_API_V4_URL/projects/$CI_PROJECT_ID/packages/generic/switchyard-sbom/$CI_COMMIT_TAG/sy-agent.spdx.json"}
        - {name: "SBOM: OpenTofu provider", url: "$CI_API_V4_URL/projects/$CI_PROJECT_ID/packages/generic/switchyard-sbom/$CI_COMMIT_TAG/switchyard-provider.spdx.json"}
        - {name: "SBOM: Helm chart", url: "$CI_API_V4_URL/projects/$CI_PROJECT_ID/packages/generic/switchyard-sbom/$CI_COMMIT_TAG/switchyard-helm-chart.spdx.json"}
        - {name: "SBOM: SE image", url: "$CI_API_V4_URL/projects/$CI_PROJECT_ID/packages/generic/switchyard-sbom/$CI_COMMIT_TAG/switchyard-se-image.spdx.json"}
        - {name: "Upgrade bundle", url: "$CI_API_V4_URL/projects/$CI_PROJECT_ID/packages/generic/switchyard/$VERSION/switchyard-$VERSION.sybundle"}
        - {name: "Release feed (releases.json)", url: "$CI_API_V4_URL/projects/$CI_PROJECT_ID/packages/generic/switchyard/$VERSION/releases.json", filepath: "/releases.json"}

docs:
  stage: check
  script:
    - uvx --with-requirements docs/requirements.txt mkdocs build --strict
  artifacts:
    paths: [public]
    expire_in: 1 week

pages:
  stage: deploy
  interruptible: false   # never stop a Pages publish halfway
  needs: [docs]
  rules:
    - if: $CI_COMMIT_BRANCH == $CI_DEFAULT_BRANCH
  script:
    - test -f public/index.html
  artifacts:
    paths: [public]

# ---- Nightly builds and releases (ADR 0206, docs/runbooks/release.md) ---------------------------------------------
# What runs where is decided by tools/release/*.sh, which GitHub Actions (.github/workflows/release.yml) calls too.
# Only ONE host publishes: set the CI/CD variable RELEASE_HOST=github here to turn publishing off on GitLab.
#
# Needed CI/CD variables (protected, so only protected branches and tags see them):
#   RELEASE_SIGNING_KEY_B64, RELEASE_KEY_ID     release key (tags v*)       base64 -w0 release.pem
#   NIGHTLY_SIGNING_KEY_B64, NIGHTLY_KEY_ID     nightly key (schedule)
# And a pipeline schedule (CI/CD > Schedules): daily, branch main, variable NIGHTLY=1.
.publisher:
  rules:
    - if: '$RELEASE_HOST && $RELEASE_HOST != "gitlab"'
      when: never
    # The schedule, or "Run pipeline" on main by hand with NIGHTLY=1 (add FORCE_NIGHTLY=1 to build without changes).
    - if: '($CI_PIPELINE_SOURCE == "schedule" || $CI_PIPELINE_SOURCE == "web") && $NIGHTLY == "1" && $CI_COMMIT_BRANCH == $CI_DEFAULT_BRANCH'
    - if: '$CI_COMMIT_TAG =~ /^v\d+\.\d+\.\d+(-rc\.?\d+)?$/'

# Works out the version, the channel and whether anything changed since the last nightly.
release-version:
  extends: .publisher
  stage: deploy
  interruptible: false
  needs: []   # start at once; do not wait for the whole check stage
  variables:
    GIT_DEPTH: "100"
  script:
    - |
      if [ -n "$CI_COMMIT_TAG" ]; then
        MODE=release
        VERSION=$(python3 tools/release/version.py compute release --tag "$CI_COMMIT_TAG")
      else
        MODE=nightly
        VERSION=$(python3 tools/release/version.py compute nightly)
      fi
      CHANNEL=$(python3 tools/release/version.py channel "$VERSION")
      SKIP=0
      if [ "$MODE" = nightly ] && [ -z "${FORCE_NIGHTLY:-}" ] && [ -z "$(git log --since='25 hours ago' --format=%h -1)" ]; then
        SKIP=1
      fi
      printf 'MODE=%s\nVERSION=%s\nCHANNEL=%s\nSKIP=%s\n' "$MODE" "$VERSION" "$CHANNEL" "$SKIP" | tee release.env
  artifacts:
    reports:
      dotenv: release.env

# Builds the artifacts, packs and signs the bundle, adds it to the signed feed and publishes both: to GitHub Releases when
# GITHUB_REPO is set (public, readable without a login), otherwise to the Package
# Registry. The images are too big for job artifacts, so everything happens in this one job.
release-build:
  extends: .publisher
  tags: [docker-privileged]
  stage: deploy
  interruptible: false
  # Publish only a main (or tag) that passes the quick checks; test-full still runs beside it.
  needs: [release-version, lint, typecheck, test, ui]
  timeout: 1h
  image: ${CI_DEPENDENCY_PROXY_GROUP_IMAGE_PREFIX}/docker:27
  services:
    - name: ${CI_DEPENDENCY_PROXY_GROUP_IMAGE_PREFIX}/docker:27-dind
      alias: docker
  variables:
    DOCKER_HOST: tcp://docker:2375
    DOCKER_TLS_CERTDIR: ""
    GOTOOLCHAIN: auto
    PYTHON: python3
  script:
    - '[ "$SKIP" != 1 ] || { echo "nothing changed since the last nightly"; exit 0; }'
    - apk add --no-cache python3 py3-pip curl git go helm github-cli
    - pip install --break-system-packages --quiet "uv>=0.12,<0.13"
    - for i in $(seq 60); do docker info >/dev/null 2>&1 && break; sleep 2; done
    # The Dockerfiles name Docker Hub images; fetch them through the dependency proxy and tag them as named.
    - echo "$CI_DEPENDENCY_PROXY_PASSWORD" | docker login -u "$CI_DEPENDENCY_PROXY_USER" --password-stdin "$CI_DEPENDENCY_PROXY_SERVER"
    - |
      for img in python:3.12-slim-bookworm node:22-slim nginx:1.27-alpine; do
        docker pull -q "$CI_DEPENDENCY_PROXY_GROUP_IMAGE_PREFIX/$img" && docker tag "$CI_DEPENDENCY_PROXY_GROUP_IMAGE_PREFIX/$img" "$img"
      done
    - sh tools/release/build-artifacts.sh "$VERSION" dist
    - |
      if [ "$MODE" = nightly ]; then
        export RELEASE_SIGNING_KEY_B64="$NIGHTLY_SIGNING_KEY_B64" RELEASE_KEY_ID="$NIGHTLY_KEY_ID"
        PACKAGE=switchyard-nightly; FEED=nightly.json
      else
        PACKAGE=switchyard; FEED=releases.json
      fi
      API="$CI_API_V4_URL/projects/$CI_PROJECT_ID/packages/generic"
      upload() { curl --fail --silent --show-error --header "JOB-TOKEN: $CI_JOB_TOKEN" --upload-file "$1" "$2"; }
      BUNDLE="dist/switchyard-$VERSION.sybundle"
      sh tools/release/bundle.sh "$VERSION" dist
      if [ -n "${GITHUB_REPO:-}" ]; then
        # Public home: GitHub Releases (rolling "nightly" and "feed" releases, one release per tag), so controllers
        # can read the feed without a login. The bundle is built and signed here, then copied over.
        [ -n "${GITHUB_RELEASE_TOKEN:-}" ] || { echo "GITHUB_RELEASE_TOKEN is not set"; exit 1; }
        export GH_TOKEN="$GITHUB_RELEASE_TOKEN" GH_REPO="$GITHUB_REPO"
        if [ "$MODE" = nightly ]; then TAG=nightly; else TAG="$CI_COMMIT_TAG"; fi
        BASE="https://github.com/$GITHUB_REPO/releases/download"
        FEED_URL="$BASE/feed/$FEED"
        sh tools/release/feed.sh "$BUNDLE" "$BASE/$TAG/switchyard-$VERSION.sybundle" "dist/$FEED" "$FEED_URL"
        if [ "$MODE" = nightly ]; then
          gh release view nightly >/dev/null 2>&1 || gh release create nightly --prerelease --target main \
            --title "Nightly builds" --notes "Signed nightly upgrade bundles (the nightly channel). Not for production."
          gh release upload nightly "$BUNDLE" --clobber
          gh release view nightly --json assets --jq '.assets[].name | select(endswith(".sybundle"))' | sort | head -n -14 \
            | while read -r name; do gh release delete-asset nightly "$name" -y; done
        else
          # the tag reaches GitHub through the push mirror; wait for it
          for i in $(seq 30); do gh api "repos/$GITHUB_REPO/git/ref/tags/$TAG" >/dev/null 2>&1 && break; sleep 10; done
          flags=""; [ "$CHANNEL" = candidate ] && flags="--prerelease"
          gh release create "$TAG" $flags --verify-tag --generate-notes "$BUNDLE" "dist/$FEED"
        fi
        gh release view feed >/dev/null 2>&1 || gh release create feed --target main \
          --title "Release feeds" --notes "The signed feeds controllers read: releases.json and nightly.json. Replaced by each release."
        gh release upload feed "dist/$FEED" --clobber
        # GitLab keeps a private copy of the bundle (the GitLab release links to it)
        upload "$BUNDLE" "$API/$PACKAGE/$VERSION/switchyard-$VERSION.sybundle"
      else
        FEED_URL="$API/switchyard-feed/latest/$FEED"   # the one place controllers read the feed from
        sh tools/release/feed.sh "$BUNDLE" "$API/$PACKAGE/$VERSION/switchyard-$VERSION.sybundle" "dist/$FEED" "$FEED_URL"
        upload "$BUNDLE" "$API/$PACKAGE/$VERSION/switchyard-$VERSION.sybundle"
        upload "dist/$FEED" "$FEED_URL"
      fi
      # a copy next to the bundle, which the GitLab release links to
      [ "$MODE" = nightly ] || upload "dist/$FEED" "$API/$PACKAGE/$VERSION/$FEED"
  artifacts:
    paths: [dist/releases.json, dist/nightly.json]
    expire_in: 30 days
    when: always
