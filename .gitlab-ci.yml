# Same gates as controller/Makefile.

# A new push cancels the older pipelines of the same branch (their interruptible jobs).
workflow:
  auto_cancel:
    on_new_commit: interruptible

stages: [check, deploy]

# Docker Hub images come through the globius-oss group's Dependency Proxy (a cache, so no Docker Hub rate limit).
# ghcr.io and quay.io images are pulled directly.
default:
  image: ghcr.io/astral-sh/uv:python3.12-bookworm
  # The Kubernetes runner: privileged pods (docker:dind for the test job) and no host Docker socket needed.
  tags: [kubernetes, docker-privileged]
  interruptible: true
  cache:
    key: uv-$CI_COMMIT_REF_SLUG
    paths: [.cache/uv]

variables:
  UV_CACHE_DIR: $CI_PROJECT_DIR/.cache/uv

.controller:
  stage: check
  before_script:
    - cd controller
    - uv sync --frozen

lint:
  extends: .controller
  script:
    - uv run ruff check .
    - uv run ruff format --check .

typecheck:
  extends: .controller
  script:
    - uv run mypy

# Tests in two tiers. Every push and MR: the tests that need no Docker plus a small container smoke set.
# The full suite (every container test and the coverage gate) runs on main, on version tags (v*),
# nightly from a schedule, and by hand ("Run pipeline" with FULL_TESTS=1).
test:
  extends: .controller
  script:
    - uv run pytest -m "not docker"

.docker-tests:
  extends: .controller
  # Docker-backed tests (PostgreSQL, HAProxy) need a Docker daemon; use the dind service.
  services:
    - name: ${CI_DEPENDENCY_PROXY_GROUP_IMAGE_PREFIX}/docker:27-dind
      alias: docker
  variables:
    DOCKER_HOST: tcp://docker:2375
    DOCKER_TLS_CERTDIR: ""
    TESTCONTAINERS_HOST_OVERRIDE: docker
    TESTCONTAINERS_RYUK_DISABLED: "true"   # the pod is thrown away anyway; saves a Docker Hub pull
  before_script:
    - cd controller
    - uv sync --frozen
    - for i in $(seq 60); do uv run python -c "import docker; docker.from_env().ping()" 2>/dev/null && break; sleep 2; done
    # The SDK-created test containers do not pull missing images, and dind starts empty.
    - uv run python -m tests.ci_pull_images

test-smoke:
  extends: .docker-tests
  rules:
    - if: $CI_COMMIT_TAG || $CI_COMMIT_BRANCH == $CI_DEFAULT_BRANCH || $CI_PIPELINE_SOURCE == "schedule" || $FULL_TESTS
      when: never
    - when: on_success
  script:
    # RLS isolation, the apply pipeline end to end, and HAProxy validation of the rendered golden cases.
    # Bind mounts are resolved by dind: keep pytest's temporary files on the build volume it shares.
    - uv run pytest --basetemp="$CI_PROJECT_DIR/.pytest-tmp" -p no:cacheprovider
      tests/integration/test_rls.py tests/integration/test_apply_pipeline.py
      "tests/integration/test_golden_haproxy.py::test_haproxy_accepts_rendered_config[01-minimal-http]"

test-full:
  extends: .docker-tests
  timeout: 3h
  interruptible: false
  rules:
    - if: $CI_COMMIT_TAG || $CI_COMMIT_BRANCH == $CI_DEFAULT_BRANCH || $CI_PIPELINE_SOURCE == "schedule" || $FULL_TESTS
  script:
    - uv run pytest --basetemp="$CI_PROJECT_DIR/.pytest-tmp" --cov --cov-report=term-missing --cov-report=xml
    - uv run coverage report --include="switchyard/domain/*,switchyard/render/*,switchyard/pipeline/*" --fail-under=85
  coverage: '/TOTAL.*\s+(\d+(?:\.\d+)?)%/'
  artifacts:
    reports:
      coverage_report:
        coverage_format: cobertura
        path: controller/coverage.xml

openapi-breaking:
  extends: .controller
  rules:
    - if: $CI_MERGE_REQUEST_ID
  script:
    - git fetch origin $CI_MERGE_REQUEST_TARGET_BRANCH_NAME
    - git show origin/$CI_MERGE_REQUEST_TARGET_BRANCH_NAME:docs/api/openapi.json > /tmp/old-openapi.json || exit 0
    - uv run python -m switchyard.api.openapi_check /tmp/old-openapi.json ../docs/api/openapi.json

# The agent (Go) and the SE image recipe. The image test provisions Debian 13 with every binary and runs
# se-image/test/check.sh (units, sysctls, the auth sidecar slot, Data Plane API over mTLS).
agent:
  stage: check
  image: ${CI_DEPENDENCY_PROXY_GROUP_IMAGE_PREFIX}/golang:1.26
  script:
    - cd agent
    - test -z "$(gofmt -l .)"
    - go vet ./...
    - go test ./...

se-image:
  stage: check
  image: ${CI_DEPENDENCY_PROXY_GROUP_IMAGE_PREFIX}/docker:27
  services:
    - name: ${CI_DEPENDENCY_PROXY_GROUP_IMAGE_PREFIX}/docker:27-dind
      alias: docker
  variables:
    DOCKER_HOST: tcp://docker:2375
    DOCKER_TLS_CERTDIR: ""
  rules:
    - changes: [se-image/**/*, agent/**/*]
  script:
    - for i in $(seq 60); do docker info >/dev/null 2>&1 && break; sleep 2; done  # dind starts after the job
    - echo "$CI_DEPENDENCY_PROXY_PASSWORD" | docker login -u "$CI_DEPENDENCY_PROXY_USER" --password-stdin "$CI_DEPENDENCY_PROXY_SERVER"
    - docker build -q --build-arg REGISTRY="$CI_DEPENDENCY_PROXY_GROUP_IMAGE_PREFIX/" -f se-image/test/Dockerfile -t sy-se-image-test .

# The Helm chart (deploy/helm): lint, render with the value sets people use, check the invariants.
helm:
  stage: check
  image:
    name: ${CI_DEPENDENCY_PROXY_GROUP_IMAGE_PREFIX}/alpine/helm:3.18.6
    entrypoint: [""]
  rules:
    - changes: [deploy/helm/**/*]
  script:
    - sh deploy/helm/test.sh

# The live checks (.p12 import, 412/428 conflict responses: deploy/lab/checks/live.sh) need a running stack and the lab
# scripts; they are run by hand, see docs/runbooks/lab-hosts.md.

# Docs site (ADR 0190): strict MkDocs build with link checking on every pipeline, published to GitLab
# Pages from main. Same as `make docs` locally.
docs:
  stage: check
  script:
    - uvx --with-requirements docs/requirements.txt mkdocs build --strict
  artifacts:
    paths: [public]
    expire_in: 1 week

pages:
  stage: deploy
  interruptible: false   # never stop a Pages publish halfway
  needs: [docs]
  rules:
    - if: $CI_COMMIT_BRANCH == $CI_DEFAULT_BRANCH
  script:
    - test -f public/index.html
  artifacts:
    paths: [public]
