# GitLab secret detection ruleset. Keeps the default gitleaks rules and allows the reviewed
# fixtures and placeholders (test keys, generated API docs, the local development database URL).
# The same reviewed findings are tracked for the CI gitleaks job in .gitleaksignore.
[secrets]
  [[secrets.passthrough]]
    type = "raw"
    target = "gitleaks.toml"
    value = """
title = "Switchyard"

[extend]
useDefault = true

[[allowlists]]
description = "Test fixtures, generated API docs and example keys in docstrings (no real keys)"
paths = [
  '''controller/tests/''',
  '''ui/tests/''',
  '''ui/src/api/schema\.d\.ts''',
  '''docs/api/openapi\.json''',
  '''controller/switchyard/services/certs\.py''',
  '''controller/switchyard/domain/validators\.py''',
  '''controller/switchyard/api/docs_meta\.py''',
]

[[allowlists]]
description = "Local development database URL (postgres:postgres on loopback) and lab placeholders"
regexTarget = "line"
regexes = [
  '''postgres:postgres@127\.0\.0\.1''',
]
paths = [
  '''deploy/(lab/e2e|telemetry|proxy)/[^/]*\.sh''',
]
"""
