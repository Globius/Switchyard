repos:
  - repo: local
    hooks:
      - id: ruff-check
        name: ruff check
        entry: uv run --project controller ruff check --fix
        language: system
        types: [python]
      - id: ruff-format
        name: ruff format
        entry: uv run --project controller ruff format
        language: system
        types: [python]
      - id: mypy
        name: mypy --strict
        entry: uv run --project controller mypy
        language: system
        types: [python]
        pass_filenames: false
