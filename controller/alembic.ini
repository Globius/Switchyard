# Convenience for the `alembic` CLI. The application uses switchyard.db.migrate instead.
# Set SWITCHYARD_DATABASE_URL (see switchyard/config.py) and run, from controller/:
#   uv run alembic -c alembic.ini upgrade head
[alembic]
script_location = switchyard/db/migrations
sqlalchemy.url = postgresql+psycopg://postgres:postgres@127.0.0.1:5432/switchyard
