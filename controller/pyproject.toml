[project]
name = "switchyard"
version = "0.1.0"
description = "Switchyard controller: multi-tenant HAProxy service-engine control plane"
requires-python = ">=3.12,<3.13"
dependencies = [
  "pydantic>=2.9",
  "sqlalchemy[asyncio]>=2.0.36",
  "alembic>=1.14",
  "psycopg[binary]>=3.2",
  "jinja2>=3.1.4",
  "typer>=0.15",
  "pyyaml>=6.0",
  "httpx>=0.28.1",
  "docker>=7.2.0",
  "fastapi>=0.143.0",
  "uvicorn>=0.54.0",
  "grpcio>=1.84.0",
  "protobuf>=6.0",
  "cryptography>=50.0.2",
  "acme>=5.8.0",
  "joserfc>=1.7.5",
  "signxml>=5.1.0",
  "dnspython>=2.9.0",
  "asyncssh>=2.24.1",
  "defusedxml>=0.7.1",
]

[project.scripts]
syctl = "switchyard.cli:app"

[dependency-groups]
dev = [
  "types-defusedxml>=0.7.0",
  "pytest>=8.3",
  "pytest-asyncio>=0.24",
  "pytest-cov>=6.0",
  "hypothesis>=6.120",
  "testcontainers[postgres]>=4.9",
  "ruff>=0.8",
  "mypy>=1.13",
  "pre-commit>=4.0",
  "types-PyYAML>=6.0",
  "grpcio-tools>=1.84.0",
  "jsonschema>=4.26.0",
  "types-jsonschema>=4.26.0.20261006",
  "pytest-timeout>=2.3",
]

[build-system]
requires = ["uv_build>=0.12.23,<0.13.0"]
build-backend = "uv_build"

[tool.uv.build-backend]
module-root = ""

[tool.ruff]
line-length = 100
target-version = "py312"
extend-exclude = ["tests/golden", "switchyard/adapters/agentpb"]

[tool.ruff.lint]
select = ["E", "F", "W", "I", "N", "UP", "B", "A", "C4", "SIM", "RUF", "D", "S", "PT", "T20"]
ignore = ["D203", "D213", "RUF012", "N818"]

[tool.ruff.lint.per-file-ignores]
"tests/**" = ["D", "S101", "S105", "S106", "S608", "PT011", "E501", "S603", "S607", "PT018"]
"tools_gen_proto.py" = ["E501", "S603", "E402", "D"]
"switchyard/db/migrations/**" = ["D", "S608", "E501", "UP", "RUF", "I"]
"switchyard/api/docs_meta.py" = ["E501"]

[tool.ruff.lint.pydocstyle]
convention = "google"

[tool.mypy]
python_version = "3.12"
strict = true
plugins = ["pydantic.mypy"]
files = ["switchyard", "tests"]
exclude = ["switchyard/adapters/agentpb/"]

[[tool.mypy.overrides]]
module = ["testcontainers.*", "docker.*", "grpc.*", "grpc_tools.*", "lxml.*", "signxml.*"]
ignore_missing_imports = true

[tool.pytest.ini_options]
testpaths = ["tests", "switchyard"]
addopts = "-ra --strict-markers --doctest-modules --ignore-glob=switchyard/db/migrations/* --ignore-glob=switchyard/adapters/agentpb/*"
markers = [
  "docker: needs a Docker daemon (PostgreSQL or HAProxy containers)",
]
asyncio_mode = "auto"
asyncio_default_fixture_loop_scope = "function"
# A hang must fail with a stack, not consume the job until the CI cap kills it: the ACME pebble
# image pull inside dind hung once and the only evidence was 80 minutes of silence.  Nosec so a
# deliberate timeout can still be requested per test.
timeout = 900
timeout_method = "thread"

[tool.coverage.run]
source = ["switchyard"]
branch = true

[tool.coverage.report]
show_missing = true
