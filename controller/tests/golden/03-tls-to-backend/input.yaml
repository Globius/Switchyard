render:
  se_group: seg-edge
tenants:
- id: t-acme
  name: acme
networks:
- id: net-lb
  tenant_id: t-acme
  name: lb
  cidr: 192.0.2.0/24
  gateway: 192.0.2.1
- id: net-be
  tenant_id: t-acme
  name: backend
  cidr: 10.20.0.0/16
se_groups:
- id: seg-edge
  tenant_id: t-acme
  name: edge
  ha_mode: vrrp
  networks:
  - network_id: net-lb
    role: vip
  - network_id: net-be
    role: backend
certificates:
- id: c-wild
  tenant_id: t-acme
  name: wild-example-test
  source: cloudflare_origin
  sans:
  - '*.example.test'
  not_after: '2038-01-01T00:00:00+00:00'
  secret_ref: kv/tenants/acme/certs/wild-example-test
pools:
- id: p-nonverified
  tenant_id: t-acme
  name: ubiquiti
  members:
  - address: 10.20.2.4
    port: 8443
  tls: true
  health_monitor_id: hm-https
- id: p-verified
  tenant_id: t-acme
  name: rancher
  members:
  - address: 10.20.2.5
    port: 443
  tls: true
  tls_verify: true
health_monitors:
- id: hm-https
  tenant_id: t-acme
  name: https-ok
  type: http
  http:
    path: /health
    expect_status:
    - 200
virtual_services:
- id: v-tls
  tenant_id: t-acme
  se_group_id: seg-edge
  name: tls-backends
  protocol: http
  vip: 192.0.2.22
  ports:
  - port: 443
    tls: true
    http2: true
  certificate_ids:
  - c-wild
  routes:
  - match:
      host: uisp.example.test
    pool_id: p-nonverified
  - match:
      host: rancher.example.test
    pool_id: p-verified
