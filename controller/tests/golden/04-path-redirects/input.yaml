render:
  se_group: seg-edge
tenants:
- id: t-acme
  name: acme
networks:
- id: net-lb
  tenant_id: t-acme
  name: lb
  cidr: 192.0.2.0/24
  gateway: 192.0.2.1
- id: net-be
  tenant_id: t-acme
  name: backend
  cidr: 10.20.0.0/16
se_groups:
- id: seg-edge
  tenant_id: t-acme
  name: edge
  ha_mode: vrrp
  networks:
  - network_id: net-lb
    role: vip
  - network_id: net-be
    role: backend
certificates:
- id: c-files
  tenant_id: t-acme
  name: files-example-test
  source: cloudflare_origin
  sans:
  - files.example.test
  not_after: '2038-01-01T00:00:00+00:00'
  secret_ref: kv/tenants/acme/certs/files-example-test
pools:
- id: p-nc
  tenant_id: t-acme
  name: nextcloud
  members:
  - address: 10.20.3.7
    port: 11000
- id: p-docs
  tenant_id: t-acme
  name: docs
  members:
  - address: 10.20.3.8
    port: 8080
policy_sets:
- id: ps-dav
  tenant_id: t-acme
  name: nextcloud-dav
  kind: redirect
  rules:
  - match:
      path_prefix: /.well-known/carddav
    redirect:
      location: /remote.php/dav/
      code: 301
  - match:
      path_prefix: /.well-known/caldav
    redirect:
      location: /remote.php/dav/
      code: 301
virtual_services:
- id: v-files
  tenant_id: t-acme
  se_group_id: seg-edge
  name: files
  protocol: http
  vip: 192.0.2.23
  ports:
  - port: 443
    tls: true
  - port: 80
    https_redirect_port: 443
  certificate_ids:
  - c-files
  policy_set_ids:
  - ps-dav
  routes:
  - match:
      host: files.example.test
      path_prefix: /docs
    pool_id: p-docs
    order: 1
  - match:
      host: files.example.test
      path_exact: /old
    redirect:
      location: https://files.example.test/new
      code: 302
    order: 2
  - match:
      host: files.example.test
    pool_id: p-nc
