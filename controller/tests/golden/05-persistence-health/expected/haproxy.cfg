# Managed by Switchyard. Do not edit: changes are overwritten and reported as drift.
# SE group: edge

global
    log /dev/log local0
    maxconn 20000
    stats socket /run/haproxy/admin.sock mode 660 level admin expose-fd listeners
    ssl-default-bind-options ssl-min-ver TLSv1.2 no-tls-tickets
    ssl-default-server-options ssl-min-ver TLSv1.2

defaults
    log global
    option dontlognull
    option redispatch
    retries 3
    timeout connect 5s
    timeout client 50s
    timeout server 50s
    timeout http-request 10s
    timeout http-keep-alive 10s
    timeout tunnel 1h

frontend vs_billing
    mode http
    bind 192.0.2.24:80
    option httplog
    option forwardfor
    http-request del-header X-Forwarded-For
    http-request set-header X-Forwarded-Proto https if { ssl_fc }
    http-request set-header X-Forwarded-Proto http if !{ ssl_fc }
    http-request set-var(txn.host) req.hdr(host),field(1,:),lower
    use_backend %[var(txn.host),map(/etc/switchyard/haproxy/maps/billing.host.map)] if { var(txn.host),map(/etc/switchyard/haproxy/maps/billing.host.map) -m found }
    default_backend pool_sticky-hash

backend pool_billing
    mode http
    balance leastconn
    stick-table type ipv6 size 50000 expire 3600s
    stick on src
    option httpchk
    http-check send meth GET uri /healthz ver HTTP/1.1 hdr Host billing.example.test
    http-check expect status 200,204
    timeout check 4s
    default-server inter 10s fall 2 rise 3
    server 10-20-4-2-443 10.20.4.2:443 check check-ssl ssl verify none sni req.hdr(host),field(1,:),lower weight 100
    server 10-20-4-3-443 10.20.4.3:443 check check-ssl ssl verify none sni req.hdr(host),field(1,:),lower weight 50
    server 10-20-4-4-443 10.20.4.4:443 check check-ssl ssl verify none sni req.hdr(host),field(1,:),lower weight 0
    server spare 10.20.4.5:443 check check-ssl ssl verify none sni req.hdr(host),field(1,:),lower weight 100 disabled

backend pool_plain
    mode http
    balance random
    timeout check 3s
    default-server inter 5s fall 3 rise 2
    server 10-20-4-10-80 10.20.4.10:80 check weight 100

backend pool_sticky-hash
    mode http
    balance source
    server 10-20-4-11-80 10.20.4.11:80 weight 100
    server 10-20-4-12-80 10.20.4.12:80 weight 100
