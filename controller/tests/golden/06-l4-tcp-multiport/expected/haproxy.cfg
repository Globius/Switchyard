# Managed by Switchyard. Do not edit: changes are overwritten and reported as drift.
# SE group: edge

global
    log /dev/log local0
    maxconn 20000
    stats socket /run/haproxy/admin.sock mode 660 level admin expose-fd listeners
    ssl-default-bind-options ssl-min-ver TLSv1.2 no-tls-tickets
    ssl-default-server-options ssl-min-ver TLSv1.2

defaults
    log global
    option dontlognull
    option redispatch
    retries 3
    timeout connect 5s
    timeout client 50s
    timeout server 50s
    timeout http-request 10s
    timeout http-keep-alive 10s
    timeout tunnel 1h

frontend vs_k8s-api
    mode tcp
    bind 192.0.2.27:6443
    option tcplog
    default_backend pool_k8s-api

frontend vs_k8s-ingress
    mode tcp
    bind 192.0.2.29:80
    bind 192.0.2.29:443 ssl crt-list /etc/switchyard/haproxy/crt-lists/k8s-ingress.crtlist
    option tcplog
    default_backend pool_k8s-ingress

frontend vs_k8s-registration
    mode tcp
    bind 192.0.2.28:9345 accept-proxy
    option tcplog
    default_backend pool_k8s-registration

backend pool_k8s-api
    mode tcp
    balance leastconn
    timeout check 2s
    default-server inter 3s fall 3 rise 2
    server 10-20-6-27-6443 10.20.6.27:6443 check weight 100
    server 10-20-6-28-6443 10.20.6.28:6443 check weight 100
    server 10-20-6-29-6443 10.20.6.29:6443 check weight 100

backend pool_k8s-ingress
    mode tcp
    balance roundrobin
    timeout check 3s
    default-server inter 5s fall 3 rise 2
    server 10-20-6-30 10.20.6.30 check port 80 weight 100
    server 10-20-6-31 10.20.6.31 check port 80 weight 100

backend pool_k8s-registration
    mode tcp
    balance roundrobin
    server 10-20-6-27-9345 10.20.6.27:9345 weight 100
    server 10-20-6-28-9345 10.20.6.28:9345 weight 100
