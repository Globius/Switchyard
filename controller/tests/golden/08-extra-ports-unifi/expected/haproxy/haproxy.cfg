# Managed by Switchyard. Do not edit: changes are reported as drift.
# SE group: edge
# switchyard-render: sha256:dcbd5ec7e45fdb1f60a2b3843a3ce5c79134041e3dfc741ba4efde4eb04df260

global
    log /dev/log local0
    maxconn 20000
    stats socket /run/haproxy/admin.sock mode 660 level admin expose-fd listeners
    ssl-default-bind-options ssl-min-ver TLSv1.2 no-tls-tickets
    ssl-default-server-options ssl-min-ver TLSv1.2

defaults
    log global
    option dontlognull
    option redispatch
    retries 3
    unique-id-format %[uuid()]
    timeout connect 5s
    timeout client 50s
    timeout server 50s
    timeout http-request 10s
    timeout http-keep-alive 10s
    timeout tunnel 1h

# Local health endpoint for keepalived's check script and the agent's route-health watchdog.
frontend sy_local_health
    mode http
    bind 127.0.0.1:8404
    monitor-uri /healthz
    no log

frontend vs_unifi-sni
    mode http
    bind 192.0.2.32:80
    bind 192.0.2.32:443 ssl crt-list /etc/switchyard/certs/unifi-sni.crtlist alpn h2,http/1.1,acme-tls/1
    bind 192.0.2.32:6789
    bind 192.0.2.32:8075
    bind 192.0.2.32:8682
    bind 192.0.2.32:8843 ssl crt-list /etc/switchyard/certs/unifi-sni.crtlist alpn http/1.1,acme-tls/1
    bind 192.0.2.32:8880
    option httplog
    log-format "%ci:%cp [%tr] %f %b/%s %TR/%Tw/%Tc/%Tr/%Ta %ST %B request_id=%ID sni=%{+Q}[ssl_fc_sni] host=%{+Q}[var(txn.host)] upstream=%[bc_dst] upstream_port=%[bc_dst_port] retries=%rc %tsc %ac/%fc/%bc/%sc %sq/%bq %hr %hs %{+Q}r"
    option forwardfor
    http-request return status 200 content-type text/plain lf-string "%[path,map(/etc/switchyard/haproxy/maps/acme-http01.map)]" if { dst_port 80 } { path,map(/etc/switchyard/haproxy/maps/acme-http01.map) -m found }
    http-request del-header X-Forwarded-For
    http-request set-header X-Forwarded-Proto https if { ssl_fc }
    http-request set-header X-Forwarded-Proto http if !{ ssl_fc }
    http-request set-var(txn.host) req.hdr(host),field(1,:),lower
    http-request redirect prefix "https://%[var(txn.host)]" code 301 if { dst_port 80 }
    use_backend %[var(txn.host),map(/etc/switchyard/haproxy/maps/unifi-sni-host.map)] if { var(txn.host),map(/etc/switchyard/haproxy/maps/unifi-sni-host.map) -m found }
    default_backend pool_unifi

backend pool_unifi
    mode http
    balance roundrobin
    server 10-20-8-4 10.20.8.4 ssl verify none sni req.hdr(host),field(1,:),lower weight 100

backend pool_web
    mode http
    balance roundrobin
    server 10-20-8-5-8080 10.20.8.5:8080 weight 100
