render:
  se_group: seg-edge
tenants:
- id: t-acme
  name: acme
networks:
- id: net-lb
  tenant_id: t-acme
  name: lb
  cidr: 192.0.2.0/24
  gateway: 192.0.2.1
- id: net-be
  tenant_id: t-acme
  name: backend
  cidr: 10.20.0.0/16
se_groups:
- id: seg-edge
  tenant_id: t-acme
  name: edge
  ha_mode: vrrp
  networks:
  - network_id: net-lb
    role: vip
  - network_id: net-be
    role: backend
certificates:
- id: c-wild
  tenant_id: t-acme
  name: wild-example-test
  source: cloudflare_origin
  sans:
  - '*.example.test'
  not_after: '2038-01-01T00:00:00+00:00'
  secret_ref: kv/tenants/acme/certs/wild-example-test
pools:
- id: p-unifi
  tenant_id: t-acme
  name: unifi
  members:
  - address: 10.20.8.4
  tls: true
- id: p-web
  tenant_id: t-acme
  name: web
  members:
  - address: 10.20.8.5
    port: 8080
virtual_services:
- id: v-unifi
  tenant_id: t-acme
  se_group_id: seg-edge
  name: unifi-sni
  protocol: http
  vip: 192.0.2.32
  ports:
  - port: 443
    tls: true
    http2: true
  - port: 80
    https_redirect_port: 443
  - port: 8880
  - port: 8843
    tls: true
  - port: 8075
  - port: 6789
  - port: 8682
  certificate_ids:
  - c-wild
  routes:
  - match:
      host: web.example.test
    pool_id: p-web
  default_pool_id: p-unifi
