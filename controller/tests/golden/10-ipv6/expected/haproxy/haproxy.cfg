# SE group: edge
# switchyard-render: sha256:45f89ef0b75aa8f5eb91725592270f7f989a9bdbbed3edf954277796e2700b3e

global
    log /dev/log local0
    maxconn 20000
    stats socket /run/haproxy/admin.sock mode 660 level admin expose-fd listeners
    ssl-default-bind-options ssl-min-ver TLSv1.2 no-tls-tickets
    ssl-default-server-options ssl-min-ver TLSv1.2

defaults
    log global
    option dontlognull
    option redispatch
    retries 3
    timeout connect 5s
    timeout client 50s
    timeout server 50s
    timeout http-request 10s
    timeout http-keep-alive 10s
    timeout tunnel 1h

frontend vs_v6-site
    mode http
    bind ipv6@2001:db8:10::20:80 accept-proxy
    bind ipv6@2001:db8:10::20:8080
    option httplog
    option forwardfor
    tcp-request session reject if !{ src -f /etc/switchyard/haproxy/lists/office.cidr }
    http-request del-header X-Forwarded-For
    http-request set-header X-Forwarded-Proto https if { ssl_fc }
    http-request set-header X-Forwarded-Proto http if !{ ssl_fc }
    http-request set-var(txn.host) req.hdr(host),field(1,:),lower
    default_backend pool_dual

backend pool_dual
    mode http
    balance roundrobin
    server 10-20-10-10-8080 10.20.10.10:8080 weight 100
    server 2001-db8-20--10-8080 ipv6@2001:db8:20::10:8080 weight 100
