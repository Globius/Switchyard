# SE group: edge
# switchyard-render: sha256:e4858252dee881f4312f25ca0cbb322fddc34a99fe706b18b9dfa812562ceb80

global
    log /dev/log local0
    maxconn 20000
    stats socket /run/haproxy/admin.sock mode 660 level admin expose-fd listeners
    ssl-default-bind-options ssl-min-ver TLSv1.2 no-tls-tickets
    ssl-default-server-options ssl-min-ver TLSv1.2

defaults
    log global
    option dontlognull
    option redispatch
    retries 3
    timeout connect 5s
    timeout client 50s
    timeout server 50s
    timeout http-request 10s
    timeout http-keep-alive 10s
    timeout tunnel 1h

# Local health endpoint for keepalived's check script and the agent's route-health watchdog.
frontend sy_local_health
    mode http
    bind 127.0.0.1:8404
    monitor-uri /healthz
    no log

frontend vs_sni-edge
    mode http
    bind 192.0.2.21:80
    bind 192.0.2.21:443 ssl crt-list /etc/switchyard/certs/sni-edge.crtlist ssl-min-ver TLSv1.2 ciphers ECDHE-ECDSA-AES128-GCM-SHA256:ECDHE-RSA-AES128-GCM-SHA256:ECDHE-ECDSA-AES256-GCM-SHA384:ECDHE-RSA-AES256-GCM-SHA384:ECDHE-ECDSA-CHACHA20-POLY1305:ECDHE-RSA-CHACHA20-POLY1305:DHE-RSA-AES128-GCM-SHA256:DHE-RSA-AES256-GCM-SHA384:DHE-RSA-CHACHA20-POLY1305 ciphersuites TLS_AES_128_GCM_SHA256:TLS_AES_256_GCM_SHA384:TLS_CHACHA20_POLY1305_SHA256 alpn h2,http/1.1
    bind 192.0.2.21:8443 ssl crt-list /etc/switchyard/certs/sni-edge.crtlist ca-file /etc/switchyard/certs/ca-partner-ca.pem verify required crl-file /etc/switchyard/certs/ca-partner-ca.crl ssl-min-ver TLSv1.3 ciphersuites TLS_AES_128_GCM_SHA256:TLS_AES_256_GCM_SHA384:TLS_CHACHA20_POLY1305_SHA256 alpn http/1.1
    bind 192.0.2.21:9443 ssl crt-list /etc/switchyard/certs/sni-edge.crtlist ca-file /etc/switchyard/certs/ca-partner-ca.pem verify optional crl-file /etc/switchyard/certs/ca-partner-ca.crl alpn http/1.1
    option httplog
    option forwardfor
    http-request return status 200 content-type text/plain lf-string "%[path,map(/etc/switchyard/haproxy/maps/acme-http01.map)]" if { dst_port 80 } { path,map(/etc/switchyard/haproxy/maps/acme-http01.map) -m found }
    http-request del-header X-Forwarded-For
    http-request set-header X-Forwarded-Proto https if { ssl_fc }
    http-request set-header X-Forwarded-Proto http if !{ ssl_fc }
    http-request set-var(txn.host) req.hdr(host),field(1,:),lower
    http-request redirect prefix "https://%[var(txn.host)]" code 301 if { dst_port 80 }
    use_backend %[var(txn.host),map(/etc/switchyard/haproxy/maps/sni-edge-host.map)] if { var(txn.host),map(/etc/switchyard/haproxy/maps/sni-edge-host.map) -m found }
    use_backend %[var(txn.host),map_reg(/etc/switchyard/haproxy/maps/sni-edge-wild.map)] if { var(txn.host),map_reg(/etc/switchyard/haproxy/maps/sni-edge-wild.map) -m found }
    default_backend pool_catchall

backend pool_app
    mode http
    balance roundrobin
    server 10-20-1-11-8080 10.20.1.11:8080 weight 100
    server 10-20-1-12-8080 10.20.1.12:8080 weight 100

backend pool_catchall
    mode http
    balance roundrobin
    server 10-20-1-99-80 10.20.1.99:80 weight 100

backend pool_shop
    mode http
    balance roundrobin
    server 10-20-1-31-8000 10.20.1.31:8000 weight 100

backend pool_wiki
    mode http
    balance roundrobin
    server 10-20-1-21-3000 10.20.1.21:3000 weight 100
