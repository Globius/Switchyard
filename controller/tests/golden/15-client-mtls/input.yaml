render:
  se_group: seg-edge
tenants:
- id: t-acme
  name: acme
networks:
- id: net-lb
  tenant_id: t-acme
  name: lb
  cidr: 192.0.2.0/24
  gateway: 192.0.2.1
- id: net-be
  tenant_id: t-acme
  name: backend
  cidr: 10.20.0.0/16
se_groups:
- id: seg-edge
  tenant_id: t-acme
  name: edge
  ha_mode: vrrp
  networks:
  - network_id: net-lb
    role: vip
  - network_id: net-be
    role: backend
certificates:
- id: c-wild
  tenant_id: t-acme
  name: wild-example-test
  source: cloudflare_origin
  sans:
  - '*.example.test'
  - '*.apps.example.test'
  - example.test
  not_after: '2038-01-01T00:00:00+00:00'
  secret_ref: kv/tenants/acme/certs/wild-example-test
- id: c-shop
  tenant_id: t-acme
  name: shop-example-org
  source: acme
  ocsp_stapling: true
  sans:
  - shop.example.org
  not_after: '2038-01-01T00:00:00+00:00'
  secret_ref: kv/tenants/acme/certs/shop-example-org
- id: c-ca
  tenant_id: t-acme
  name: partner-ca
  source: upload
  purpose: client_ca
  sans: []
  not_after: '2038-01-01T00:00:00+00:00'
  secret_ref: kv/tenants/acme/certs/partner-ca/01
  crl_secret_ref: kv/tenants/acme/certs/partner-ca/01-crl
pools:
- id: p-app
  tenant_id: t-acme
  name: app
  members:
  - address: 10.20.1.11
    port: 8080
  - address: 10.20.1.12
    port: 8080
- id: p-wiki
  tenant_id: t-acme
  name: wiki
  members:
  - address: 10.20.1.21
    port: 3000
- id: p-shop
  tenant_id: t-acme
  name: shop
  members:
  - address: 10.20.1.31
    port: 8000
- id: p-catch
  tenant_id: t-acme
  name: catchall
  members:
  - address: 10.20.1.99
    port: 80
virtual_services:
- id: v-sni
  tenant_id: t-acme
  se_group_id: seg-edge
  name: sni-edge
  protocol: http
  vip: 192.0.2.21
  ports:
  - port: 443
    tls: true
    http2: true
    tls_profile: intermediate
  - port: 8443
    tls: true
    tls_profile: modern
    client_ca_id: c-ca
    client_verify: required
  - port: 9443
    tls: true
    client_ca_id: c-ca
    client_verify: optional
  - port: 80
    https_redirect_port: 443
  certificate_ids:
  - c-wild
  - c-shop
  routes:
  - match:
      host: app.example.test
    pool_id: p-app
  - match:
      host: wiki.example.test
    pool_id: p-wiki
  - match:
      host: '*.apps.example.test'
    pool_id: p-app
  - match:
      host: shop.example.org
    pool_id: p-shop
  default_pool_id: p-catch
