# Managed by Switchyard. Do not edit: changes are reported as drift.
# SE group: edge
# switchyard-render: sha256:f6e2035d19734ce5ca134a7b790e2d0fe0e382e7ee4b0895028c3c61b0aeb853

global
    log /dev/log local0
    maxconn 20000
    stats socket /run/haproxy/admin.sock mode 660 level admin expose-fd listeners
    ssl-default-bind-options ssl-min-ver TLSv1.2 no-tls-tickets
    ssl-default-server-options ssl-min-ver TLSv1.2

defaults
    log global
    option dontlognull
    option redispatch
    retries 3
    timeout connect 5s
    timeout client 50s
    timeout server 50s
    timeout http-request 10s
    timeout http-keep-alive 10s
    timeout tunnel 1h

# Local health endpoint for keepalived's check script and the agent's route-health watchdog.
frontend sy_local_health
    mode http
    bind 127.0.0.1:8404
    monitor-uri /healthz
    no log

frontend vs_public-site
    mode http
    bind 192.0.2.40:443 ssl crt-list /etc/switchyard/certs/public-site.crtlist alpn http/1.1,acme-tls/1
    option httplog
    option forwardfor
    http-request set-var(txn.trusted) bool(true) if { src -f /etc/switchyard/haproxy/lists/cloudflare-ranges.cidr }
    http-request set-src hdr(CF-Connecting-IP) if { var(txn.trusted) -m bool } { hdr(CF-Connecting-IP) -m found }
    http-request del-header CF-Connecting-IP if !{ var(txn.trusted) -m bool }
    http-request deny deny_status 403 if { src -f /etc/switchyard/haproxy/lists/blocked-countries.cidr }
    http-request del-header X-Forwarded-For
    http-request set-header X-Forwarded-Proto https if { ssl_fc }
    http-request set-header X-Forwarded-Proto http if !{ ssl_fc }
    http-request set-var(txn.host) req.hdr(host),field(1,:),lower
    use_backend %[var(txn.host),map(/etc/switchyard/haproxy/maps/public-site-host.map)] if { var(txn.host),map(/etc/switchyard/haproxy/maps/public-site-host.map) -m found }

frontend vs_raw-service
    mode tcp
    bind 192.0.2.41:5432
    option tcplog
    tcp-request session reject if { src -f /etc/switchyard/haproxy/lists/bad-reputation.cidr }
    default_backend pool_db

backend pool_db
    mode tcp
    balance roundrobin
    server 10-20-7-20-5432 10.20.7.20:5432 weight 100

backend pool_site
    mode http
    balance roundrobin
    server 10-20-7-10-8080 10.20.7.10:8080 weight 100
