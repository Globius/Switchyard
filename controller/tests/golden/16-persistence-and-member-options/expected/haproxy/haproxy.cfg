# SE group: edge
# switchyard-render: sha256:2f33785c50a96d7decc99c8217ab918252b6f33bd0c0935ca84b87daa409a4e7

global
    log /dev/log local0
    maxconn 20000
    stats socket /run/haproxy/admin.sock mode 660 level admin expose-fd listeners
    ssl-default-bind-options ssl-min-ver TLSv1.2 no-tls-tickets
    ssl-default-server-options ssl-min-ver TLSv1.2

defaults
    log global
    option dontlognull
    option redispatch
    retries 3
    timeout connect 5s
    timeout client 50s
    timeout server 50s
    timeout http-request 10s
    timeout http-keep-alive 10s
    timeout tunnel 1h

# Local health endpoint for keepalived's check script and the agent's route-health watchdog.
frontend sy_local_health
    mode http
    bind 127.0.0.1:8404
    monitor-uri /healthz
    no log

frontend vs_web
    mode http
    bind 192.0.2.30:80
    option httplog
    option forwardfor
    http-request return status 200 content-type text/plain lf-string "%[path,map(/etc/switchyard/haproxy/maps/acme-http01.map)]" if { dst_port 80 } { path,map(/etc/switchyard/haproxy/maps/acme-http01.map) -m found }
    http-request del-header X-Forwarded-For
    http-request set-header X-Forwarded-Proto https if { ssl_fc }
    http-request set-header X-Forwarded-Proto http if !{ ssl_fc }
    http-request set-var(txn.host) req.hdr(host),field(1,:),lower
    use_backend %[var(txn.host),map(/etc/switchyard/haproxy/maps/web-host.map)] if { var(txn.host),map(/etc/switchyard/haproxy/maps/web-host.map) -m found }
    default_backend pool_proxied

backend pool_cookie-insert
    mode http
    balance roundrobin
    cookie SY_SRV insert indirect nocache maxlife 3600s secure httponly
    server 10-20-5-2-8080 10.20.5.2:8080 cookie m46cc17fa5eb5 weight 100
    server 10-20-5-3-8080 10.20.5.3:8080 cookie m3aea626aae88 weight 100 maxconn 200
    server standby 10.20.5.4:8080 cookie m85a494c70136 weight 100 backup

backend pool_cookie-prefix
    mode http
    balance roundrobin
    cookie JSESSIONID prefix
    server 10-20-5-5-8080 10.20.5.5:8080 cookie mcd73a83546d0 weight 100

backend pool_header-sticky
    mode http
    balance roundrobin
    stick-table type string len 128 size 20000 expire 900s
    stick on req.hdr(X-Session-Id)
    server 10-20-5-6-8080 10.20.5.6:8080 weight 100

backend pool_proxied
    mode http
    balance roundrobin
    server 10-20-5-9-9000 10.20.5.9:9000 send-proxy-v2 weight 100

backend pool_uri-param
    mode http
    balance roundrobin
    stick-table type string len 128 size 100000 expire 1800s
    stick on url_param(tenant)
    server 10-20-5-7-8080 10.20.5.7:8080 weight 100

backend pool_uri-path
    mode http
    balance roundrobin
    stick-table type string len 128 size 100000 expire 1800s
    stick on path
    server 10-20-5-8-8080 10.20.5.8:8080 weight 100
