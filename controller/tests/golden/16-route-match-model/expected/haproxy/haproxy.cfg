# switchyard-render: sha256:a47960ed3891e48ab4f5c821cd4286f08a0997513aaa33b1a68d7570b551c9e7

global
    log /dev/log local0
    maxconn 20000
    stats socket /run/haproxy/admin.sock mode 660 level admin expose-fd listeners
    ssl-default-bind-options ssl-min-ver TLSv1.2 no-tls-tickets
    ssl-default-server-options ssl-min-ver TLSv1.2

defaults
    log global
    option dontlognull
    option redispatch
    retries 3
    timeout connect 5s
    timeout client 50s
    timeout server 50s
    timeout http-request 10s
    timeout http-keep-alive 10s
    timeout tunnel 1h

# Local health endpoint for keepalived's check script and the agent's route-health watchdog.
frontend sy_local_health
    mode http
    bind 127.0.0.1:8404
    monitor-uri /healthz
    no log

frontend vs_web
    mode http
    bind 192.0.2.30:80
    bind 192.0.2.30:443 ssl crt-list /etc/switchyard/certs/web.crtlist alpn http/1.1,acme-tls/1
    option httplog
    option forwardfor
    http-request return status 200 content-type text/plain lf-string "%[path,map(/etc/switchyard/haproxy/maps/acme-http01.map)]" if { dst_port 80 } { path,map(/etc/switchyard/haproxy/maps/acme-http01.map) -m found }
    http-request del-header X-Forwarded-For
    http-request set-header X-Forwarded-Proto https if { ssl_fc }
    http-request set-header X-Forwarded-Proto http if !{ ssl_fc }
    http-request set-var(txn.host) req.hdr(host),field(1,:),lower
    http-request redirect prefix "https://%[var(txn.host)]" code 301 if { dst_port 80 }
    http-request redirect location / code 302 if { method GET HEAD } { url_param(debug) -m found }
    use_backend pool_admin if { var(txn.host) -m str admin.example.test } { src 10.0.0.0/8 192.168.0.0/16 fd00::/8 }
    use_backend pool_canary if { var(txn.host) -m str app.example.test } { req.hdr(X-Canary) -m str "yes" }
    use_backend pool_canary if { var(txn.host) -m str app.example.test } { url_param(canary) -m str "1" }
    use_backend pool_write if { var(txn.host) -m str app.example.test } { path_beg /api } { method DELETE PATCH POST PUT } { req.hdr(Authorization) -m found } !{ req.hdr(X-Legacy) -m found }
    use_backend pool_write if { path_beg /api } { req.hdr(User-Agent) -m beg "Mozilla/" } { req.hdr(Accept) -m sub "application/json" }
    use_backend pool_tenant-sni if { ssl_fc_sni -m reg '^[^.]+[.]tenant[.]example[.]test$' }
    use_backend %[var(txn.host),map(/etc/switchyard/haproxy/maps/web-host.map)] if { var(txn.host),map(/etc/switchyard/haproxy/maps/web-host.map) -m found }
    use_backend %[var(txn.host),map_reg(/etc/switchyard/haproxy/maps/web-wild.map)] if { var(txn.host),map_reg(/etc/switchyard/haproxy/maps/web-wild.map) -m found }

backend pool_admin
    mode http
    balance roundrobin
    server 10-20-1-21-9000 10.20.1.21:9000 weight 100

backend pool_app
    mode http
    balance roundrobin
    server 10-20-1-11-8080 10.20.1.11:8080 weight 100

backend pool_canary
    mode http
    balance roundrobin
    server 10-20-1-12-8080 10.20.1.12:8080 weight 100

backend pool_tenant-sni
    mode http
    balance roundrobin
    server 10-20-1-41-8080 10.20.1.41:8080 weight 100

backend pool_write
    mode http
    balance roundrobin
    server 10-20-1-31-8000 10.20.1.31:8000 weight 100
