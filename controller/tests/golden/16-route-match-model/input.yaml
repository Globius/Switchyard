render:
  se_group: seg-edge
tenants:
- id: t-acme
  name: acme
networks:
- id: net-lb
  tenant_id: t-acme
  name: lb
  cidr: 192.0.2.0/24
  gateway: 192.0.2.1
- id: net-be
  tenant_id: t-acme
  name: backend
  cidr: 10.20.0.0/16
se_groups:
- id: seg-edge
  tenant_id: t-acme
  name: edge
  ha_mode: vrrp
  networks:
  - network_id: net-lb
    role: vip
  - network_id: net-be
    role: backend
certificates:
- id: c-wild
  tenant_id: t-acme
  name: wild-example-test
  source: cloudflare_origin
  sans:
  - '*.example.test'
  - example.test
  not_after: '2038-01-01T00:00:00+00:00'
  secret_ref: kv/tenants/acme/certs/wild-example-test
pools:
- id: p-app
  tenant_id: t-acme
  name: app
  members:
  - address: 10.20.1.11
    port: 8080
- id: p-canary
  tenant_id: t-acme
  name: canary
  members:
  - address: 10.20.1.12
    port: 8080
- id: p-admin
  tenant_id: t-acme
  name: admin
  members:
  - address: 10.20.1.21
    port: 9000
- id: p-write
  tenant_id: t-acme
  name: write
  members:
  - address: 10.20.1.31
    port: 8000
- id: p-tenant
  tenant_id: t-acme
  name: tenant-sni
  members:
  - address: 10.20.1.41
    port: 8080
policy_sets:
- id: ps-block-debug
  tenant_id: t-acme
  name: block-debug
  kind: redirect
  rules:
  - match:
      query:
      - name: debug
        op: present
      methods: [GET, HEAD]
    redirect:
      location: /
      code: 302
virtual_services:
- id: v-web
  tenant_id: t-acme
  se_group_id: seg-edge
  name: web
  protocol: http
  vip: 192.0.2.30
  ports:
  - port: 443
    tls: true
  - port: 80
    https_redirect_port: 443
  certificate_ids:
  - c-wild
  policy_set_ids:
  - ps-block-debug
  routes:
  # internal networks only, on the admin host
  - order: 1
    match:
      host: admin.example.test
      source_cidrs: [10.0.0.0/8, 192.168.0.0/16, 'fd00::/8']
    pool_id: p-admin
  # canary users by header, then by cookie-less opt-in query parameter
  - order: 2
    match:
      host: app.example.test
      headers:
      - name: X-Canary
        op: equals
        value: 'yes'
    pool_id: p-canary
  - order: 3
    match:
      host: app.example.test
      query:
      - name: canary
        op: equals
        value: '1'
    pool_id: p-canary
  # writes to the API go to a separate pool; legacy clients are recognised by their agent
  - order: 4
    match:
      host: app.example.test
      path_prefix: /api
      methods: [POST, PUT, PATCH, DELETE]
      headers:
      - name: Authorization
        op: present
      - name: X-Legacy
        op: absent
    pool_id: p-write
  - order: 5
    match:
      path_prefix: /api
      headers:
      - name: User-Agent
        op: prefix
        value: Mozilla/
      - name: Accept
        op: contains
        value: application/json
    pool_id: p-write
  # a customer-specific name served from the same VIP, chosen by TLS server name
  - order: 6
    match:
      sni: '*.tenant.example.test'
    pool_id: p-tenant
  # plain host routes still use the map files
  - match:
      host: app.example.test
    pool_id: p-app
  - match:
      host: '*.example.test'
    pool_id: p-app
