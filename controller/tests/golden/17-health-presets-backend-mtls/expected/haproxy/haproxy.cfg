# Managed by Switchyard. Do not edit: changes are reported as drift.
# SE group: edge
# switchyard-render: sha256:a20999ccb360e4b2e372953377ff51a8914ee6ec990928a68f700e967e05c272

global
    log /dev/log local0
    maxconn 20000
    stats socket /run/haproxy/admin.sock mode 660 level admin expose-fd listeners
    ssl-default-bind-options ssl-min-ver TLSv1.2 no-tls-tickets
    ssl-default-server-options ssl-min-ver TLSv1.2

defaults
    log global
    option dontlognull
    option redispatch
    retries 3
    timeout connect 5s
    timeout client 50s
    timeout server 50s
    timeout http-request 10s
    timeout http-keep-alive 10s
    timeout tunnel 1h

# Local health endpoint for keepalived's check script and the agent's route-health watchdog.
frontend sy_local_health
    mode http
    bind 127.0.0.1:8404
    monitor-uri /healthz
    no log

frontend vs_api
    mode http
    bind 192.0.2.31:443 ssl crt-list /etc/switchyard/certs/api.crtlist alpn http/1.1
    option httplog
    option forwardfor
    http-request del-header X-Forwarded-For
    http-request set-header X-Forwarded-Proto https if { ssl_fc }
    http-request set-header X-Forwarded-Proto http if !{ ssl_fc }
    http-request set-var(txn.host) req.hdr(host),field(1,:),lower
    use_backend %[var(txn.host),map(/etc/switchyard/haproxy/maps/api-host.map)] if { var(txn.host),map(/etc/switchyard/haproxy/maps/api-host.map) -m found }
    default_backend pool_mtls-api

frontend vs_ldap
    mode tcp
    bind 192.0.2.34:389
    option tcplog
    default_backend pool_directory

frontend vs_mysql
    mode tcp
    bind 192.0.2.35:3306
    option tcplog
    default_backend pool_database

frontend vs_redis
    mode tcp
    bind 192.0.2.32:6379
    option tcplog
    default_backend pool_cache

frontend vs_smtp
    mode tcp
    bind 192.0.2.33:25
    option tcplog
    default_backend pool_mail

backend pool_cache
    mode tcp
    balance roundrobin
    option redis-check
    timeout check 3s
    default-server inter 5s fall 3 rise 2
    server 10-20-6-4-6379 10.20.6.4:6379 check weight 100

backend pool_database
    mode tcp
    balance roundrobin
    option mysql-check
    timeout check 3s
    default-server inter 5s fall 3 rise 2
    server 10-20-6-7-3306 10.20.6.7:3306 check weight 100

backend pool_directory
    mode tcp
    balance roundrobin
    option ldap-check
    timeout check 3s
    default-server inter 5s fall 3 rise 2
    server 10-20-6-6-389 10.20.6.6:389 check weight 100

backend pool_header-check
    mode http
    balance roundrobin
    option httpchk
    http-check send meth GET uri /status
    http-check expect hdr name X-Health value ok
    timeout check 3s
    default-server inter 5s fall 3 rise 2
    server 10-20-6-3-8080 10.20.6.3:8080 check weight 100

backend pool_mail
    mode tcp
    balance roundrobin
    option smtpchk
    timeout check 3s
    default-server inter 5s fall 3 rise 2
    server 10-20-6-5-25 10.20.6.5:25 check weight 100

backend pool_mtls-api
    mode http
    balance roundrobin
    option httpchk
    http-check send meth GET uri /status
    http-check expect string status_ok
    timeout check 3s
    default-server inter 5s fall 3 rise 2
    server 10-20-6-2-8443 10.20.6.2:8443 check check-ssl check-send-proxy ssl verify required ca-file /etc/ssl/certs/ca-certificates.crt crt /etc/switchyard/certs/backend-client.pem sni req.hdr(host),field(1,:),lower send-proxy weight 100
