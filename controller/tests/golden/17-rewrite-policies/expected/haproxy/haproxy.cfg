# SE group: edge
# switchyard-render: sha256:e14ed3e7dd73ab0eae61e0022bbe7acace9933f5c17d9211397180d9f1066eda

global
    log /dev/log local0
    maxconn 20000
    stats socket /run/haproxy/admin.sock mode 660 level admin expose-fd listeners
    ssl-default-bind-options ssl-min-ver TLSv1.2 no-tls-tickets
    ssl-default-server-options ssl-min-ver TLSv1.2

defaults
    log global
    option dontlognull
    option redispatch
    retries 3
    timeout connect 5s
    timeout client 50s
    timeout server 50s
    timeout http-request 10s
    timeout http-keep-alive 10s
    timeout tunnel 1h

# Local health endpoint for keepalived's check script and the agent's route-health watchdog.
frontend sy_local_health
    mode http
    bind 127.0.0.1:8404
    monitor-uri /healthz
    no log

frontend vs_api
    mode http
    bind 192.0.2.31:80
    bind 192.0.2.31:443 ssl crt-list /etc/switchyard/certs/api.crtlist alpn http/1.1
    option httplog
    option forwardfor
    http-request return status 200 content-type text/plain lf-string "%[path,map(/etc/switchyard/haproxy/maps/acme-http01.map)]" if { dst_port 80 } { path,map(/etc/switchyard/haproxy/maps/acme-http01.map) -m found }
    http-request del-header X-Forwarded-For
    http-request set-header X-Forwarded-Proto https if { ssl_fc }
    http-request set-header X-Forwarded-Proto http if !{ ssl_fc }
    http-request set-var(txn.host) req.hdr(host),field(1,:),lower
    http-request redirect prefix "https://%[var(txn.host)]" code 301 if { dst_port 80 }
    http-request set-header X-Edge "switchyard"
    http-request set-header X-Client-IP "%[src]"
    http-request set-header X-Request-Id "%[uuid]"
    http-request del-header Cookie if { path_beg /internal }
    http-request add-header Via "1.1 switchyard" if { method GET } { req.hdr(X-Trace) -m found }
    http-request set-path / if { path_beg /api/v1 } { path /api/v1 }
    http-request replace-path '^/api/v1(/.*)$' '\1' if { path_beg /api/v1 }
    http-request replace-path '^/legacy(/.*)?$' '/v2\1' if { path_beg /legacy }
    http-request replace-path '^/docs[.]old(/.*)?$' '/docs\1'
    http-request set-var(txn.sy_m1) bool(true) if { path_beg /static }
    http-response set-header Strict-Transport-Security "max-age=31536000; includeSubDomains"
    http-response del-header Server
    http-response set-header Cache-Control "public, max-age=86400" if { var(txn.sy_m1) -m bool }
    default_backend pool_api

backend pool_api
    mode http
    balance roundrobin
    server 10-20-2-11-8080 10.20.2.11:8080 weight 100
