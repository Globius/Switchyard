render:
  se_group: seg-edge
tenants:
- id: t-acme
  name: acme
networks:
- id: net-lb
  tenant_id: t-acme
  name: lb
  cidr: 192.0.2.0/24
  gateway: 192.0.2.1
- id: net-be
  tenant_id: t-acme
  name: backend
  cidr: 10.20.0.0/16
se_groups:
- id: seg-edge
  tenant_id: t-acme
  name: edge
  ha_mode: vrrp
  networks:
  - network_id: net-lb
    role: vip
  - network_id: net-be
    role: backend
certificates:
- id: c-api
  tenant_id: t-acme
  name: api-example-test
  source: cloudflare_origin
  sans:
  - api.example.test
  not_after: '2038-01-01T00:00:00+00:00'
  secret_ref: kv/tenants/acme/certs/api-example-test
pools:
- id: p-api
  tenant_id: t-acme
  name: api
  members:
  - address: 10.20.2.11
    port: 8080
policy_sets:
- id: ps-api-edge
  tenant_id: t-acme
  name: api-edge
  kind: rewrite
  rules:
  # request headers: fixed value, variable, removal
  - action:
      type: set_header
      name: X-Edge
      value: switchyard
  - action:
      type: set_header
      name: X-Client-IP
      variable: client_ip
  - action:
      type: set_header
      name: X-Request-Id
      variable: request_id
  - match:
      path_prefix: /internal
    action:
      type: remove_header
      name: Cookie
  - match:
      methods: [GET]
      headers:
      - name: X-Trace
        op: present
    action:
      type: add_header
      name: Via
      value: 1.1 switchyard
  # URL rewrite: /api/v1/x becomes /x, /legacy/x becomes /v2/x
  - match:
      path_prefix: /api/v1
    action:
      type: replace_prefix
      from_prefix: /api/v1
      to_prefix: /
  - match:
      path_prefix: /legacy
    action:
      type: replace_prefix
      from_prefix: /legacy
      to_prefix: /v2
  - action:
      type: replace_prefix
      from_prefix: /docs.old
      to_prefix: /docs
  # response headers
  - phase: response
    action:
      type: set_header
      name: Strict-Transport-Security
      value: max-age=31536000; includeSubDomains
  - phase: response
    action:
      type: remove_header
      name: Server
  - phase: response
    match:
      path_prefix: /static
    action:
      type: set_header
      name: Cache-Control
      value: public, max-age=86400
virtual_services:
- id: v-api
  tenant_id: t-acme
  se_group_id: seg-edge
  name: api
  protocol: http
  vip: 192.0.2.31
  ports:
  - port: 443
    tls: true
  - port: 80
    https_redirect_port: 443
  certificate_ids:
  - c-api
  policy_set_ids:
  - ps-api-edge
  default_pool_id: p-api
