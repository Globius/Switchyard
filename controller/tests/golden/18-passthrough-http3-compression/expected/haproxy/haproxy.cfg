# Managed by Switchyard. Do not edit: changes are reported as drift.
# SE group: edge
# switchyard-render: sha256:e1c56690dad74d3220ae6d1dffb5720a798b224df43b14a6e93690551d5f7ea3

global
    log /dev/log local0
    maxconn 20000
    stats socket /run/haproxy/admin.sock mode 660 level admin expose-fd listeners
    ssl-default-bind-options ssl-min-ver TLSv1.2 no-tls-tickets
    ssl-default-server-options ssl-min-ver TLSv1.2

defaults
    log global
    option dontlognull
    option redispatch
    retries 3
    timeout connect 5s
    timeout client 50s
    timeout server 50s
    timeout http-request 10s
    timeout http-keep-alive 10s
    timeout tunnel 1h

# Local health endpoint for keepalived's check script and the agent's route-health watchdog.
frontend sy_local_health
    mode http
    bind 127.0.0.1:8404
    monitor-uri /healthz
    no log

frontend vs_sni
    mode tcp
    bind 192.0.2.41:443
    option tcplog
    tcp-request inspect-delay 5s
    tcp-request content accept if { req.ssl_hello_type 1 }
    use_backend %[req.ssl_sni,lower,map(/etc/switchyard/haproxy/maps/sni-sni.map)] if { req.ssl_sni,lower,map(/etc/switchyard/haproxy/maps/sni-sni.map) -m found }
    use_backend %[req.ssl_sni,lower,map_reg(/etc/switchyard/haproxy/maps/sni-sni-wild.map)] if { req.ssl_sni,lower,map_reg(/etc/switchyard/haproxy/maps/sni-sni-wild.map) -m found }
    default_backend pool_other-tls

frontend vs_web
    mode http
    bind 192.0.2.40:443 ssl crt-list /etc/switchyard/certs/web.crtlist alpn h2,http/1.1,acme-tls/1
    bind quic4@192.0.2.40:443 ssl crt-list /etc/switchyard/certs/web.crtlist alpn h3
    option httplog
    option forwardfor
    compression algo gzip deflate
    compression type text/html application/json
    http-response set-header alt-svc 'h3=":443"; ma=86400'
    http-request del-header X-Forwarded-For
    http-request set-header X-Forwarded-Proto https if { ssl_fc }
    http-request set-header X-Forwarded-Proto http if !{ ssl_fc }
    http-request set-var(txn.host) req.hdr(host),field(1,:),lower
    use_backend pool_grpc-tls if { var(txn.host) -m str grpc.example.test } { path_beg /pkg.Service/ }
    use_backend %[var(txn.host),map(/etc/switchyard/haproxy/maps/web-host.map)] if { var(txn.host),map(/etc/switchyard/haproxy/maps/web-host.map) -m found }
    default_backend pool_app

backend pool_app
    mode http
    balance roundrobin
    server 10-20-7-2-8080 10.20.7.2:8080 weight 100

backend pool_grpc-plain
    mode http
    balance roundrobin
    server 10-20-7-4-50051 10.20.7.4:50051 proto h2 weight 100

backend pool_grpc-tls
    mode http
    balance roundrobin
    timeout tunnel 7200s
    server 10-20-7-3-8443 10.20.7.3:8443 ssl verify none sni req.hdr(host),field(1,:),lower alpn h2 weight 100

backend pool_mail
    mode tcp
    balance roundrobin
    server 10-20-7-5-443 10.20.7.5:443 weight 100

backend pool_other-tls
    mode tcp
    balance roundrobin
    server 10-20-7-7-443 10.20.7.7:443 weight 100

backend pool_vpn
    mode tcp
    balance roundrobin
    server 10-20-7-6-443 10.20.7.6:443 weight 100
