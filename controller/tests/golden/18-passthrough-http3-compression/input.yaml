render:
  se_group: seg-edge
tenants:
- id: t-acme
  name: acme
networks:
- id: net-lb
  tenant_id: t-acme
  name: lb
  cidr: 192.0.2.0/24
  gateway: 192.0.2.1
- id: net-be
  tenant_id: t-acme
  name: backend
  cidr: 10.20.0.0/16
se_groups:
- id: seg-edge
  tenant_id: t-acme
  name: edge
  ha_mode: vrrp
  networks:
  - network_id: net-lb
    role: vip
  - network_id: net-be
    role: backend
certificates:
- id: c-web
  tenant_id: t-acme
  name: web
  source: upload
  sans:
  - app.example.test
  - grpc.example.test
  - plain-grpc.example.test
  not_after: '2038-01-01T00:00:00+00:00'
  secret_ref: kv/tenants/acme/certs/web
pools:
- id: p-app
  tenant_id: t-acme
  name: app
  members:
  - address: 10.20.7.2
    port: 8080
- id: p-grpc
  tenant_id: t-acme
  name: grpc-tls
  tls: true
  backend_protocol: h2
  tunnel_timeout_s: 7200
  members:
  - address: 10.20.7.3
    port: 8443
- id: p-grpc-plain
  tenant_id: t-acme
  name: grpc-plain
  backend_protocol: h2c
  members:
  - address: 10.20.7.4
    port: 50051
- id: p-mail
  tenant_id: t-acme
  name: mail
  members:
  - address: 10.20.7.5
    port: 443
- id: p-vpn
  tenant_id: t-acme
  name: vpn
  members:
  - address: 10.20.7.6
    port: 443
- id: p-other
  tenant_id: t-acme
  name: other-tls
  members:
  - address: 10.20.7.7
    port: 443
virtual_services:
- id: v-web
  tenant_id: t-acme
  se_group_id: seg-edge
  name: web
  protocol: http
  vip: 192.0.2.40
  ports:
  - port: 443
    tls: true
    http2: true
    http3: true
  certificate_ids:
  - c-web
  compression:
    algorithms:
    - gzip
    - deflate
    content_types:
    - text/html
    - application/json
  routes:
  - match:
      host: grpc.example.test
      path_prefix: /pkg.Service/
    pool_id: p-grpc
  - match:
      host: plain-grpc.example.test
    pool_id: p-grpc-plain
  default_pool_id: p-app
- id: v-sni
  tenant_id: t-acme
  se_group_id: seg-edge
  name: sni
  protocol: tcp
  vip: 192.0.2.41
  ports:
  - port: 443
    tls_passthrough: true
  routes:
  - match:
      host: mail.example.test
    pool_id: p-mail
  - match:
      host: '*.vpn.example.test'
    pool_id: p-vpn
  default_pool_id: p-other
