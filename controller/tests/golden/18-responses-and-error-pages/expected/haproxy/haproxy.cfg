# Managed by Switchyard. Do not edit: changes are reported as drift.
# SE group: edge
# switchyard-render: sha256:cd1cb91e470c392f5f88267b20debce7c03fc6a46dbcbea7b6115dcb410f907d

global
    log /dev/log local0
    maxconn 20000
    stats socket /run/haproxy/admin.sock mode 660 level admin expose-fd listeners
    ssl-default-bind-options ssl-min-ver TLSv1.2 no-tls-tickets
    ssl-default-server-options ssl-min-ver TLSv1.2

defaults
    log global
    option dontlognull
    option redispatch
    retries 3
    timeout connect 5s
    timeout client 50s
    timeout server 50s
    timeout http-request 10s
    timeout http-keep-alive 10s
    timeout tunnel 1h

# Local health endpoint for keepalived's check script and the agent's route-health watchdog.
frontend sy_local_health
    mode http
    bind 127.0.0.1:8404
    monitor-uri /healthz
    no log

frontend vs_shop
    mode http
    bind 192.0.2.32:443 ssl crt-list /etc/switchyard/certs/shop.crtlist alpn http/1.1
    option httplog
    option forwardfor
    http-error status 502 content-type text/plain file /etc/switchyard/haproxy/lists/shop-errors-e502.page
    http-error status 503 content-type text/html file /etc/switchyard/haproxy/lists/shop-errors-e503.page
    http-error status 504 content-type application/json file /etc/switchyard/haproxy/lists/shop-errors-e504.page
    http-request del-header X-Forwarded-For
    http-request set-header X-Forwarded-Proto https if { ssl_fc }
    http-request set-header X-Forwarded-Proto http if !{ ssl_fc }
    http-request set-var(txn.host) req.hdr(host),field(1,:),lower
    http-request return status 200 content-type text/plain file /etc/switchyard/haproxy/lists/shop-responses-r1.page if { path /lb-ping }
    http-request return status 404 if { path_beg /wp-admin }
    http-request return status 204 if { path /favicon.ico } { method GET }
    http-request return status 429 content-type application/json file /etc/switchyard/haproxy/lists/shop-responses-r4.page hdr Retry-After 120 if { req.hdr(User-Agent) -m sub "BadBot" }
    http-request return status 503 content-type text/html file /etc/switchyard/haproxy/lists/maintenance-r1.page hdr Retry-After 600 if { req.hdr(X-Maintenance) -m str "on" }
    default_backend pool_shop

backend pool_shop
    mode http
    balance roundrobin
    server 10-20-3-11-8080 10.20.3.11:8080 weight 100
