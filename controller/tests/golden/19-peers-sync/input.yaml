render:
  se_group: seg-edge
tenants:
- id: t-acme
  name: acme
networks:
- id: net-lb
  tenant_id: t-acme
  name: lb
  cidr: 192.0.2.0/24
  gateway: 192.0.2.1
- id: net-be
  tenant_id: t-acme
  name: backend
  cidr: 10.20.0.0/16
se_groups:
- id: seg-edge
  tenant_id: t-acme
  name: edge
  ha_mode: vrrp
  networks:
  - network_id: net-lb
    role: vip
  - network_id: net-be
    role: backend
  peers:
    port: 10000
    members:
    - name: se-edge-2
      address: 10.20.0.6
    - name: se-edge-1
      address: 10.20.0.5
pools:
- id: p-src
  tenant_id: t-acme
  name: sticky
  persistence:
    type: source_ip
  members:
  - address: 10.20.8.2
    port: 8080
- id: p-cookie
  tenant_id: t-acme
  name: cookie
  persistence:
    type: http_cookie
    name: SY_SRV
  members:
  - address: 10.20.8.3
    port: 8080
virtual_services:
- id: v-web
  tenant_id: t-acme
  se_group_id: seg-edge
  name: web
  protocol: http
  vip: 192.0.2.50
  ports:
  - port: 80
  routes:
  - match:
      host: cookie.example.test
    pool_id: p-cookie
  default_pool_id: p-src
