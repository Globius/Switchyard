# Managed by Switchyard. Do not edit: changes are reported as drift.
# SE group: edge
# switchyard-render: sha256:f0f89a93a7de54072241c4e801f43383fac9570815dd99e5f32f8f0093d8bd30

global
    log /dev/log local0
    maxconn 20000
    tune.stick-counters 4
    stats socket /run/haproxy/admin.sock mode 660 level admin expose-fd listeners
    ssl-default-bind-options ssl-min-ver TLSv1.2 no-tls-tickets
    ssl-default-server-options ssl-min-ver TLSv1.2

defaults
    log global
    option dontlognull
    option redispatch
    retries 3
    timeout connect 5s
    timeout client 50s
    timeout server 50s
    timeout http-request 10s
    timeout http-keep-alive 10s
    timeout tunnel 1h

# Local health endpoint for keepalived's check script and the agent's route-health watchdog.
frontend sy_local_health
    mode http
    bind 127.0.0.1:8404
    monitor-uri /healthz
    no log

frontend vs_api
    mode http
    bind 192.0.2.33:443 ssl crt-list /etc/switchyard/certs/api.crtlist alpn http/1.1,acme-tls/1
    option httplog
    option forwardfor
    timeout tarpit 3s
    http-request del-header X-Forwarded-For
    http-request set-header X-Forwarded-Proto https if { ssl_fc }
    http-request set-header X-Forwarded-Proto http if !{ ssl_fc }
    http-request set-var(txn.host) req.hdr(host),field(1,:),lower
    http-request track-sc0 src table rl_api_api-limits_1 if { path /login } { method POST }
    http-request return status 429 hdr Retry-After 60 if { sc_http_req_rate(0,rl_api_api-limits_1) gt 10 }
    http-request track-sc1 src table rl_api_api-limits_2
    http-request return status 503 if { sc_conn_cur(1,rl_api_api-limits_2) gt 50 }
    http-request track-sc2 req.hdr(X-Api-Key) table rl_api_api-limits_3
    http-request tarpit deny_status 429 if { sc_http_req_rate(2,rl_api_api-limits_3) gt 1000 }
    http-request track-sc3 src table rl_api_api-limits_4
    http-request silent-drop if { sc_http_req_rate(3,rl_api_api-limits_4) gt 200 }
    default_backend pool_api

backend pool_api
    mode http
    balance roundrobin
    server 10-20-2-11-8080 10.20.2.11:8080 weight 100

backend rl_api_api-limits_1
    stick-table type ipv6 size 5000 expire 60s store http_req_rate(60s)

backend rl_api_api-limits_2
    stick-table type ipv6 size 10000 expire 60s store conn_cur

backend rl_api_api-limits_3
    stick-table type string len 64 size 20000 expire 60s store http_req_rate(60s)

backend rl_api_api-limits_4
    stick-table type ipv6 size 10000 expire 60s store http_req_rate(1s)
