render:
  se_group: seg-edge
tenants:
- id: t-acme
  name: acme
networks:
- id: net-lb
  tenant_id: t-acme
  name: lb
  cidr: 192.0.2.0/24
  gateway: 192.0.2.1
- id: net-be
  tenant_id: t-acme
  name: backend
  cidr: 10.20.0.0/16
se_groups:
- id: seg-edge
  tenant_id: t-acme
  name: edge
  ha_mode: vrrp
  networks:
  - network_id: net-lb
    role: vip
  - network_id: net-be
    role: backend
certificates:
- id: c-api
  tenant_id: t-acme
  name: api-example-test
  source: cloudflare_origin
  sans:
  - api.example.test
  not_after: '2038-01-01T00:00:00+00:00'
  secret_ref: kv/tenants/acme/certs/api-example-test
pools:
- id: p-api
  tenant_id: t-acme
  name: api
  members:
  - address: 10.20.2.11
    port: 8080
policy_sets:
- id: ps-limits
  tenant_id: t-acme
  name: api-limits
  kind: rate_limit
  rules:
  # login path: 10 attempts a minute per client, then 429 with a retry hint
  - match:
      path_exact: /login
      methods: [POST]
    max_requests: 10
    period_s: 60
    table_size: 5000
  # whole service: 50 requests in flight per client
  - max_concurrent: 50
    action: deny
    deny_status: 503
  # API quota per key: 1000 a minute, tarpit the excess
  - key: header
    header_name: X-Api-Key
    max_requests: 1000
    period_s: 60
    action: tarpit
    tarpit_s: 3
    table_size: 20000
  # flood protection: drop silently above 200 a second
  - max_requests: 200
    period_s: 1
    action: silent_drop
virtual_services:
- id: v-api
  tenant_id: t-acme
  se_group_id: seg-edge
  name: api
  protocol: http
  vip: 192.0.2.33
  ports:
  - port: 443
    tls: true
  certificate_ids:
  - c-api
  policy_set_ids:
  - ps-limits
  default_pool_id: p-api
