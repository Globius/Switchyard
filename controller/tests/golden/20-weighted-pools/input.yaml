render:
  se_group: seg-edge
tenants:
- id: t-acme
  name: acme
networks:
- id: net-lb
  tenant_id: t-acme
  name: lb
  cidr: 192.0.2.0/24
  gateway: 192.0.2.1
- id: net-be
  tenant_id: t-acme
  name: backend
  cidr: 10.20.0.0/16
se_groups:
- id: seg-edge
  tenant_id: t-acme
  name: edge
  ha_mode: vrrp
  networks:
  - network_id: net-lb
    role: vip
  - network_id: net-be
    role: backend
pools:
- id: p-blue
  tenant_id: t-acme
  name: blue
  members:
  - address: 10.20.9.2
    port: 8080
- id: p-green
  tenant_id: t-acme
  name: green
  members:
  - address: 10.20.9.3
    port: 8080
- id: p-canary
  tenant_id: t-acme
  name: canary
  members:
  - address: 10.20.9.4
    port: 8080
- id: p-legacy
  tenant_id: t-acme
  name: legacy
  members:
  - address: 10.20.9.5
    port: 8080
virtual_services:
- id: v-web
  tenant_id: t-acme
  se_group_id: seg-edge
  name: web
  protocol: http
  vip: 192.0.2.60
  ports:
  - port: 80
  routes:
  - order: 2
    match:
      host: app.example.test
    pools:
    - pool_id: p-blue
      weight: 70
    - pool_id: p-green
      weight: 20
    - pool_id: p-canary
      weight: 10
  - order: 1
    match:
      host: app.example.test
      path_prefix: /beta
    pools:
    - pool_id: p-green
      weight: 50
    - pool_id: p-canary
      weight: 50
  default_pool_id: p-legacy
