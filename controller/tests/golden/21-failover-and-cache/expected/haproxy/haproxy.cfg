# SE group: edge
# switchyard-render: sha256:6d782753c04b59956e3cfd5bc760b18037d16093c9477e2ecd4a0089605d865d

global
    log /dev/log local0
    maxconn 20000
    stats socket /run/haproxy/admin.sock mode 660 level admin expose-fd listeners
    ssl-default-bind-options ssl-min-ver TLSv1.2 no-tls-tickets
    ssl-default-server-options ssl-min-ver TLSv1.2

defaults
    log global
    option dontlognull
    option redispatch
    retries 3
    timeout connect 5s
    timeout client 50s
    timeout server 50s
    timeout http-request 10s
    timeout http-keep-alive 10s
    timeout tunnel 1h

cache sy_cache_web
    total-max-size 64
    max-object-size 524288
    max-age 120

# Local health endpoint for keepalived's check script and the agent's route-health watchdog.
frontend sy_local_health
    mode http
    bind 127.0.0.1:8404
    monitor-uri /healthz
    no log

frontend vs_web
    mode http
    bind 192.0.2.70:80
    option httplog
    option forwardfor
    http-request return status 200 content-type text/plain lf-string "%[path,map(/etc/switchyard/haproxy/maps/acme-http01.map)]" if { dst_port 80 } { path,map(/etc/switchyard/haproxy/maps/acme-http01.map) -m found }
    http-request del-header X-Forwarded-For
    http-request set-header X-Forwarded-Proto https if { ssl_fc }
    http-request set-header X-Forwarded-Proto http if !{ ssl_fc }
    http-request set-var(txn.host) req.hdr(host),field(1,:),lower
    http-request cache-use sy_cache_web
    http-response cache-store sy_cache_web
    use_backend pool_main if { var(txn.host) -m str app.example.test } { nbsrv(pool_main) gt 0 }
    use_backend pool_dr-site if { var(txn.host) -m str app.example.test } { nbsrv(pool_dr-site) gt 0 }
    use_backend pool_static-page if { var(txn.host) -m str app.example.test }
    default_backend pool_static-page

backend pool_dr-site
    mode http
    balance roundrobin
    timeout check 3s
    default-server inter 5s fall 3 rise 2
    server 10-20-10-3-8080 10.20.10.3:8080 check weight 100

backend pool_main
    mode http
    balance roundrobin
    timeout check 3s
    default-server inter 5s fall 3 rise 2
    server 10-20-10-2-8080 10.20.10.2:8080 check weight 100

backend pool_static-page
    mode http
    balance roundrobin
    server 10-20-10-4-8080 10.20.10.4:8080 weight 100
