render:
  se_group: seg-edge
tenants:
- id: t-acme
  name: acme
networks:
- id: net-lb
  tenant_id: t-acme
  name: lb
  cidr: 192.0.2.0/24
  gateway: 192.0.2.1
- id: net-be
  tenant_id: t-acme
  name: backend
  cidr: 10.20.0.0/16
se_groups:
- id: seg-edge
  tenant_id: t-acme
  name: edge
  ha_mode: vrrp
  networks:
  - network_id: net-lb
    role: vip
  - network_id: net-be
    role: backend
health_monitors:
- id: hm-tcp
  tenant_id: t-acme
  name: tcp
  type: tcp
pools:
- id: p-main
  tenant_id: t-acme
  name: main
  health_monitor_id: hm-tcp
  members:
  - address: 10.20.10.2
    port: 8080
- id: p-dr
  tenant_id: t-acme
  name: dr-site
  health_monitor_id: hm-tcp
  members:
  - address: 10.20.10.3
    port: 8080
- id: p-static
  tenant_id: t-acme
  name: static-page
  members:
  - address: 10.20.10.4
    port: 8080
virtual_services:
- id: v-web
  tenant_id: t-acme
  se_group_id: seg-edge
  name: web
  protocol: http
  vip: 192.0.2.70
  ports:
  - port: 80
  cache:
    size_mb: 64
    max_object_kb: 512
    max_age_s: 120
  routes:
  - match:
      host: app.example.test
    pool_id: p-main
    fallback_pool_ids:
    - p-dr
    - p-static
  default_pool_id: p-static
