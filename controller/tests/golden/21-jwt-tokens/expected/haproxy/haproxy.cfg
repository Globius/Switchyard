global
    log /dev/log local0
    maxconn 20000
    stats socket /run/haproxy/admin.sock mode 660 level admin expose-fd listeners
    ssl-default-bind-options ssl-min-ver TLSv1.2 no-tls-tickets
    ssl-default-server-options ssl-min-ver TLSv1.2

defaults
    log global
    option dontlognull
    option redispatch
    retries 3
    timeout connect 5s
    timeout client 50s
    timeout server 50s
    timeout http-request 10s
    timeout http-keep-alive 10s
    timeout tunnel 1h

# Local health endpoint for keepalived's check script and the agent's route-health watchdog.
frontend sy_local_health
    mode http
    bind 127.0.0.1:8404
    monitor-uri /healthz
    no log

frontend vs_api
    mode http
    bind 192.0.2.35:80
    bind 192.0.2.35:443 ssl crt-list /etc/switchyard/certs/api.crtlist alpn http/1.1,acme-tls/1
    option httplog
    option forwardfor
    http-request return status 200 content-type text/plain lf-string "%[path,map(/etc/switchyard/haproxy/maps/acme-http01.map)]" if { dst_port 80 } { path,map(/etc/switchyard/haproxy/maps/acme-http01.map) -m found }
    http-request del-header X-Forwarded-For
    http-request set-header X-Forwarded-Proto https if { ssl_fc }
    http-request set-header X-Forwarded-Proto http if !{ ssl_fc }
    http-request set-var(txn.host) req.hdr(host),field(1,:),lower
    http-request redirect prefix "https://%[var(txn.host)]" code 301 if { dst_port 80 }
    http-request set-var(txn.sy_jtok) http_auth_bearer
    http-request set-var(txn.sy_jnow) date
    http-request del-header X-Jwt-Sub
    http-request set-var(txn.sy_j1) int(1) if { path_beg /v1/admin } !{ var(txn.sy_jdone) -m found } !{ var(txn.sy_j1) -m found } { var(txn.sy_jtok),jwt_verify(RS256,/etc/switchyard/certs/jwt-api-tokens-1-1.pem) -m int 1 } { var(txn.sy_jtok),jwt_header_query('$.kid') -m str key-2026 } { var(txn.sy_jtok),jwt_payload_query('$.iss') -m str https://login.example.test/realms/acme } { var(txn.sy_jtok),jwt_payload_query('$.aud') -m reg '(^|")(https://api[.]example[.]test/)("|$)' } { var(txn.sy_jtok),jwt_payload_query('$.scope') -m reg '(^| )admin( |$)' } { var(txn.sy_jtok),jwt_payload_query('$.scope') -m reg '(^| )api:write( |$)' } { var(txn.sy_jtok),jwt_payload_query('$.exp','int'),sub(txn.sy_jnow),add(10) -m int 1: }
    http-request set-var(txn.sy_j1) int(1) if { path_beg /v1/admin } !{ var(txn.sy_jdone) -m found } !{ var(txn.sy_j1) -m found } { var(txn.sy_jtok),jwt_verify(RS256,/etc/switchyard/certs/jwt-api-tokens-1-2.pem) -m int 1 } { var(txn.sy_jtok),jwt_payload_query('$.iss') -m str https://login.example.test/realms/acme } { var(txn.sy_jtok),jwt_payload_query('$.aud') -m reg '(^|")(https://api[.]example[.]test/)("|$)' } { var(txn.sy_jtok),jwt_payload_query('$.scope') -m reg '(^| )admin( |$)' } { var(txn.sy_jtok),jwt_payload_query('$.scope') -m reg '(^| )api:write( |$)' } { var(txn.sy_jtok),jwt_payload_query('$.exp','int'),sub(txn.sy_jnow),add(10) -m int 1: }
    http-request return status 401 hdr WWW-Authenticate Bearer if { path_beg /v1/admin } !{ var(txn.sy_jdone) -m found } !{ var(txn.sy_j1) -m found }
    http-request set-var(txn.sy_jsub1) var(txn.sy_jtok),jwt_payload_query('$.sub') if { var(txn.sy_j1) -m found }
    http-request set-header X-Jwt-Sub "%[var(txn.sy_jsub1)]" if { var(txn.sy_j1) -m found }
    http-request set-var(txn.sy_jdone) int(1) if { path_beg /v1/admin } !{ var(txn.sy_jdone) -m found }
    http-request set-var(txn.sy_j2) int(1) if { path_beg /v1 } !{ var(txn.sy_jdone) -m found } !{ var(txn.sy_j2) -m found } { var(txn.sy_jtok),jwt_verify(RS256,/etc/switchyard/certs/jwt-api-tokens-2-1.pem) -m int 1 } { var(txn.sy_jtok),jwt_header_query('$.kid') -m str key-2026 } { var(txn.sy_jtok),jwt_payload_query('$.iss') -m str https://login.example.test/realms/acme } { var(txn.sy_jtok),jwt_payload_query('$.aud') -m reg '(^|")(api|https://api[.]example[.]test/)("|$)' } { var(txn.sy_jtok),jwt_payload_query('$.exp','int'),sub(txn.sy_jnow),add(30) -m int 1: }
    http-request return status 401 hdr WWW-Authenticate Bearer if { path_beg /v1 } !{ var(txn.sy_jdone) -m found } !{ var(txn.sy_j2) -m found }
    http-request set-var(txn.sy_jdone) int(1) if { path_beg /v1 } !{ var(txn.sy_jdone) -m found }
    use_backend pool_docs if { path_beg /docs }
    default_backend pool_api

backend pool_api
    mode http
    balance roundrobin
    server 10-20-5-11-8080 10.20.5.11:8080 weight 100

backend pool_docs
    mode http
    balance roundrobin
    server 10-20-5-12-8080 10.20.5.12:8080 weight 100
