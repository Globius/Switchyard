virtual_services:
- id: v-api
  tenant_id: t-acme
  se_group_id: seg-edge
  name: api
  protocol: http
  vip: 192.0.2.35
  ports:
  - port: 443
    tls: true
  - port: 80
    https_redirect_port: 443
  certificate_ids:
  - c-api
  policy_set_ids:
  - ps-tokens
  routes:
  - match:
      path_prefix: /docs
    pool_id: p-public
    order: 1
  default_pool_id: p-api
