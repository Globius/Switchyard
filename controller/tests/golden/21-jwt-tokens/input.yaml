render:
  se_group: seg-edge
tenants:
- id: t-acme
  name: acme
networks:
- id: net-lb
  tenant_id: t-acme
  name: lb
  cidr: 192.0.2.0/24
  gateway: 192.0.2.1
- id: net-be
  tenant_id: t-acme
  name: backend
  cidr: 10.20.0.0/16
se_groups:
- id: seg-edge
  tenant_id: t-acme
  name: edge
  ha_mode: vrrp
  networks:
  - network_id: net-lb
    role: vip
  - network_id: net-be
    role: backend
certificates:
- id: c-api
  tenant_id: t-acme
  name: api-example-test
  source: cloudflare_origin
  sans:
  - api.example.test
  not_after: '2038-01-01T00:00:00+00:00'
  secret_ref: kv/tenants/acme/certs/api-example-test
pools:
- id: p-api
  tenant_id: t-acme
  name: api
  members:
  - address: 10.20.5.11
    port: 8080
- id: p-public
  tenant_id: t-acme
  name: docs
  members:
  - address: 10.20.5.12
    port: 8080
policy_sets:
- id: ps-tokens
  tenant_id: t-acme
  name: api-tokens
  kind: jwt
  rules:
  - match:
      path_prefix: /v1/admin
    issuer: https://login.example.test/realms/acme
    audiences: [https://api.example.test/]
    required_scopes: [admin, api:write]
    leeway_s: 10
    subject_header: X-Jwt-Sub
    keys:
    - kid: key-2026
      alg: RS256
      public_key_pem: |
        -----BEGIN PUBLIC KEY-----
        MIIBIjANBgkqhkiG9w0BAQEFAAOCAQ8AMIIBCgKCAQEA8IHLk/rEikp/ZyTuxSye
