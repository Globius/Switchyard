    issuer: https://login.example.test/realms/acme
    audiences: [https://api.example.test/, api]
    keys:
    - kid: key-2026
      alg: RS256
      public_key_pem: |
        -----BEGIN PUBLIC KEY-----
        MIIBIjANBgkqhkiG9w0BAQEFAAOCAQ8AMIIBCgKCAQEA8IHLk/rEikp/ZyTuxSye
