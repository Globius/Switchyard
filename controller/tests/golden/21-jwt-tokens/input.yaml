    - alg: RS256
      public_key_pem: |
        -----BEGIN PUBLIC KEY-----
        MIIBIjANBgkqhkiG9w0BAQEFAAOCAQ8AMIIBCgKCAQEA8IHLk/rEikp/ZyTuxSye
        ALPutOXwBzvLuslizikeC1PHg7AGP5rM+x9b6LmXydREwnZ4xe9jhfTJ1xpv3nnj
        rNglMlLQVLGmjLQtNFg6L/QnAAGp0sx7rZrquK0TGcPoPqZvhU948AT1kDs9deuZ
