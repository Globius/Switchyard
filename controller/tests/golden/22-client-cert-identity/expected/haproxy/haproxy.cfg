# SE group: edge
# switchyard-render: sha256:5ef70adfeaaf1e85610526fe3b5fe0f35a606d9903c1edd4bbb6c52500af94a5

global
    log /dev/log local0
    maxconn 20000
    stats socket /run/haproxy/admin.sock mode 660 level admin expose-fd listeners
    ssl-default-bind-options ssl-min-ver TLSv1.2 no-tls-tickets
    ssl-default-server-options ssl-min-ver TLSv1.2

defaults
    log global
    option dontlognull
    option redispatch
    retries 3
    timeout connect 5s
    timeout client 50s
    timeout server 50s
    timeout http-request 10s
    timeout http-keep-alive 10s
    timeout tunnel 1h

# Local health endpoint for keepalived's check script and the agent's route-health watchdog.
frontend sy_local_health
    mode http
    bind 127.0.0.1:8404
    monitor-uri /healthz
    no log

frontend vs_intranet
    mode http
    bind 192.0.2.36:443 ssl crt-list /etc/switchyard/certs/intranet.crtlist ca-file /etc/switchyard/certs/ca-staff-ca.pem verify optional alpn http/1.1,acme-tls/1
    option httplog
    option forwardfor
    http-request del-header X-Forwarded-For
    http-request set-header X-Forwarded-Proto https if { ssl_fc }
    http-request set-header X-Forwarded-Proto http if !{ ssl_fc }
    http-request set-var(txn.host) req.hdr(host),field(1,:),lower
    http-request del-header X-Cert-User
    http-request del-header X-Cert-Groups
    http-request set-var(txn.sy_cid) ssl_c_sha1,hex,lower,map(/etc/switchyard/haproxy/maps/staff-certs-certsha1.map) if { ssl_c_used } !{ var(txn.sy_cid) -m found }
    http-request set-var(txn.sy_cid) ssl_c_s_dn(cn),map(/etc/switchyard/haproxy/maps/staff-certs-certcn.map) if { ssl_c_used } !{ var(txn.sy_cid) -m found }
    http-request set-var(txn.sy_cuser) var(txn.sy_cid),field(1,'|') if { var(txn.sy_cid) -m found }
    http-request set-var(txn.sy_cgrp) var(txn.sy_cid),field(2,'|') if { var(txn.sy_cid) -m found }
    http-request return status 403 if { path_beg /ops } !{ var(txn.sy_cdone) -m found } !{ var(txn.sy_cgrp) -m reg '(^|,)(ops[.]team)(,|$)' }
    http-request set-var(txn.sy_cdone) int(1) if { path_beg /ops } !{ var(txn.sy_cdone) -m found }
    http-request return status 403 if { path_beg /staff } !{ var(txn.sy_cdone) -m found } !{ var(txn.sy_cid) -m found }
    http-request set-var(txn.sy_cdone) int(1) if { path_beg /staff } !{ var(txn.sy_cdone) -m found }
    http-request return status 403 if !{ var(txn.sy_cdone) -m found } !{ ssl_c_used }
    http-request set-var(txn.sy_cdone) int(1) if !{ var(txn.sy_cdone) -m found }
    http-request set-header X-Cert-User "%[var(txn.sy_cuser)]" if { var(txn.sy_cuser) -m found }
    http-request set-header X-Cert-Groups "%[var(txn.sy_cgrp)]" if { var(txn.sy_cgrp) -m found }
    default_backend pool_intranet

backend pool_intranet
    mode http
    balance roundrobin
    server 10-20-6-11-8080 10.20.6.11:8080 weight 100
