global
    log /dev/log local0
    maxconn 20000
    stats socket /run/haproxy/admin.sock mode 660 level admin expose-fd listeners
    ssl-default-bind-options ssl-min-ver TLSv1.2 no-tls-tickets
    ssl-default-server-options ssl-min-ver TLSv1.2

defaults
    log global
    option dontlognull
    option redispatch
    retries 3
    unique-id-format %[uuid()]
    timeout connect 5s
    timeout client 50s
    timeout server 50s
    timeout http-request 10s
    timeout http-keep-alive 10s
    timeout tunnel 1h

# Local health endpoint for keepalived's check script and the agent's route-health watchdog.
frontend sy_local_health
    mode http
    bind 127.0.0.1:8404
    monitor-uri /healthz
    no log

frontend vs_app
    mode http
    bind 192.0.2.90:80
    option httplog
    log-format "%ci:%cp [%tr] %f %b/%s %TR/%Tw/%Tc/%Tr/%Ta %ST %B request_id=%ID sni=%{+Q}[ssl_fc_sni] host=%{+Q}[var(txn.host)] upstream=%[bc_dst] upstream_port=%[bc_dst_port] retries=%rc %tsc %ac/%fc/%bc/%sc %sq/%bq %hr %hs %{+Q}r"
    option forwardfor
    timeout http-request 5s
    timeout client 30s
    tcp-request connection accept if { src 198.51.100.0/24 2001:db8:10::/48 }
    tcp-request connection track-sc1 src table pt_app
    tcp-request connection reject if { sc_conn_cur(1,pt_app) gt 100 }
    tcp-request connection reject if { sc_conn_rate(1,pt_app) gt 50 }
    http-request return status 200 content-type text/plain lf-string "%[path,map(/etc/switchyard/haproxy/maps/acme-http01.map)]" if { dst_port 80 } { path,map(/etc/switchyard/haproxy/maps/acme-http01.map) -m found }
    http-request del-header X-Forwarded-For
    http-request set-header X-Forwarded-Proto https if { ssl_fc }
    http-request set-header X-Forwarded-Proto http if !{ ssl_fc }
    http-request set-var(txn.host) req.hdr(host),field(1,:),lower
    http-request track-sc0 src table rl_app_login_1 if { path /login } { method POST }
    http-request return status 429 hdr Retry-After 60 if { sc_http_req_rate(0,rl_app_login_1) gt 5 }
    http-request deny deny_status 403 if !{ req.hdr(user-agent) -m found } !{ src 198.51.100.0/24 2001:db8:10::/48 }
    http-request deny deny_status 403 if { req.hdr(user-agent) -m len 0 } !{ src 198.51.100.0/24 2001:db8:10::/48 }
    http-request deny deny_status 403 if { req.hdr(user-agent),lower -m sub acunetix dirbuster gobuster havij masscan netsparker nikto nmap nessus nuclei openvas sqlmap wpscan zgrab bad-bot evilcrawler/2 } !{ src 198.51.100.0/24 2001:db8:10::/48 }
    default_backend pool_app

frontend vs_bots
    mode http
    bind 192.0.2.91:80
    option httplog
    log-format "%ci:%cp [%tr] %f %b/%s %TR/%Tw/%Tc/%Tr/%Ta %ST %B request_id=%ID sni=%{+Q}[ssl_fc_sni] host=%{+Q}[var(txn.host)] upstream=%[bc_dst] upstream_port=%[bc_dst_port] retries=%rc %tsc %ac/%fc/%bc/%sc %sq/%bq %hr %hs %{+Q}r"
    option forwardfor
    http-request return status 200 content-type text/plain lf-string "%[path,map(/etc/switchyard/haproxy/maps/acme-http01.map)]" if { dst_port 80 } { path,map(/etc/switchyard/haproxy/maps/acme-http01.map) -m found }
    http-request del-header X-Forwarded-For
    http-request set-header X-Forwarded-Proto https if { ssl_fc }
    http-request set-header X-Forwarded-Proto http if !{ ssl_fc }
    http-request set-var(txn.host) req.hdr(host),field(1,:),lower
    http-request silent-drop if { req.hdr(user-agent),lower -m sub acunetix dirbuster gobuster havij masscan netsparker nikto nmap nessus nuclei openvas sqlmap wpscan zgrab }
    default_backend pool_app

backend pool_app
    mode http
    balance roundrobin
    server 10-20-12-2-8080 10.20.12.2:8080 weight 100

backend pt_app
    stick-table type ipv6 size 50000 expire 60s store conn_cur,conn_rate(10s)

backend rl_app_login_1
    stick-table type ipv6 size 10000 expire 60s store http_req_rate(60s)
