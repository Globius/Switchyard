global
    log /dev/log local0
    maxconn 20000
    stats socket /run/haproxy/admin.sock mode 660 level admin expose-fd listeners
    ssl-default-bind-options ssl-min-ver TLSv1.2 no-tls-tickets
    ssl-default-server-options ssl-min-ver TLSv1.2

defaults
    log global
    option dontlognull
    option redispatch
    retries 3
    timeout connect 5s
    timeout client 50s
    timeout server 50s
    timeout http-request 10s
    timeout http-keep-alive 10s
    timeout tunnel 1h

# Local health endpoint for keepalived's check script and the agent's route-health watchdog.
frontend sy_local_health
    mode http
    bind 127.0.0.1:8404
    monitor-uri /healthz
    no log

frontend vs_app
    mode http
    bind 192.0.2.90:80
    option httplog
    option forwardfor
    tcp-request connection accept if { src 198.51.100.0/24 }
    http-request return status 200 content-type text/plain lf-string "%[path,map(/etc/switchyard/haproxy/maps/acme-http01.map)]" if { dst_port 80 } { path,map(/etc/switchyard/haproxy/maps/acme-http01.map) -m found }
    http-request del-header X-Forwarded-For
    http-request set-header X-Forwarded-Proto https if { ssl_fc }
    http-request set-header X-Forwarded-Proto http if !{ ssl_fc }
    http-request set-var(txn.host) req.hdr(host),field(1,:),lower
    http-request set-var(txn.sy_cv) req.cook(sy_chal) if { req.cook(sy_chal) -m found }
    http-request set-var(txn.sy_ts) var(txn.sy_cv),field(1,-),add(0) if { var(txn.sy_cv) -m found }
    http-request set-var-fmt(txn.sy_in) "%[var(txn.sy_cv)]|%[src]|3d9b3fb7d839e383" if { var(txn.sy_cv) -m found }
    http-request set-var(txn.sy_hash) var(txn.sy_in),sha2(256),hex if { var(txn.sy_cv) -m found }
    http-request set-var(txn.sy_age) date,sub(txn.sy_ts) if { var(txn.sy_cv) -m found }
    http-request set-var(txn.sy_pass) bool(true) if { var(txn.sy_hash) -m beg 0000 } { var(txn.sy_age) -m int ge 0 } { var(txn.sy_age) -m int le 1800 }
    http-request return status 200 content-type text/html hdr cache-control no-store lf-file /etc/switchyard/haproxy/challenge/app.html if { method GET HEAD } !{ src 198.51.100.0/24 } !{ path_beg /api /health } !{ req.hdr(user-agent),lower -m sub googlebot } !{ var(txn.sy_pass) -m bool }
    http-request deny deny_status 403 if !{ src 198.51.100.0/24 } !{ path_beg /api /health } !{ req.hdr(user-agent),lower -m sub googlebot } !{ var(txn.sy_pass) -m bool }
    default_backend pool_app

backend pool_app
    mode http
    balance roundrobin
    server 10-20-12-2-8080 10.20.12.2:8080 weight 100
