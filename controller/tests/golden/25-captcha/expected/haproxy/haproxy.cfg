# SE group: edge
# switchyard-render: sha256:8e82fda23179067a753342930f53bfb3506d9f7d7d3121337b689c8f7ea77bab

global
    log /dev/log local0
    maxconn 20000
    tune.lua.bool-sample-conversion normal
    httpclient.ssl.ca-file /etc/ssl/certs/ca-certificates.crt
    httpclient.ssl.verify required
    httpclient.resolvers.id sy_dns
    httpclient.resolvers.prefer ipv4
    lua-load /etc/switchyard/haproxy/lists/captcha-app.lua
    stats socket /run/haproxy/admin.sock mode 660 level admin expose-fd listeners
    ssl-default-bind-options ssl-min-ver TLSv1.2 no-tls-tickets
    ssl-default-server-options ssl-min-ver TLSv1.2

defaults
    log global
    option dontlognull
    option redispatch
    retries 3
    timeout connect 5s
    timeout client 50s
    timeout server 50s
    timeout http-request 10s
    timeout http-keep-alive 10s
    timeout tunnel 1h

resolvers sy_dns
    parse-resolv-conf
    timeout resolve 1s
    timeout retry 1s
    resolve_retries 2

# Local health endpoint for keepalived's check script and the agent's route-health watchdog.
frontend sy_local_health
    mode http
    bind 127.0.0.1:8404
    monitor-uri /healthz
    no log

frontend vs_app
    mode http
    bind 192.0.2.90:80
    option httplog
    option forwardfor
    tcp-request connection accept if { src 198.51.100.0/24 }
    http-request return status 200 content-type text/plain lf-string "%[path,map(/etc/switchyard/haproxy/maps/acme-http01.map)]" if { dst_port 80 } { path,map(/etc/switchyard/haproxy/maps/acme-http01.map) -m found }
    http-request del-header X-Forwarded-For
    http-request set-header X-Forwarded-Proto https if { ssl_fc }
    http-request set-header X-Forwarded-Proto http if !{ ssl_fc }
    http-request set-var(txn.host) req.hdr(host),field(1,:),lower
    http-request lua.sy_cap_check_3027bc6b
    http-request use-service lua.sy_cap_3027bc6b if { path /.sy/captcha } { method POST }
    http-request return status 200 content-type text/html hdr cache-control no-store lf-file /etc/switchyard/haproxy/lists/captcha-app.html if { method GET HEAD } !{ src 198.51.100.0/24 } !{ path_beg /api } !{ var(txn.sy_pass) -m bool }
    http-request deny deny_status 403 if !{ src 198.51.100.0/24 } !{ path_beg /api } !{ var(txn.sy_pass) -m bool }
    default_backend pool_app

backend pool_app
    mode http
    balance roundrobin
    server 10-20-12-2-8080 10.20.12.2:8080 weight 100
