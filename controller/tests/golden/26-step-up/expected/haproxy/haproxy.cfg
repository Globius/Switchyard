global
    log /dev/log local0
    maxconn 20000
    stats socket /run/haproxy/admin.sock mode 660 level admin expose-fd listeners
    ssl-default-bind-options ssl-min-ver TLSv1.2 no-tls-tickets
    ssl-default-server-options ssl-min-ver TLSv1.2

defaults
    log global
    option dontlognull
    option redispatch
    retries 3
    unique-id-format %[uuid()]
    timeout connect 5s
    timeout client 50s
    timeout server 50s
    timeout http-request 10s
    timeout http-keep-alive 10s
    timeout tunnel 1h

# Local health endpoint for keepalived's check script and the agent's route-health watchdog.
frontend sy_local_health
    mode http
    bind 127.0.0.1:8404
    monitor-uri /healthz
    no log

frontend vs_wiki
    mode http
    bind 192.0.2.34:80
    bind 192.0.2.34:443 ssl crt-list /etc/switchyard/certs/wiki.crtlist alpn http/1.1,acme-tls/1
    bind 127.0.0.1:18000
    option httplog
    log-format "%ci:%cp [%tr] %f %b/%s %TR/%Tw/%Tc/%Tr/%Ta %ST %B request_id=%ID sni=%{+Q}[ssl_fc_sni] host=%{+Q}[var(txn.host)] upstream=%[bc_dst] upstream_port=%[bc_dst_port] retries=%rc %tsc %ac/%fc/%bc/%sc %sq/%bq %hr %hs %{+Q}r"
    option forwardfor
    tcp-request session reject if !{ src -f /etc/switchyard/haproxy/lists/office.cidr } !{ dst 127.0.0.1 }
    http-request return status 200 content-type text/plain lf-string "%[path,map(/etc/switchyard/haproxy/maps/acme-http01.map)]" if { dst_port 80 } { path,map(/etc/switchyard/haproxy/maps/acme-http01.map) -m found }
    http-request set-var(txn.sy_loop) bool(true) if { dst 127.0.0.1 } { dst_port 18000 }
    http-request set-src hdr(X-Forwarded-For) if { var(txn.sy_loop) -m bool }
    http-request del-header X-Forwarded-For
    http-request set-header X-Forwarded-Proto https if { ssl_fc } !{ var(txn.sy_loop) -m bool }
    http-request set-header X-Forwarded-Proto http if !{ ssl_fc } !{ var(txn.sy_loop) -m bool }
    http-request set-var(txn.host) req.hdr(host),field(1,:),lower
    http-request redirect prefix "https://%[var(txn.host)]" code 301 if { dst_port 80 }
    http-request del-header X-Auth-User if !{ var(txn.sy_loop) -m bool }
    http-request del-header X-Auth-Email if !{ var(txn.sy_loop) -m bool }
    http-request del-header X-Auth-Groups if !{ var(txn.sy_loop) -m bool }
    http-request del-header X-Auth-Token if !{ var(txn.sy_loop) -m bool }
    http-request del-header X-Forwarded-User if !{ var(txn.sy_loop) -m bool }
    http-request del-header X-Forwarded-Email if !{ var(txn.sy_loop) -m bool }
    http-request del-header X-Forwarded-Groups if !{ var(txn.sy_loop) -m bool }
    http-request del-header X-Forwarded-Preferred-Username if !{ var(txn.sy_loop) -m bool }
    http-request del-header X-Forwarded-Access-Token if !{ var(txn.sy_loop) -m bool }
    http-request del-header X-Sy-Access if !{ var(txn.sy_loop) -m bool }
    http-request del-header X-Sy-Device if !{ var(txn.sy_loop) -m bool }
    http-request track-sc0 src table rl_wiki_login-limits_1 if { path_beg /oauth2 } !{ var(txn.sy_loop) -m bool }
    http-request return status 429 hdr Retry-After 60 if { sc_http_req_rate(0,rl_wiki_login-limits_1) gt 20 }
    http-request set-var(txn.sy_ad) int(1) if !{ var(txn.sy_ad) -m found } { path_beg /health } !{ var(txn.sy_loop) -m bool }
    http-request set-var(txn.sy_ad) int(3) if !{ var(txn.sy_ad) -m found } { path_beg /admin } !{ var(txn.sy_loop) -m bool }
    http-request set-var(txn.sy_ad) int(4) if !{ var(txn.sy_ad) -m found } { var(txn.host) -m str wiki.example.test } { path_beg /staff } !{ var(txn.sy_loop) -m bool }
    http-request set-var(txn.sy_ad) int(5) if !{ var(txn.sy_ad) -m found } !{ var(txn.sy_loop) -m bool }
    http-request set-header X-Sy-Access "%[var(txn.sy_ad)]" if !{ var(txn.sy_loop) -m bool } { var(txn.sy_ad) -m int 2: }
    http-request return status 403 if { var(txn.sy_loop) -m bool } !{ req.hdr(X-Sy-Access) -m found }
    http-request set-var(txn.sy_ad) req.hdr_val(X-Sy-Access) if { var(txn.sy_loop) -m bool }
    http-request return status 401 if { var(txn.sy_loop) -m bool } { var(txn.sy_ad) -m int 2: } !{ req.hdr(X-Forwarded-User) -m found }
    http-request return status 403 if { var(txn.sy_loop) -m bool } { var(txn.sy_ad) -m int 3 } !{ req.fhdr(X-Forwarded-Groups) -m reg '(^|,)(/wiki/admins|ops[.]team)(,|$)' }
    http-request return status 403 if { var(txn.sy_loop) -m bool } { var(txn.sy_ad) -m int 4 } !{ req.hdr(X-Forwarded-Email) -m reg -i '@(corp[.]example[.]test|example[.]test)$' }
    http-request set-var(txn.sy_idt) http_auth_bearer if { var(txn.sy_loop) -m bool }
    http-request return status 403 if { var(txn.sy_loop) -m bool } { var(txn.sy_ad) -m int 4 } !{ var(txn.sy_idt),jwt_payload_query('$.device_compliant') -m str "1" "true" }
    http-request return status 403 if { var(txn.sy_loop) -m bool } { var(txn.sy_ad) -m int 4 } !{ var(txn.sy_idt),jwt_payload_query('$.tier') -m str "gold" "silver" }
    http-request redirect location "https://auth.example.test/dex/acme/staff/_gate/elevate?level=2&host=%[req.hdr(host),field(1,:),url_enc]&path=%[pathq,url_enc]" code 303 if { var(txn.sy_loop) -m bool } { var(txn.sy_ad) -m int 3 } !{ req.fhdr(X-Forwarded-Groups) -m reg '(^|,)sy-factors-2(,|$)' } { method GET HEAD }
    http-request return status 403 if { var(txn.sy_loop) -m bool } { var(txn.sy_ad) -m int 3 } !{ req.fhdr(X-Forwarded-Groups) -m reg '(^|,)sy-factors-2(,|$)' }
    http-request set-header X-Auth-User "%[req.fhdr(X-Forwarded-User)]" if { var(txn.sy_loop) -m bool }
    http-request set-header X-Auth-Email "%[req.fhdr(X-Forwarded-Email)]" if { var(txn.sy_loop) -m bool }
    http-request set-header X-Auth-Groups "%[req.fhdr(X-Forwarded-Groups)]" if { var(txn.sy_loop) -m bool }
    http-request set-header X-Auth-Token "%[req.hdr(Authorization),regsub('^Bearer ',)]" if { var(txn.sy_loop) -m bool }
    http-request del-header Authorization if { var(txn.sy_loop) -m bool }
    http-request set-header Cookie "%[req.fhdr(cookie),regsub('(^|; *)_sy_auth(_[A-Za-z0-9]+)*=[^;]*','',g),regsub('^; *','')]" if { var(txn.sy_loop) -m bool } { req.hdr(cookie) -m found }
    http-request del-header Cookie if { var(txn.sy_loop) -m bool } { req.fhdr(cookie) -m len 0 }
    http-request del-header X-Forwarded-User if { var(txn.sy_loop) -m bool }
    http-request del-header X-Forwarded-Email if { var(txn.sy_loop) -m bool }
    http-request del-header X-Forwarded-Groups if { var(txn.sy_loop) -m bool }
    http-request del-header X-Forwarded-Preferred-Username if { var(txn.sy_loop) -m bool }
    http-request del-header X-Forwarded-Access-Token if { var(txn.sy_loop) -m bool }
    http-request del-header X-Sy-Access if { var(txn.sy_loop) -m bool }
    http-request del-header X-Sy-Device if { var(txn.sy_loop) -m bool }
    use_backend auth_wiki-sso if !{ var(txn.sy_loop) -m bool } { path_beg /oauth2/ }
    use_backend auth_wiki-sso if !{ var(txn.sy_loop) -m bool } { var(txn.sy_ad) -m int 2: }
    use_backend pool_wiki-admin if { path_beg /admin }
    default_backend pool_wiki

backend auth_wiki-sso
    mode http
    server auth 127.0.0.1:14000

backend pool_wiki
    mode http
    balance roundrobin
    server 10-20-4-11-3000 10.20.4.11:3000 weight 100

backend pool_wiki-admin
    mode http
    balance roundrobin
    server 10-20-4-12-3000 10.20.4.12:3000 weight 100

backend rl_wiki_login-limits_1
    stick-table type ipv6 size 10000 expire 60s store http_req_rate(60s)
