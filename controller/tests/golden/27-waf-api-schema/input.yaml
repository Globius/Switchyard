render:
  se_group: seg-edge
tenants:
- id: t-acme
  name: acme
networks:
- id: net-lb
  tenant_id: t-acme
  name: lb
  cidr: 192.0.2.0/24
  gateway: 192.0.2.1
- id: net-be
  tenant_id: t-acme
  name: backend
  cidr: 10.20.0.0/16
se_groups:
- id: seg-edge
  tenant_id: t-acme
  name: edge
  ha_mode: vrrp
  networks:
  - network_id: net-lb
    role: vip
  - network_id: net-be
    role: backend
policy_sets:
- id: ps-api-detect
  tenant_id: t-acme
  name: pets-detect
  kind: waf
  api:
    base_path: /v1
    max_body_bytes: 1048576
    operations:
    - {method: GET, path: /pets, query: [{name: limit, kind: integer}, {name: status, kind: enum, values: [available, sold]}, {name: q}]}
    - {method: GET, path: '/pets/{id}', path_params: [{name: id, kind: integer}]}
    - method: POST
      path: /pets
      content_types: [application/json]
      max_body_bytes: 65536
    - {method: DELETE, path: '/pets/{id}', path_params: [{name: id, kind: uuid}]}
- id: ps-api-block
  tenant_id: t-acme
  name: orders-block
  kind: waf
  mode: block
  api:
    mode: block
    allow_unknown_query: true
    operations:
    - {method: GET, path: /orders, query: [{name: page, kind: integer, required: true}, {name: flag, kind: boolean}]}
    - {method: GET, path: /orders/mine}
    - {method: GET, path: '/orders/{ref}'}
pools:
- id: p-app
  tenant_id: t-acme
  name: app
  members:
  - address: 10.20.11.2
    port: 8080
- id: p-shop
  tenant_id: t-acme
  name: shop
  members:
  - address: 10.20.11.3
    port: 8080
virtual_services:
- id: v-app
  tenant_id: t-acme
  se_group_id: seg-edge
  name: pets
  protocol: http
  vip: 192.0.2.80
  ports:
  - port: 80
  policy_set_ids: [ps-api-detect]
  default_pool_id: p-app
- id: v-shop
  tenant_id: t-acme
  se_group_id: seg-edge
  name: orders
  protocol: http
  vip: 192.0.2.81
  ports:
  - port: 80
  policy_set_ids: [ps-api-block]
  default_pool_id: p-shop
