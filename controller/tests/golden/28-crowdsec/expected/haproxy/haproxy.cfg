global
    log /dev/log local0
    maxconn 20000
    stats socket /run/haproxy/admin.sock mode 660 level admin expose-fd listeners
    ssl-default-bind-options ssl-min-ver TLSv1.2 no-tls-tickets
    ssl-default-server-options ssl-min-ver TLSv1.2

defaults
    log global
    option dontlognull
    option redispatch
    retries 3
    timeout connect 5s
    timeout client 50s
    timeout server 50s
    timeout http-request 10s
    timeout http-keep-alive 10s
    timeout tunnel 1h

# Local health endpoint for keepalived's check script and the agent's route-health watchdog.
frontend sy_local_health
    mode http
    bind 127.0.0.1:8404
    monitor-uri /healthz
    no log

frontend vs_app
    mode http
    bind 192.0.2.80:80
    option httplog
    option forwardfor
    unique-id-format %[uuid()]
    filter spoe engine crowdsec config /etc/switchyard/haproxy/lists/crowdsec.spoe
    http-request return status 200 content-type text/plain lf-string "%[path,map(/etc/switchyard/haproxy/maps/acme-http01.map)]" if { dst_port 80 } { path,map(/etc/switchyard/haproxy/maps/acme-http01.map) -m found }
    http-request del-header X-Forwarded-For
    http-request set-header X-Forwarded-Proto https if { ssl_fc }
    http-request set-header X-Forwarded-Proto http if !{ ssl_fc }
    http-request set-var(txn.host) req.hdr(host),field(1,:),lower
    http-request send-spoe-group crowdsec crowdsec-http-no-body
    http-request capture var(txn.crowdsec.remediation) len 8
    default_backend pool_app

frontend vs_shop
    mode http
    bind 192.0.2.81:80
    option httplog
    option forwardfor
    unique-id-format %[uuid()]
    filter spoe engine crowdsec config /etc/switchyard/haproxy/lists/crowdsec.spoe
    http-request return status 200 content-type text/plain lf-string "%[path,map(/etc/switchyard/haproxy/maps/acme-http01.map)]" if { dst_port 80 } { path,map(/etc/switchyard/haproxy/maps/acme-http01.map) -m found }
    http-request del-header X-Forwarded-For
    http-request set-header X-Forwarded-Proto https if { ssl_fc }
    http-request set-header X-Forwarded-Proto http if !{ ssl_fc }
    http-request set-var(txn.host) req.hdr(host),field(1,:),lower
    http-request send-spoe-group crowdsec crowdsec-http-no-body if !{ src 198.51.100.0/24 2001:db8:1::/48 } !{ path_beg /healthz /status }
    http-request capture var(txn.crowdsec.remediation) len 8
    http-request deny deny_status 503 if { var(txn.crowdsec.error) -m int gt 0 } !{ src 198.51.100.0/24 2001:db8:1::/48 } !{ path_beg /healthz /status }
    http-request deny deny_status 503 if !{ var(txn.crowdsec.remediation) -m found } !{ src 198.51.100.0/24 2001:db8:1::/48 } !{ path_beg /healthz /status }
    http-request deny deny_status 403 if { var(txn.crowdsec.remediation) -m str ban } !{ src 198.51.100.0/24 2001:db8:1::/48 } !{ path_beg /healthz /status }
    default_backend pool_shop

backend sy_crowdsec_spoa
    mode tcp
    balance roundrobin
    timeout connect 5s
    timeout server 3m
    server crowdsec 127.0.0.1:9001

backend pool_app
    mode http
    balance roundrobin
    server 10-20-11-2-8080 10.20.11.2:8080 weight 100

backend pool_shop
    mode http
    balance roundrobin
    server 10-20-11-3-8080 10.20.11.3:8080 weight 100
