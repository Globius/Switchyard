render:
  se_group: seg-edge
tenants:
- id: t-acme
  name: acme
networks:
- id: net-lb
  tenant_id: t-acme
  name: lb
  cidr: 192.0.2.0/24
  gateway: 192.0.2.1
- id: net-be
  tenant_id: t-acme
  name: backend
  cidr: 10.20.0.0/16
se_groups:
- id: seg-edge
  tenant_id: t-acme
  name: edge
  ha_mode: vrrp
  networks:
  - network_id: net-lb
    role: vip
  - network_id: net-be
    role: backend
policy_sets:
- id: ps-detect
  tenant_id: t-acme
  name: detect-first
  kind: crowdsec
- id: ps-block
  tenant_id: t-acme
  name: strict
  kind: crowdsec
  mode: block
  fail_mode: closed
  timeout_ms: 250
  allow_cidrs: [198.51.100.0/24, 2001:db8:1::/48]
  excluded_paths: [/healthz, /status]
pools:
- id: p-app
  tenant_id: t-acme
  name: app
  members:
  - address: 10.20.11.2
    port: 8080
- id: p-shop
  tenant_id: t-acme
  name: shop
  members:
  - address: 10.20.11.3
    port: 8080
virtual_services:
- id: v-app
  tenant_id: t-acme
  se_group_id: seg-edge
  name: app
  protocol: http
  vip: 192.0.2.80
  ports:
  - port: 80
  policy_set_ids: [ps-detect]
  default_pool_id: p-app
- id: v-shop
  tenant_id: t-acme
  se_group_id: seg-edge
  name: shop
  protocol: http
  vip: 192.0.2.81
  ports:
  - port: 80
  policy_set_ids: [ps-block]
  default_pool_id: p-shop
