# SE group: edge
# switchyard-render: sha256:e162512bb7c46b9f8029708d0972b28db1b014f7ecf18928c703c49cd054900c

global
    log /dev/log local0
    maxconn 20000
    stats socket /run/haproxy/admin.sock mode 660 level admin expose-fd listeners
    ssl-default-bind-options ssl-min-ver TLSv1.2 no-tls-tickets
    ssl-default-server-options ssl-min-ver TLSv1.2

defaults
    log global
    option dontlognull
    option redispatch
    retries 3
    unique-id-format %[uuid()]
    timeout connect 5s
    timeout client 50s
    timeout server 50s
    timeout http-request 10s
    timeout http-keep-alive 10s
    timeout tunnel 1h

# Local health endpoint for keepalived's check script and the agent's route-health watchdog.
frontend sy_local_health
    mode http
    bind 127.0.0.1:8404
    monitor-uri /healthz
    no log

frontend vs_farm
    mode http
    bind 192.0.2.26:80
    option httplog
    log-format "%ci:%cp [%tr] %f %b/%s %TR/%Tw/%Tc/%Tr/%Ta %ST %B request_id=%ID sni=%{+Q}[ssl_fc_sni] host=%{+Q}[var(txn.host)] upstream=%[bc_dst] upstream_port=%[bc_dst_port] retries=%rc %tsc %ac/%fc/%bc/%sc %sq/%bq %hr %hs %{+Q}r"
    option forwardfor
    http-request return status 200 content-type text/plain lf-string "%[path,map(/etc/switchyard/haproxy/maps/acme-http01.map)]" if { dst_port 80 } { path,map(/etc/switchyard/haproxy/maps/acme-http01.map) -m found }
    http-request del-header X-Forwarded-For
    http-request set-header X-Forwarded-Proto https if { ssl_fc }
    http-request set-header X-Forwarded-Proto http if !{ ssl_fc }
    http-request set-var(txn.host) req.hdr(host),field(1,:),lower
    use_backend %[var(txn.host),map(/etc/switchyard/haproxy/maps/farm-host.map)] if { var(txn.host),map(/etc/switchyard/haproxy/maps/farm-host.map) -m found }
    default_backend pool_cache

backend pool_cache
    mode http
    balance uri
    server 10-20-6-11-8080 10.20.6.11:8080 weight 100
    server 10-20-6-12-8080 10.20.6.12:8080 weight 100

backend pool_index
    mode http
    balance hdr(X-Shard-Key)
    server 10-20-6-21-9200 10.20.6.21:9200 weight 100
    server 10-20-6-22-9200 10.20.6.22:9200 weight 100

backend pool_tenant-shard
    mode http
    balance url_param tenant_id
    server 10-20-6-31-8080 10.20.6.31:8080 weight 100
    server 10-20-6-32-8080 10.20.6.32:8080 weight 100
