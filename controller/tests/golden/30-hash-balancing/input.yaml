render:
  se_group: seg-edge
tenants:
- id: t-acme
  name: acme
networks:
- id: net-lb
  tenant_id: t-acme
  name: lb
  cidr: 192.0.2.0/24
  gateway: 192.0.2.1
- id: net-be
  tenant_id: t-acme
  name: backend
  cidr: 10.20.0.0/16
se_groups:
- id: seg-edge
  tenant_id: t-acme
  name: edge
  ha_mode: vrrp
  networks:
  - network_id: net-lb
    role: vip
  - network_id: net-be
    role: backend
pools:
# A cache farm: the request path picks the cache, so one object stays on one member.
- id: p-cache
  tenant_id: t-acme
  name: cache
  algorithm: uri
  members:
  - address: 10.20.6.11
    port: 8080
  - address: 10.20.6.12
    port: 8080
# A sharded index: the routing header picks the shard.
- id: p-index
  tenant_id: t-acme
  name: index
  algorithm: hdr
  hash_key: X-Shard-Key
  members:
  - address: 10.20.6.21
    port: 9200
  - address: 10.20.6.22
    port: 9200
# A tenant shard chosen by a query parameter.
- id: p-tenant
  tenant_id: t-acme
  name: tenant-shard
  algorithm: url_param
  hash_key: tenant_id
  members:
  - address: 10.20.6.31
    port: 8080
  - address: 10.20.6.32
    port: 8080
health_monitors:
- id: hm-http
  tenant_id: t-acme
  name: http-200
  type: http
  interval_s: 10
  timeout_s: 4
  rise: 3
  fall: 2
  http:
    method: GET
    path: /healthz
    expect_status:
    - 200
virtual_services:
- id: v-farm
  tenant_id: t-acme
  se_group_id: seg-edge
  name: farm
  protocol: http
  vip: 192.0.2.26
  ports:
  - port: 80
  routes:
  - match:
      host: cache.example.test
    pool_id: p-cache
  - match:
      host: index.example.test
    pool_id: p-index
  - match:
      host: shards.example.test
    pool_id: p-tenant
  default_pool_id: p-cache
