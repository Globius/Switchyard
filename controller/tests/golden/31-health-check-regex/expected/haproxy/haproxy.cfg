# SE group: edge
# switchyard-render: sha256:9ca337ab390ee43f3b10346c00a1972b5adfcb8dac594fab59a043935545fbc5

global
    log /dev/log local0
    maxconn 20000
    stats socket /run/haproxy/admin.sock mode 660 level admin expose-fd listeners
    ssl-default-bind-options ssl-min-ver TLSv1.2 no-tls-tickets
    ssl-default-server-options ssl-min-ver TLSv1.2

defaults
    log global
    option dontlognull
    option redispatch
    retries 3
    timeout connect 5s
    timeout client 50s
    timeout server 50s
    timeout http-request 10s
    timeout http-keep-alive 10s
    timeout tunnel 1h

# Local health endpoint for keepalived's check script and the agent's route-health watchdog.
frontend sy_local_health
    mode http
    bind 127.0.0.1:8404
    monitor-uri /healthz
    no log

frontend vs_web
    mode http
    bind 192.0.2.61:80
    option httplog
    option forwardfor
    http-request return status 200 content-type text/plain lf-string "%[path,map(/etc/switchyard/haproxy/maps/acme-http01.map)]" if { dst_port 80 } { path,map(/etc/switchyard/haproxy/maps/acme-http01.map) -m found }
    http-request del-header X-Forwarded-For
    http-request set-header X-Forwarded-Proto https if { ssl_fc }
    http-request set-header X-Forwarded-Proto http if !{ ssl_fc }
    http-request set-var(txn.host) req.hdr(host),field(1,:),lower
    use_backend %[var(txn.host),map(/etc/switchyard/haproxy/maps/web-host.map)] if { var(txn.host),map(/etc/switchyard/haproxy/maps/web-host.map) -m found }

backend pool_body-regex
    mode http
    balance roundrobin
    option httpchk
    http-check send meth GET uri /version
    http-check expect rstring '"version":"v[0-9]+[.][0-9]+[.][0-9]+"'
    timeout check 3s
    default-server inter 5s fall 3 rise 2
    server 10-20-9-3-8081 10.20.9.3:8081 check weight 100

backend pool_status-regex
    mode http
    balance roundrobin
    option httpchk
    http-check send meth GET uri /healthz
    http-check expect rstatus '^2[0-9][0-9]$'
    timeout check 3s
    default-server inter 5s fall 3 rise 2
    server 10-20-9-2-8080 10.20.9.2:8080 check weight 100
