render:
  se_group: seg-edge
tenants:
- id: t-acme
  name: acme
networks:
- id: net-lb
  tenant_id: t-acme
  name: lb
  cidr: 192.0.2.0/24
  gateway: 192.0.2.1
- id: net-be
  tenant_id: t-acme
  name: backend
  cidr: 10.20.0.0/16
se_groups:
- id: seg-edge
  tenant_id: t-acme
  name: edge
  ha_mode: vrrp
  networks:
  - network_id: net-lb
    role: vip
  - network_id: net-be
    role: backend
health_monitors:
- id: hm-status
  tenant_id: t-acme
  name: status-regex
  type: http
  http:
    path: /healthz
    expect_status_regex: ^2[0-9][0-9]$
- id: hm-body
  tenant_id: t-acme
  name: body-regex
  type: http
  http:
    path: /version
    expect_body_regex: '"version":"v[0-9]+[.][0-9]+[.][0-9]+"'
pools:
- id: p-status
  tenant_id: t-acme
  name: status-regex
  health_monitor_id: hm-status
  members:
  - address: 10.20.9.2
    port: 8080
- id: p-body
  tenant_id: t-acme
  name: body-regex
  health_monitor_id: hm-body
  members:
  - address: 10.20.9.3
    port: 8081
virtual_services:
- id: v-web
  tenant_id: t-acme
  se_group_id: seg-edge
  name: web
  protocol: http
  vip: 192.0.2.61
  ports:
  - port: 80
  routes:
  - match:
      host: status.example.test
    pool_id: p-status
  - match:
      host: version.example.test
    pool_id: p-body
