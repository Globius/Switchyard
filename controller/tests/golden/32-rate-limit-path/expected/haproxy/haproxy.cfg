# SE group: edge
# switchyard-render: sha256:61a001b09a3cad2cf949ccb8098a04467af711cf7e31a7325f0f92a8e67e077b

global
    log /dev/log local0
    maxconn 20000
    stats socket /run/haproxy/admin.sock mode 660 level admin expose-fd listeners
    ssl-default-bind-options ssl-min-ver TLSv1.2 no-tls-tickets
    ssl-default-server-options ssl-min-ver TLSv1.2

defaults
    log global
    option dontlognull
    option redispatch
    retries 3
    timeout connect 5s
    timeout client 50s
    timeout server 50s
    timeout http-request 10s
    timeout http-keep-alive 10s
    timeout tunnel 1h

# Local health endpoint for keepalived's check script and the agent's route-health watchdog.
frontend sy_local_health
    mode http
    bind 127.0.0.1:8404
    monitor-uri /healthz
    no log

frontend vs_shop
    mode http
    bind 192.0.2.44:443 ssl crt-list /etc/switchyard/certs/shop.crtlist alpn http/1.1,acme-tls/1
    option httplog
    option forwardfor
    timeout tarpit 2s
    http-request del-header X-Forwarded-For
    http-request set-header X-Forwarded-Proto https if { ssl_fc }
    http-request set-header X-Forwarded-Proto http if !{ ssl_fc }
    http-request set-var(txn.host) req.hdr(host),field(1,:),lower
    http-request track-sc0 path table rl_shop_per-url_1 if { path_beg /catalog }
    http-request return status 429 hdr Retry-After 60 if { sc_http_req_rate(0,rl_shop_per-url_1) gt 300 }
    http-request track-sc1 src table rl_shop_per-url_2
    http-request tarpit deny_status 429 if { sc_http_req_rate(1,rl_shop_per-url_2) gt 1000 }
    default_backend pool_shop

backend pool_shop
    mode http
    balance roundrobin
    server 10-20-3-11-8080 10.20.3.11:8080 weight 100

backend rl_shop_per-url_1
    stick-table type string len 128 size 50000 expire 300s store http_req_rate(60s)

backend rl_shop_per-url_2
    stick-table type ipv6 size 10000 expire 60s store http_req_rate(10s)
