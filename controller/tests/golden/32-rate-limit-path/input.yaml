render:
  se_group: seg-edge
tenants:
- id: t-acme
  name: acme
networks:
- id: net-lb
  tenant_id: t-acme
  name: lb
  cidr: 192.0.2.0/24
  gateway: 192.0.2.1
- id: net-be
  tenant_id: t-acme
  name: backend
  cidr: 10.20.0.0/16
se_groups:
- id: seg-edge
  tenant_id: t-acme
  name: edge
  ha_mode: vrrp
  networks:
  - network_id: net-lb
    role: vip
  - network_id: net-be
    role: backend
certificates:
- id: c-shop
  tenant_id: t-acme
  name: shop-example-test
  source: cloudflare_origin
  sans:
  - shop.example.test
  not_after: '2038-01-01T00:00:00+00:00'
  secret_ref: kv/tenants/acme/certs/shop-example-test
pools:
- id: p-shop
  tenant_id: t-acme
  name: shop
  members:
  - address: 10.20.3.11
    port: 8080
policy_sets:
- id: ps-urls
  tenant_id: t-acme
  name: per-url
  kind: rate_limit
  rules:
  # one counter per URL: the same ceiling for every client of this engine, query ignored
  - match:
      path_prefix: /catalog
    key: path
    max_requests: 300
    period_s: 60
    entry_ttl_s: 300
    table_size: 50000
    action: deny
    deny_status: 429
  # a per-client floor under it, tracked after the URL counter
  - max_requests: 1000
    period_s: 10
    action: tarpit
    tarpit_s: 2
virtual_services:
- id: v-shop
  tenant_id: t-acme
  se_group_id: seg-edge
  name: shop
  protocol: http
  vip: 192.0.2.44
  ports:
  - port: 443
    tls: true
  certificate_ids:
  - c-shop
  policy_set_ids:
  - ps-urls
  default_pool_id: p-shop
