# SE group: edge
# switchyard-render: sha256:bf893fabf56f44145901695089c0c5a53deff412cb1cf04584838d6b30c7bdd3

global
    log /dev/log local0
    maxconn 20000
    stats socket /run/haproxy/admin.sock mode 660 level admin expose-fd listeners
    ssl-default-bind-options ssl-min-ver TLSv1.2 no-tls-tickets
    ssl-default-server-options ssl-min-ver TLSv1.2

defaults
    log global
    option dontlognull
    option redispatch
    retries 3
    timeout connect 5s
    timeout client 50s
    timeout server 50s
    timeout http-request 10s
    timeout http-keep-alive 10s
    timeout tunnel 1h

# Local health endpoint for keepalived's check script and the agent's route-health watchdog.
frontend sy_local_health
    mode http
    bind 127.0.0.1:8404
    monitor-uri /healthz
    no log

frontend vs_grpc
    mode http
    bind 192.0.2.63:443 ssl crt-list /etc/switchyard/certs/grpc.crtlist alpn h2,http/1.1,acme-tls/1
    option httplog
    option forwardfor
    http-request del-header X-Forwarded-For
    http-request set-header X-Forwarded-Proto https if { ssl_fc }
    http-request set-header X-Forwarded-Proto http if !{ ssl_fc }
    http-request set-var(txn.host) req.hdr(host),field(1,:),lower
    use_backend %[var(txn.host),map(/etc/switchyard/haproxy/maps/grpc-host.map)] if { var(txn.host),map(/etc/switchyard/haproxy/maps/grpc-host.map) -m found }

backend pool_grpc-h2
    mode http
    balance roundrobin
    option httpchk
    http-check connect default proto h2
    http-check send meth POST uri /grpc.health.v1.Health/Check ver HTTP/2 hdr content-type application/grpc hdr te trailers
    http-check expect status 200 comment service=acme.echo.Health
    timeout check 2s
    default-server inter 10s fall 4 rise 3
    server 10-20-9-20-50051 10.20.9.20:50051 check check-ssl check-sni echo.example.test ssl verify none sni req.hdr(host),field(1,:),lower alpn h2 weight 100
    server 10-20-9-21-50051 10.20.9.21:50051 check check-ssl check-sni echo.example.test ssl verify none sni req.hdr(host),field(1,:),lower alpn h2 weight 100

backend pool_grpc-h2c
    mode http
    balance roundrobin
    option httpchk
    http-check connect default proto h2
    http-check send meth POST uri /grpc.health.v1.Health/Check ver HTTP/2 hdr content-type application/grpc hdr te trailers
    http-check expect status 200
    timeout check 3s
    default-server inter 5s fall 3 rise 2
    server 10-20-9-22-50051 10.20.9.22:50051 check proto h2 weight 100
