# A gRPC pool checked with the ``grpc`` monitor kind (ADR 0227): HTTP/2 to the members over TLS
# (``h2``) and without (``h2c``), with and without a service name.
render:
  se_group: seg-edge
tenants:
- id: t-acme
  name: acme
networks:
- id: net-lb
  tenant_id: t-acme
  name: lb
  cidr: 192.0.2.0/24
  gateway: 192.0.2.1
- id: net-be
  tenant_id: t-acme
  name: backend
  cidr: 10.20.0.0/16
se_groups:
- id: seg-edge
  tenant_id: t-acme
  name: edge
  ha_mode: vrrp
  networks:
  - network_id: net-lb
    role: vip
  - network_id: net-be
    role: backend
certificates:
- id: cert-wild
  tenant_id: t-acme
  name: wild-example-test
  source: cloudflare_origin
  sans: ["*.example.test", "example.test"]
  not_after: 2038-01-01T00:00:00+00:00
  secret_ref: kv/tenants/acme/certs/wild-example-test
health_monitors:
- id: hm-grpc-h2
  tenant_id: t-acme
  name: grpc-h2
  type: grpc
  interval_s: 10
  timeout_s: 2
  rise: 3
  fall: 4
  grpc:
    service: acme.echo.Health
    expect_status: [200]
- id: hm-grpc-h2c
  tenant_id: t-acme
  name: grpc-h2c
  type: grpc
  grpc: {}
pools:
- id: p-grpc-h2
  tenant_id: t-acme
  name: grpc-h2
  health_monitor_id: hm-grpc-h2
  backend_protocol: h2
  tls: true
  members:
  - address: 10.20.9.20
    port: 50051
  - address: 10.20.9.21
    port: 50051
- id: p-grpc-h2c
  tenant_id: t-acme
  name: grpc-h2c
  health_monitor_id: hm-grpc-h2c
  backend_protocol: h2c
  members:
  - address: 10.20.9.22
    port: 50051
virtual_services:
- id: v-grpc
  tenant_id: t-acme
  se_group_id: seg-edge
  name: grpc
  protocol: http
  vip: 192.0.2.63
  ports:
  - port: 443
    tls: true
    http2: true
  certificate_ids: [cert-wild]
  routes:
  - match:
      host: echo.example.test
    pool_id: p-grpc-h2
  - match:
      host: echo-plain.example.test
    pool_id: p-grpc-h2c
