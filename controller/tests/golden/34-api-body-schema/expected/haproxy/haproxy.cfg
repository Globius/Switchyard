global
    log /dev/log local0
    maxconn 20000
    stats socket /run/haproxy/admin.sock mode 660 level admin expose-fd listeners
    ssl-default-bind-options ssl-min-ver TLSv1.2 no-tls-tickets
    ssl-default-server-options ssl-min-ver TLSv1.2

defaults
    log global
    option dontlognull
    option redispatch
    retries 3
    timeout connect 5s
    timeout client 50s
    timeout server 50s
    timeout http-request 10s
    timeout http-keep-alive 10s
    timeout tunnel 1h

# Local health endpoint for keepalived's check script and the agent's route-health watchdog.
frontend sy_local_health
    mode http
    bind 127.0.0.1:8404
    monitor-uri /healthz
    no log

frontend vs_orders
    mode http
    bind 192.0.2.81:80
    option httplog
    option forwardfor
    filter spoe engine coraza config /etc/switchyard/haproxy/lists/waf-orders.spoe
    option http-buffer-request
    http-request return status 200 content-type text/plain lf-string "%[path,map(/etc/switchyard/haproxy/maps/acme-http01.map)]" if { dst_port 80 } { path,map(/etc/switchyard/haproxy/maps/acme-http01.map) -m found }
    http-request del-header X-Forwarded-For
    http-request set-header X-Forwarded-Proto https if { ssl_fc }
    http-request set-header X-Forwarded-Proto http if !{ ssl_fc }
    http-request set-var(txn.host) req.hdr(host),field(1,:),lower
    http-request set-var(txn.sy_apip) int(1) if { path -m reg '^/v1/orders$' }
    http-request set-var(txn.sy_api) int(1) if { method POST } { path -m reg '^/v1/orders$' } !{ var(txn.sy_api) -m found }
    http-request set-var(txn.sy_apiv) str(path) if !{ var(txn.sy_apiv) -m found } { path -m reg '(^|/)[.]{1,2}(/|$)' }
    http-request set-var(txn.sy_apiv) str(path) if !{ var(txn.sy_apiv) -m found } { path -m reg '//|%2[eEfF]|%5[cC]' }
    http-request set-var(txn.sy_apiv) str(path) if !{ var(txn.sy_apiv) -m found } !{ var(txn.sy_apip) -m found }
    http-request set-var(txn.sy_apiv) str(method) if !{ var(txn.sy_apiv) -m found } { var(txn.sy_apip) -m found } !{ var(txn.sy_api) -m found }
    http-request set-var(txn.sy_apiv) str(query) if !{ var(txn.sy_apiv) -m found } { var(txn.sy_api) -m int 1 } { query -m reg '.' }
    http-request set-var(txn.sy_apiv) str(ctype) if !{ var(txn.sy_apiv) -m found } { var(txn.sy_api) -m int 1 } { req.hdr_val(content-length) gt 0 } !{ req.hdr(content-type),field(1,;),lower -m str "application/json" }
    http-request set-var(txn.sy_apiv) str(ctype) if !{ var(txn.sy_apiv) -m found } { var(txn.sy_api) -m int 1 } { req.hdr(transfer-encoding) -m found } !{ req.hdr(content-type),field(1,;),lower -m str "application/json" }
    http-request capture var(txn.sy_apiv) len 8
    default_backend pool_shop

frontend vs_pets
    mode http
    bind 192.0.2.80:80
    option httplog
    option forwardfor
    filter spoe engine coraza config /etc/switchyard/haproxy/lists/waf-pets.spoe
    option http-buffer-request
    http-request return status 200 content-type text/plain lf-string "%[path,map(/etc/switchyard/haproxy/maps/acme-http01.map)]" if { dst_port 80 } { path,map(/etc/switchyard/haproxy/maps/acme-http01.map) -m found }
    http-request del-header X-Forwarded-For
    http-request set-header X-Forwarded-Proto https if { ssl_fc }
    http-request set-header X-Forwarded-Proto http if !{ ssl_fc }
    http-request set-var(txn.host) req.hdr(host),field(1,:),lower
    http-request set-var(txn.sy_apip) int(1) if { path -m reg '^/v1/pets$' }
    http-request set-var(txn.sy_api) int(1) if { method GET } { path -m reg '^/v1/pets$' } !{ var(txn.sy_api) -m found }
    http-request set-var(txn.sy_apip) int(1) if { path -m reg '^/v1/pets$' }
    http-request set-var(txn.sy_api) int(2) if { method POST } { path -m reg '^/v1/pets$' } !{ var(txn.sy_api) -m found }
    http-request set-var(txn.sy_apip) int(1) if { path -m reg '^/v1/pets/([0-9A-Fa-f]{8}-[0-9A-Fa-f]{4}-[0-9A-Fa-f]{4}-[0-9A-Fa-f]{4}-[0-9A-Fa-f]{12})$' }
    http-request set-var(txn.sy_api) int(3) if { method PUT } { path -m reg '^/v1/pets/([0-9A-Fa-f]{8}-[0-9A-Fa-f]{4}-[0-9A-Fa-f]{4}-[0-9A-Fa-f]{4}-[0-9A-Fa-f]{12})$' } !{ var(txn.sy_api) -m found }
    http-request set-var(txn.sy_apiv) str(path) if !{ var(txn.sy_apiv) -m found } { path -m reg '(^|/)[.]{1,2}(/|$)' }
    http-request set-var(txn.sy_apiv) str(path) if !{ var(txn.sy_apiv) -m found } { path -m reg '//|%2[eEfF]|%5[cC]' }
    http-request set-var(txn.sy_apiv) str(path) if !{ var(txn.sy_apiv) -m found } !{ var(txn.sy_apip) -m found }
    http-request set-var(txn.sy_apiv) str(method) if !{ var(txn.sy_apiv) -m found } { var(txn.sy_apip) -m found } !{ var(txn.sy_api) -m found }
    http-request set-var(txn.sy_apiv) str(query) if !{ var(txn.sy_apiv) -m found } { var(txn.sy_api) -m int 1 } { query -m reg '.' } !{ query -m reg '^(limit=-?[0-9]{1,18})(&(limit=-?[0-9]{1,18}))*$' }
    http-request set-var(txn.sy_apiv) str(length) if !{ var(txn.sy_apiv) -m found } { var(txn.sy_api) -m int 1 } { req.hdr(transfer-encoding) -m found }
    http-request set-var(txn.sy_apiv) str(size) if !{ var(txn.sy_apiv) -m found } { var(txn.sy_api) -m int 1 } { req.hdr_val(content-length) gt 65536 }
    http-request set-var(txn.sy_apiv) str(query) if !{ var(txn.sy_apiv) -m found } { var(txn.sy_api) -m int 2 } { query -m reg '.' }
    http-request set-var(txn.sy_apiv) str(ctype) if !{ var(txn.sy_apiv) -m found } { var(txn.sy_api) -m int 2 } { req.hdr_val(content-length) gt 0 } !{ req.hdr(content-type),field(1,;),lower -m str "application/json" }
    http-request set-var(txn.sy_apiv) str(ctype) if !{ var(txn.sy_apiv) -m found } { var(txn.sy_api) -m int 2 } { req.hdr(transfer-encoding) -m found } !{ req.hdr(content-type),field(1,;),lower -m str "application/json" }
    http-request set-var(txn.sy_apiv) str(length) if !{ var(txn.sy_apiv) -m found } { var(txn.sy_api) -m int 2 } { req.hdr(transfer-encoding) -m found }
    http-request set-var(txn.sy_apiv) str(size) if !{ var(txn.sy_apiv) -m found } { var(txn.sy_api) -m int 2 } { req.hdr_val(content-length) gt 65536 }
    http-request set-var(txn.sy_apiv) str(query) if !{ var(txn.sy_apiv) -m found } { var(txn.sy_api) -m int 3 } { query -m reg '.' }
    http-request set-var(txn.sy_apiv) str(ctype) if !{ var(txn.sy_apiv) -m found } { var(txn.sy_api) -m int 3 } { req.hdr_val(content-length) gt 0 } !{ req.hdr(content-type),field(1,;),lower -m str "application/json" }
    http-request set-var(txn.sy_apiv) str(ctype) if !{ var(txn.sy_apiv) -m found } { var(txn.sy_api) -m int 3 } { req.hdr(transfer-encoding) -m found } !{ req.hdr(content-type),field(1,;),lower -m str "application/json" }
    http-request set-var(txn.sy_apiv) str(length) if !{ var(txn.sy_apiv) -m found } { var(txn.sy_api) -m int 3 } { req.hdr(transfer-encoding) -m found }
    http-request set-var(txn.sy_apiv) str(size) if !{ var(txn.sy_apiv) -m found } { var(txn.sy_api) -m int 3 } { req.hdr_val(content-length) gt 65536 }
    http-request capture var(txn.sy_apiv) len 8
    http-request deny deny_status 400 if { var(txn.sy_apiv) -m str query param }
    http-request deny deny_status 404 if { var(txn.sy_apiv) -m str path }
    http-request deny deny_status 405 if { var(txn.sy_apiv) -m str method }
    http-request return status 411 content-type text/plain string "length required" if { var(txn.sy_apiv) -m str length }
    http-request return status 413 content-type text/plain string "request body too large" if { var(txn.sy_apiv) -m str size }
    http-request return status 415 content-type text/plain string "unsupported media type" if { var(txn.sy_apiv) -m str ctype }
    http-request capture var(txn.coraza.action) len 8
    http-request deny deny_status 403 if { var(txn.coraza.action) -m str deny }
    http-request silent-drop if { var(txn.coraza.action) -m str drop }
    default_backend pool_app

backend sy_coraza_spoa
    mode tcp
    balance roundrobin
    timeout connect 5s
    timeout server 3m
    server coraza 127.0.0.1:9000

backend pool_app
    mode http
    balance roundrobin
    server 10-20-11-2-8080 10.20.11.2:8080 weight 100

backend pool_shop
    mode http
    balance roundrobin
    server 10-20-11-3-8080 10.20.11.3:8080 weight 100
