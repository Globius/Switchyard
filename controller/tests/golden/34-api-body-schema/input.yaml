render:
  se_group: seg-edge
tenants:
- id: t-acme
  name: acme
networks:
- id: net-lb
  tenant_id: t-acme
  name: lb
  cidr: 192.0.2.0/24
  gateway: 192.0.2.1
- id: net-be
  tenant_id: t-acme
  name: backend
  cidr: 10.20.0.0/16
se_groups:
- id: seg-edge
  tenant_id: t-acme
  name: edge
  ha_mode: vrrp
  networks:
  - network_id: net-lb
    role: vip
  - network_id: net-be
    role: backend
policy_sets:
# One operation with a scalar body, one with a nested object, an enum, an array and a uuid.
- id: ps-pets
  tenant_id: t-acme
  name: pets-waf
  kind: waf
  mode: block
  api:
    mode: block
    base_path: /v1
    max_body_bytes: 65536
    operations:
    - method: GET
      path: /pets
      query:
      - {name: limit, kind: integer}
    - method: POST
      path: /pets
      content_types: [application/json]
      body:
        properties:
        - {name: name, kind: string, required: true, max_length: 64}
        - {name: age, kind: integer}
        - {name: kind, kind: enum, values: [cat, dog], required: true}
        - {name: chip, kind: uuid}
        - name: owner
          kind: object
          required: true
          properties:
          - {name: email, kind: string, required: true, max_length: 254}
          - {name: phone, kind: string}
        - {name: tags, kind: array, items: string, max_items: 8}
    - method: PUT
      path: '/pets/{id}'
      path_params: [{name: id, kind: uuid}]
      content_types: [application/json]
      body:
        properties:
        - {name: name, kind: string, max_length: 64}
# Same shape in detect mode: the rule logs and lets the request through.
- id: ps-orders
  tenant_id: t-acme
  name: orders-waf
  kind: waf
  api:
    base_path: /v1
    operations:
    - method: POST
      path: /orders
      content_types: [application/json]
      body:
        properties:
        - {name: ref, kind: string, required: true, max_length: 32}
        - {name: total, kind: number}
pools:
- id: p-app
  tenant_id: t-acme
  name: app
  members:
  - address: 10.20.11.2
    port: 8080
- id: p-shop
  tenant_id: t-acme
  name: shop
  members:
  - address: 10.20.11.3
    port: 8080
virtual_services:
- id: v-app
  tenant_id: t-acme
  se_group_id: seg-edge
  name: pets
  protocol: http
  vip: 192.0.2.80
  ports:
  - port: 80
  policy_set_ids: [ps-pets]
  default_pool_id: p-app
- id: v-shop
  tenant_id: t-acme
  se_group_id: seg-edge
  name: orders
  protocol: http
  vip: 192.0.2.81
  ports:
  - port: 80
  policy_set_ids: [ps-orders]
  default_pool_id: p-shop
