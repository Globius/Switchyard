# SE group: edge
# switchyard-render: sha256:9b26b90f350c56b02ba9f1136b1f9bbaaf6b74e12509f562a1d52c37dfa405db

global
    log /dev/log local0
    maxconn 20000
    stats socket /run/haproxy/admin.sock mode 660 level admin expose-fd listeners
    ssl-default-bind-options ssl-min-ver TLSv1.2 no-tls-tickets
    ssl-default-server-options ssl-min-ver TLSv1.2

defaults
    log global
    option dontlognull
    option redispatch
    retries 3
    unique-id-format %[uuid()]
    timeout connect 5s
    timeout client 50s
    timeout server 50s
    timeout http-request 10s
    timeout http-keep-alive 10s
    timeout tunnel 1h

# Local health endpoint for keepalived's check script and the agent's route-health watchdog.
frontend sy_local_health
    mode http
    bind 127.0.0.1:8404
    monitor-uri /healthz
    no log

frontend vs_any-source
    mode http
    bind 192.0.2.31:443 ssl crt-list /etc/switchyard/certs/any-source.crtlist alpn http/1.1,acme-tls/1
    option httplog
    log-format "%ci:%cp [%tr] %f %b/%s %TR/%Tw/%Tc/%Tr/%Ta %ST %B request_id=%ID sni=%{+Q}[ssl_fc_sni] host=%{+Q}[var(txn.host)] upstream=%[bc_dst] upstream_port=%[bc_dst_port] retries=%rc %tsc %ac/%fc/%bc/%sc %sq/%bq %hr %hs %{+Q}r"
    option forwardfor
    http-request set-src req.hdr_ip(CF-Connecting-IP) if { req.fhdr_cnt(CF-Connecting-IP) eq 1 } { req.fhdr(CF-Connecting-IP) -m reg ^([0-9]+[.][0-9]+[.][0-9]+[.][0-9]+|[0-9A-Fa-f:.]*:[0-9A-Fa-f:.]*:[0-9A-Fa-f:.]*)$ } { req.hdr_ip(CF-Connecting-IP) -m found }
    http-request del-header CF-Connecting-IP if !{ req.fhdr_cnt(CF-Connecting-IP) eq 1 } || !{ req.fhdr(CF-Connecting-IP) -m reg ^([0-9]+[.][0-9]+[.][0-9]+[.][0-9]+|[0-9A-Fa-f:.]*:[0-9A-Fa-f:.]*:[0-9A-Fa-f:.]*)$ } || !{ req.hdr_ip(CF-Connecting-IP) -m found }
    http-request del-header X-Forwarded-For
    http-request set-header X-Forwarded-Proto https if { ssl_fc }
    http-request set-header X-Forwarded-Proto http if !{ ssl_fc }
    http-request set-var(txn.host) req.hdr(host),field(1,:),lower
    use_backend %[var(txn.host),map(/etc/switchyard/haproxy/maps/any-source-host.map)] if { var(txn.host),map(/etc/switchyard/haproxy/maps/any-source-host.map) -m found }

