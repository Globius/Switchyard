frontend vs_with-list
    mode http
    bind 192.0.2.30:443 ssl crt-list /etc/switchyard/certs/with-list.crtlist alpn http/1.1,acme-tls/1
    option httplog
    log-format "%ci:%cp [%tr] %f %b/%s %TR/%Tw/%Tc/%Tr/%Ta %ST %B request_id=%ID sni=%{+Q}[ssl_fc_sni] host=%{+Q}[var(txn.host)] upstream=%[bc_dst] upstream_port=%[bc_dst_port] retries=%rc %tsc %ac/%fc/%bc/%sc %sq/%bq %hr %hs %{+Q}r"
    option forwardfor
    http-request set-var(txn.trusted) bool(true) if { src -f /etc/switchyard/haproxy/lists/cloudflare-ranges.cidr }
    http-request set-src req.hdr_ip(CF-Connecting-IP) if { var(txn.trusted) -m bool } { req.fhdr_cnt(CF-Connecting-IP) eq 1 } { req.fhdr(CF-Connecting-IP) -m reg ^([0-9]+[.][0-9]+[.][0-9]+[.][0-9]+|[0-9A-Fa-f:.]*:[0-9A-Fa-f:.]*:[0-9A-Fa-f:.]*)$ } { req.hdr_ip(CF-Connecting-IP) -m found }
    http-request del-header CF-Connecting-IP if !{ var(txn.trusted) -m bool }
    http-request del-header CF-Connecting-IP if !{ req.fhdr_cnt(CF-Connecting-IP) eq 1 } || !{ req.fhdr(CF-Connecting-IP) -m reg ^([0-9]+[.][0-9]+[.][0-9]+[.][0-9]+|[0-9A-Fa-f:.]*:[0-9A-Fa-f:.]*:[0-9A-Fa-f:.]*)$ } || !{ req.hdr_ip(CF-Connecting-IP) -m found }
    http-request del-header X-Forwarded-For
    http-request set-header X-Forwarded-Proto https if { ssl_fc }
    http-request set-header X-Forwarded-Proto http if !{ ssl_fc }
    http-request set-var(txn.host) req.hdr(host),field(1,:),lower
    use_backend %[var(txn.host),map(/etc/switchyard/haproxy/maps/with-list-host.map)] if { var(txn.host),map(/etc/switchyard/haproxy/maps/with-list-host.map) -m found }

backend pool_site
    mode http
    balance roundrobin
    server 10-20-7-10-8080 10.20.7.10:8080 weight 100
