render:
  se_group: seg-edge
tenants:
- id: t-acme
  name: acme
networks:
- id: net-lb
  tenant_id: t-acme
  name: lb
  cidr: 192.0.2.0/24
  gateway: 192.0.2.1
- id: net-be
  tenant_id: t-acme
  name: backend
  cidr: 10.20.0.0/16
se_groups:
- id: seg-edge
  tenant_id: t-acme
  name: edge
  ha_mode: vrrp
  networks:
  - network_id: net-lb
    role: vip
  - network_id: net-be
    role: backend
certificates:
- id: c-wild
  tenant_id: t-acme
  name: origin-example-test
  source: cloudflare_origin
  sans:
  - '*.example.test'
  - example.test
  not_after: '2038-01-01T00:00:00+00:00'
  secret_ref: kv/tenants/acme/certs/origin-example-test
pools:
- id: p-site
  tenant_id: t-acme
  name: site
  members:
  - address: 10.20.7.10
    port: 8080
policy_sets:
- id: ps-cf
  tenant_id: t-acme
  name: cloudflare-ranges
  kind: allow_list
  managed_by: cloudflare
  cidrs:
  - 198.51.100.0/24
  - 203.0.113.0/24
  - 2001:db8:100::/40
  - 192.0.2.128/25
virtual_services:
- id: v-list
  tenant_id: t-acme
  se_group_id: seg-edge
  name: with-list
  protocol: http
  vip: 192.0.2.30
  ports:
  - port: 443
    tls: true
  certificate_ids:
  - c-wild
  routes:
  - match:
      host: with-list.example.test
    pool_id: p-site
  allow_list_id: ps-cf
  restore_client_ip_header: CF-Connecting-IP
- id: v-any
  tenant_id: t-acme
  se_group_id: seg-edge
  name: any-source
  protocol: http
  vip: 192.0.2.31
  ports:
  - port: 443
    tls: true
  certificate_ids:
  - c-wild
  routes:
  - match:
      host: any-source.example.test
    pool_id: p-site
  restore_client_ip_header: CF-Connecting-IP
  restore_client_ip_from_any_source: true
- id: v-none
  tenant_id: t-acme
  se_group_id: seg-edge
  name: no-header
  protocol: http
  vip: 192.0.2.32
  ports:
  - port: 443
    tls: true
  certificate_ids:
  - c-wild
  routes:
  - match:
      host: no-header.example.test
    pool_id: p-site
