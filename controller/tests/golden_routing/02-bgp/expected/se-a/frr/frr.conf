! Managed by Switchyard. Do not edit: changes are reported as drift.
! SE group: edge, engine: se-a
frr defaults traditional
hostname se-a
log syslog informational
!
! Each VIP is also a local address on lo: the kernel accepts traffic for it and BGP's `network` statement finds the
! prefix in the routing table (otherwise it is never announced).
interface lo
 ip address 192.0.2.20/32
 ip address 192.0.2.21/32
exit
!
ip prefix-list SY-VIPS seq 5 permit 192.0.2.20/32
ip prefix-list SY-VIPS seq 10 permit 192.0.2.21/32
route-map SY-OUT permit 10
 match ip address prefix-list SY-VIPS
route-map SY-OUT permit 20
 match ipv6 address prefix-list SY-VIPS6
route-map SY-IN deny 10
!
router bgp 65010
 bgp router-id 10.30.0.11
 no bgp default ipv4-unicast
 bgp bestpath as-path multipath-relax
 neighbor 10.30.0.1 remote-as 65001
 neighbor 10.30.0.1 password example-password-1
 neighbor 10.30.0.1 bfd
 neighbor 10.30.0.2 remote-as 65001
 neighbor 10.30.0.2 bfd
 !
 address-family ipv4 unicast
  network 192.0.2.20/32
  network 192.0.2.21/32
  neighbor 10.30.0.1 activate
  neighbor 10.30.0.1 route-map SY-OUT out
  neighbor 10.30.0.1 route-map SY-IN in
  neighbor 10.30.0.2 activate
  neighbor 10.30.0.2 route-map SY-OUT out
  neighbor 10.30.0.2 route-map SY-IN in
  maximum-paths 4
 exit-address-family
 !
 address-family ipv6 unicast
  maximum-paths 4
 exit-address-family
!
ip route 10.99.0.0/16 10.30.0.1
