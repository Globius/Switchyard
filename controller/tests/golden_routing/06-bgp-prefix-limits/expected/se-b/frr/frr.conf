! Managed by Switchyard. Do not edit: changes are reported as drift.
! SE group: edge, engine: se-b
frr defaults traditional
hostname se-b
log syslog informational
!
! Each VIP is also a local address on lo: the kernel accepts traffic for it and BGP's `network` statement finds the
! prefix in the routing table (otherwise it is never announced).
interface lo
 ip address 192.0.2.20/32
 ipv6 address 2001:db8:10::20/128
exit
!
ip prefix-list SY-VIPS seq 5 permit 192.0.2.20/32
ipv6 prefix-list SY-VIPS6 seq 5 permit 2001:db8:10::20/128
route-map SY-OUT permit 10
 match ip address prefix-list SY-VIPS
route-map SY-OUT permit 20
 match ipv6 address prefix-list SY-VIPS6
route-map SY-IN deny 10
!
router bgp 4200000001
 bgp router-id 10.30.0.12
 no bgp default ipv4-unicast
 bgp bestpath as-path multipath-relax
 neighbor 10.30.0.1 remote-as 65001
 neighbor 2001:db8:30::1 remote-as 65001
 !
 address-family ipv4 unicast
  network 192.0.2.20/32
  neighbor 10.30.0.1 activate
  neighbor 10.30.0.1 route-map SY-OUT out
  neighbor 10.30.0.1 route-map SY-IN in
  neighbor 10.30.0.1 maximum-prefix 100 restart 5
  maximum-paths 4
 exit-address-family
 !
 address-family ipv6 unicast
  network 2001:db8:10::20/128
  neighbor 2001:db8:30::1 activate
  neighbor 2001:db8:30::1 route-map SY-OUT out
  neighbor 2001:db8:30::1 route-map SY-IN in
  neighbor 2001:db8:30::1 maximum-prefix 5 restart 5
  maximum-paths 4
 exit-address-family
!
