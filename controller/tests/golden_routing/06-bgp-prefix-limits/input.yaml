tenants:
- id: t-acme
  name: acme
networks:
- id: net-lb
  tenant_id: t-acme
  name: lb
  cidr: 192.0.2.0/24
  gateway: 192.0.2.1
- id: net-be
  tenant_id: t-acme
  name: backend
  cidr: 10.20.0.0/24
- id: net-v6
  tenant_id: t-acme
  name: lb6
  cidr: 2001:db8:10::/64
vip_pools:
- id: vp-main
  tenant_id: t-acme
  name: main
  network_id: net-lb
  ranges:
  - start: 192.0.2.10
    end: 192.0.2.50
se_groups:
- id: seg-1
  tenant_id: t-acme
  name: edge
  ha_mode: bgp
  networks:
  - network_id: net-lb
    role: vip
  - network_id: net-be
    role: backend
  - network_id: net-v6
    role: vip
  routing_profile_id: rp-1
certificates:
- id: cert-wild
  tenant_id: t-acme
  name: wild-example-test
  source: cloudflare_origin
  sans:
  - '*.example.test'
  - example.test
  not_after: '2038-01-01T00:00:00+00:00'
  secret_ref: kv/tenants/acme/certs/wild-example-test
pools:
- id: pool-web
  tenant_id: t-acme
  name: web
  members:
  - address: 10.20.0.11
    port: 8080
- id: pool-k8s
  tenant_id: t-acme
  name: k8s
  members:
  - address: 10.20.0.30
    port: 6443
virtual_services:
- id: vs-web
  tenant_id: t-acme
  se_group_id: seg-1
  name: web
  protocol: http
  vip: 192.0.2.20
  vip_pool_id: vp-main
  ports:
  - port: 443
    tls: true
    http2: true
  - port: 80
    https_redirect_port: 443
  certificate_ids:
  - cert-wild
  routes:
  - match:
      host: app.example.test
    pool_id: pool-web
- id: vs-v6
  tenant_id: t-acme
  se_group_id: seg-1
  name: v6
  protocol: tcp
  vip: 2001:db8:10::20
  ports:
  - port: 6443
  default_pool_id: pool-k8s
routing_profiles:
- id: rp-1
  tenant_id: t-acme
  name: edge-routing
  kind: bgp
  asn: 4200000001
  bfd: false
  max_prefixes: 100
  peers:
  - peer_ip: 10.30.0.1
    remote_asn: 65001
  - peer_ip: 2001:db8:30::1
    remote_asn: 65001
    max_prefixes: 5
render:
  se_group: seg-1
  engines:
  - name: se-a
    index: 0
    router_id: 10.30.0.11
  - name: se-b
    index: 1
    router_id: 10.30.0.12
  secrets:
    kv/bgp/peer-1: example-password-1
