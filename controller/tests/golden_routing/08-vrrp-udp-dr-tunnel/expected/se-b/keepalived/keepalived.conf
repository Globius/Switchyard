# Managed by Switchyard. Do not edit: changes are reported as drift.
# SE group: edge, engine: se-b

global_defs {
    enable_script_security
    script_user keepalived_script
    router_id se-b
}

vrrp_script sy_haproxy {
    script "/usr/bin/curl -fsS --max-time 2 http://127.0.0.1:8404/healthz"
    interval 2
    fall 3
    rise 2
    weight -60
}

vrrp_instance sy_edge {
    state BACKUP
    interface eth1
    virtual_router_id 51
    priority 140
    advert_int 1
    virtual_ipaddress {
        192.0.2.22/24 dev eth1
        192.0.2.23/24 dev eth1
        192.0.2.24/24 dev eth1
    }
    virtual_routes {
        10.99.0.0/16 via 192.0.2.1 dev eth1
    }
    track_script {
        sy_haproxy
    }
    notify_master "/bin/sh -c 'echo MASTER > /run/switchyard/vrrp-sy_edge.state'"
    notify_backup "/bin/sh -c 'echo BACKUP > /run/switchyard/vrrp-sy_edge.state'"
    notify_fault "/bin/sh -c 'echo FAULT > /run/switchyard/vrrp-sy_edge.state'"
}

# UDP service media-dr
virtual_server 192.0.2.22 5004 {
    delay_loop 5
    lb_algo rr
    lb_kind DR
    protocol UDP
    real_server 10.20.0.60 5004 {
        weight 100
    }
    real_server 10.20.0.61 5004 {
        weight 100
    }
}

# UDP service media-tun
virtual_server 192.0.2.23 5005 {
