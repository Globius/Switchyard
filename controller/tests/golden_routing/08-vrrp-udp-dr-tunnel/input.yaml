    role: vip
  - network_id: net-be
    role: backend
  routing_profile_id: rp-1
pools:
- id: pool-dr
  tenant_id: t-acme
  name: media-dr
  members:
  - address: 10.20.0.60
    port: 5004
  - address: 10.20.0.61
    port: 5004
- id: pool-tun
  tenant_id: t-acme
  name: media-tun
  members:
  - address: 10.99.4.10
    port: 5005
- id: pool-nat
  tenant_id: t-acme
  name: syslog
  members:
  - address: 10.20.0.70
    port: 514
virtual_services:
- id: vs-dr
  tenant_id: t-acme
  se_group_id: seg-1
  name: media-dr
  protocol: udp
  forward_mode: dr
  vip: 192.0.2.22
  ports:
  - port: 5004
  default_pool_id: pool-dr
- id: vs-tun
  tenant_id: t-acme
  se_group_id: seg-1
  name: media-tun
  protocol: udp
  forward_mode: tunnel
  vip: 192.0.2.23
  ports:
  - port: 5005
  default_pool_id: pool-tun
- id: vs-nat
  tenant_id: t-acme
  se_group_id: seg-1
  name: syslog
  protocol: udp
  vip: 192.0.2.24
  ports:
