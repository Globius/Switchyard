  default_pool_id: pool-nat
routing_profiles:
- id: rp-1
  tenant_id: t-acme
  name: edge-routing
  kind: vrrp
  vrid: 51
  interface: eth1
  static_routes:
  - prefix: 10.99.0.0/16
    next_hop: 192.0.2.1
render:
  se_group: seg-1
  engines:
  - name: se-a
    index: 0
    router_id: 10.30.0.11
  - name: se-b
    index: 1
    router_id: 10.30.0.12
  secrets:
    kv/bgp/peer-1: example-password-1
