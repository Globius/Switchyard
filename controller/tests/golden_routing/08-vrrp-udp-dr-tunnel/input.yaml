tenants:
- id: t-acme
  name: acme
networks:
- id: net-lb
  tenant_id: t-acme
  name: lb
  cidr: 192.0.2.0/24
  gateway: 192.0.2.1
- id: net-be
  tenant_id: t-acme
  name: backend
  cidr: 10.20.0.0/24
vip_pools:
- id: vp-main
  tenant_id: t-acme
  name: main
  network_id: net-lb
  ranges:
  - start: 192.0.2.10
    end: 192.0.2.50
se_groups:
- id: seg-1
  tenant_id: t-acme
  name: edge
  ha_mode: vrrp
  networks:
