-- dnsdist in front of PowerDNS (ADR 0164): the DNS firewall. Settings come from the environment (compose passes them).
-- Rate limits are per client network; answers to anything over the limit are dropped, not refused, so a spoofed
-- source cannot use this server to reflect traffic at a victim.
local pdns       = os.getenv("DNSDIST_BACKEND")   or "127.0.0.1:5300"
local qps        = tonumber(os.getenv("DNSDIST_QPS_LIMIT")  or "50")     -- sustained queries per second per client network
local burst      = tonumber(os.getenv("DNSDIST_QPS_BURST")  or "100")
local block_secs = tonumber(os.getenv("DNSDIST_BLOCK_SECONDS") or "60")  -- how long an abusive network stays blocked
local max_udp    = tonumber(os.getenv("DNSDIST_MAX_UDP_ANSWER") or "1232")

setLocal("0.0.0.0:53", {reusePort = true})
addLocal("[::]:53", {reusePort = true})
setACL({"0.0.0.0/0", "::/0"})
newServer({address = pdns, name = "pdns", checkName = "gslb.health.invalid.", mustResolve = false})
setMaxUDPOutstanding(65535)
setMaxTCPClientThreads(20)
setMaxTCPConnectionsPerClient(20)

-- Never answer ANY (an amplification favorite) or zone transfers from the internet; secondaries use the private port.
addAction(QTypeRule(DNSQType.ANY), RCodeAction(DNSRCode.REFUSED))
addAction(OrRule({QTypeRule(DNSQType.AXFR), QTypeRule(DNSQType.IXFR)}), RCodeAction(DNSRCode.REFUSED))
-- Questions that are not queries, and names that cannot be ours.
addAction(NotRule(OpcodeRule(DNSOpcode.Query)), RCodeAction(DNSRCode.NOTIMP))
-- Per client network (IPv4 /24, IPv6 /64) rate limit.
addAction(MaxQPSIPRule(qps, 24, 64, burst), DropAction())
-- Networks that keep exceeding it are blocked outright for a while.
local dbr = dynBlockRulesGroup()
dbr:setQueryRate(qps * 4, 10, "query rate exceeded", block_secs, DNSAction.Drop)
dbr:setRCodeRate(DNSRCode.REFUSED, qps, 10, "too many refused queries", block_secs, DNSAction.Drop)
function maintenance()
  dbr:apply()
end

-- Truncate big UDP answers instead of fragmenting them.
setPayloadSizeOnSelfGeneratedAnswers(max_udp)
