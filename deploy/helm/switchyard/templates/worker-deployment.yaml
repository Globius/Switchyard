apiVersion: apps/v1
kind: Deployment
metadata:
  name: {{ include "sy.name" . }}-worker
  labels: {{- include "sy.labels" . | nindent 4 }}
    app.kubernetes.io/component: worker
spec:
  replicas: {{ .Values.worker.replicas }}
  selector:
    matchLabels: {{- include "sy.selector" (dict "Release" .Release "component" "worker") | nindent 6 }}
  template:
    metadata:
      labels: {{- include "sy.labels" . | nindent 8 }}
        app.kubernetes.io/component: worker
      annotations:
        {{- with .Values.podAnnotations }}{{ toYaml . | nindent 8 }}{{- end }}
    spec:
      automountServiceAccountToken: false
      {{- with .Values.imagePullSecrets }}
      imagePullSecrets: {{- toYaml . | nindent 8 }}
      {{- end }}
      securityContext: {{- toYaml .Values.podSecurityContext | nindent 8 }}
      {{- with .Values.hostAliases }}
      hostAliases: {{- toYaml . | nindent 8 }}
      {{- end }}
      initContainers:
{{ include "sy.waitSchema" . | indent 8 }}
      containers:
        - name: worker
          image: {{ include "sy.controllerImage" . }}
          imagePullPolicy: {{ .Values.image.controller.pullPolicy }}
          args: ["worker", "--name", "$(POD_NAME)"]
          env:
            - {name: POD_NAME, valueFrom: {fieldRef: {fieldPath: metadata.name}}}
{{ include "sy.controllerEnv" . | indent 12 }}
          resources: {{- toYaml .Values.worker.resources | nindent 12 }}
          securityContext: {allowPrivilegeEscalation: false, readOnlyRootFilesystem: true, capabilities: {drop: [ALL]}}
          volumeMounts:
            - {name: secrets, mountPath: /secrets, readOnly: true}
            - {name: tmp, mountPath: /tmp}
      volumes:
{{ include "sy.secretsVolume" . | indent 8 }}
      {{- with .Values.worker.nodeSelector }}
      nodeSelector: {{- toYaml . | nindent 8 }}
      {{- end }}
      {{- with .Values.worker.tolerations }}
      tolerations: {{- toYaml . | nindent 8 }}
      {{- end }}
      affinity:
        {{- if .Values.worker.affinity }}{{ toYaml .Values.worker.affinity | nindent 8 }}{{ else }}
        podAntiAffinity:
          preferredDuringSchedulingIgnoredDuringExecution:
            - weight: 100
              podAffinityTerm:
                topologyKey: kubernetes.io/hostname
                labelSelector:
                  matchLabels: {{- include "sy.selector" (dict "Release" .Release "component" "worker") | nindent 20 }}
        {{- end }}
