# Switchyard controller on Kubernetes (docs/kubernetes-deploy.md, ADR 0191).
# Required: publicUrl, secrets.existingSecret, openbao.* and either database.cnpg or database.external.

# The URL browsers and engines use to reach the controller (https, no trailing slash). Engines enroll against it.
publicUrl: ""

image:
  controller: {repository: switchyard-controller, tag: latest, pullPolicy: IfNotPresent}
  proxy: {repository: switchyard-proxy, tag: latest, pullPolicy: IfNotPresent}
  # Empty reuses the patched proxy image; an explicit override must run nginx as uid 101.
  tls: {repository: "", tag: "", pullPolicy: IfNotPresent}
imagePullSecrets: []

# The cluster DNS domain. nginx does not use search domains, so the proxy needs the API service's full name.
clusterDomain: cluster.local

# Secret with the files the controller mounts at /secrets (see the README): bundle.key, ca.pem, client.crt, client.key.
# Key metrics-token is optional. Create it yourself or from your secret manager; the chart never stores key material.
secrets:
  existingSecret: ""

openbao:
  addr: ""                       # for example https://openbao.example.net:8200
  pkiMount: pki
  pkiRole: agents
  # Secret with role-id and secret-id for the controller's AppRole (syctl openbao-policy prints the policy).
  existingSecret: ""
  roleIdKey: role-id
  secretIdKey: secret-id
  sharedSecretPrefixes: kv/se/

database:
  mode: cnpg                     # cnpg: the chart creates a CloudNativePG Cluster; external: use a database you run
  name: switchyard
  cnpg:
    instances: 3
    storage: {size: 20Gi, storageClass: ""}
    imageName: ""                # empty: the operator's default PostgreSQL image
    resources: {}
    # Extra spec merged into the Cluster (backup, affinity, monitoring...).
    extraSpec: {}
  external:
    host: ""
    port: 5432
    # Secret with the database user and password; the user must be able to run the migrations (owner of the database).
    existingSecret: ""
    userKey: username
    passwordKey: password
    options: ""                  # for example ?sslmode=require&target_session_attrs=read-write

controller:
  breakGlass: false              # break-glass sign-in; turn on for a reason and a time window
  allowLxc: false                # system setting default, ADR 0076
  trustForwarded: true           # X-Forwarded-For from the proxy
  engineCidrs: ""
  # Proxmox API for deploying engines (SE groups, deploy). The token secret is read from a Secret you create.
  proxmox:
    url: ""                      # https://pve.example.net:8006
    tokenId: ""                  # user@realm!tokenname
    tokenSecret: {existingSecret: "", key: token-secret}
    caKey: pve-ca.pem            # key in secrets.existingSecret holding the Proxmox CA certificate
  extraEnv: []                   # extra container env entries (name/value or valueFrom)

# Staged upgrade bundles and local configuration backups (/var/lib/switchyard in the API pods). Empty means an emptyDir per pod:
# lost on restart and not shared between the two pods. For real use give an existing ReadWriteMany claim.
storage:
  existingClaim: ""

api:
  replicas: 2
  resources: {requests: {cpu: 100m, memory: 256Mi}, limits: {memory: 1Gi}}
  nodeSelector: {}
  tolerations: []
  affinity: {}

# Several workers are safe: the queue is claimed with FOR UPDATE SKIP LOCKED and the periodic jobs are scheduled by
# the worker that holds a PostgreSQL advisory lock (leader election; a new leader takes over within seconds).
worker:
  replicas: 2
  resources: {requests: {cpu: 100m, memory: 256Mi}, limits: {memory: 1Gi}}
  nodeSelector: {}
  tolerations: []
  affinity: {}

proxy:
  replicas: 2
  # The in-pod TLS sidecar is loopback. Add exact ingress/SE CIDRs only when those hops are trusted.
  trustedProxyCidrs: "127.0.0.1/32 ::1/128"
  resources: {requests: {cpu: 20m, memory: 32Mi}, limits: {memory: 128Mi}}
  nodeSelector: {}
  tolerations: []
  affinity: {}

# TLS in front of the proxy, in the same pod: engines enroll over https, and browsers need it for the session cookie.
# Use this, or an Ingress that terminates TLS, or both.
tls:
  enabled: true
  secretName: ""                 # kubernetes.io/tls Secret (tls.crt, tls.key)

service:
  type: ClusterIP                # LoadBalancer, NodePort or ClusterIP
  httpsPort: 8443
  httpPort: 8080
  nodePort: null                 # https node port when type is NodePort
  annotations: {}
  loadBalancerClass: ""
  loadBalancerIP: ""
  externalTrafficPolicy: ""      # Local keeps the client address for engines' allow lists

ingress:
  enabled: false
  className: ""
  annotations: {}
  host: ""
  tlsSecretName: ""

podDisruptionBudget: {enabled: true}

# Prometheus Operator objects (ADR 0061). Off by default: they need the operator's CRDs, and the chart renders nothing
# without them. The ServiceMonitor scrapes the API Service's /metrics with the scrape token; the PrometheusRule holds
# the controller alerts of deploy/telemetry/prometheus/rules.yml, per tenant through the `tenant` label.
monitoring:
  serviceMonitor:
    enabled: false
    # Empty means the release namespace.
    namespace: ""
    # Extra labels for the operator's serviceMonitorSelector (for example release: kube-prometheus-stack).
    labels: {}
    interval: 30s
    scrapeTimeout: 10s
    # Secret holding the token the controller reads as SWITCHYARD_METRICS_TOKEN. Empty uses secrets.existingSecret.
    bearerTokenSecret: {existingSecret: "", key: metrics-token}
  prometheusRule:
    enabled: false
    namespace: ""
    # Extra labels for the operator's ruleSelector.
    labels: {}
    # Alert when the newest engine status poll of a tenant is older than this, for alertFor.
    statusAgeSeconds: 300
    alertFor: 5m

# Extra /etc/hosts entries for the API and worker pods (for example a name for a Proxmox host).
hostAliases: []
podAnnotations: {}
podSecurityContext: {runAsNonRoot: true, runAsUser: 10001, runAsGroup: 10001, fsGroup: 10001, seccompProfile: {type: RuntimeDefault}}
