frr defaults traditional
hostname upstream
log syslog informational
!
router bgp 65000
 bgp router-id 172.30.0.250
 no bgp ebgp-requires-policy
 no bgp default ipv4-unicast
 neighbor SE peer-group
 neighbor SE remote-as 65100
 neighbor SE bfd
 bgp listen range 172.30.0.0/24 peer-group SE
 !
 address-family ipv4 unicast
  neighbor SE activate
 exit-address-family
!
