# One controller node (run on each of the three controller VMs). Copy node.env.example to node.env.
#   docker compose --env-file node.env up -d
# etcd, Patroni/PostgreSQL 17, pgBackRest, then the API and worker. See docs/runbooks/ and ADR 0048.
name: switchyard
x-patroni-env: &patroni-env
  PATRONI_NAME: ${NODE_NAME}
  PATRONI_RESTAPI_CONNECT_ADDRESS: ${NODE_IP}:8008
  PATRONI_POSTGRESQL_LISTEN: 0.0.0.0:5432
  PATRONI_POSTGRESQL_CONNECT_ADDRESS: ${NODE_IP}:5432
  PATRONI_ETCD3_HOSTS: ${ETCD_HOSTS}
  PATRONI_SUPERUSER_PASSWORD: ${PG_SUPERUSER_PASSWORD}
  PATRONI_REPLICATION_PASSWORD: ${PG_REPLICATION_PASSWORD}
  PATRONI_TAGS_NOFAILOVER: ${PATRONI_NOFAILOVER:-false}
  RESTORE_TARGET_TIME: ${RESTORE_TARGET_TIME:-}
  PGBACKREST_STANZA: switchyard
  PGBACKREST_PG1_PATH: /data/pgdata
  PGBACKREST_PG1_SOCKET_PATH: /var/run/postgresql
  PGBACKREST_REPO1_TYPE: ${BACKUP_REPO_TYPE:-s3}
  PGBACKREST_REPO1_PATH: ${BACKUP_REPO_PATH:-/switchyard}
  PGBACKREST_REPO1_S3_ENDPOINT: ${BACKUP_S3_ENDPOINT:-}
  PGBACKREST_REPO1_S3_BUCKET: ${BACKUP_S3_BUCKET:-}
  PGBACKREST_REPO1_S3_REGION: ${BACKUP_S3_REGION:-us-east-1}
  PGBACKREST_REPO1_S3_KEY: ${BACKUP_S3_KEY:-}
  PGBACKREST_REPO1_S3_KEY_SECRET: ${BACKUP_S3_SECRET:-}
  PGBACKREST_REPO1_S3_URI_STYLE: ${BACKUP_S3_URI_STYLE:-path}
  PGBACKREST_REPO1_RETENTION_FULL: "4"
  PGBACKREST_REPO1_CIPHER_TYPE: ${BACKUP_CIPHER_TYPE:-aes-256-cbc}
  PGBACKREST_REPO1_CIPHER_PASS: ${BACKUP_CIPHER_PASS}
  PGBACKREST_LOG_PATH: /var/log/pgbackrest
x-controller: &controller
  image: ${CONTROLLER_IMAGE:-switchyard-controller:latest}
  restart: unless-stopped
  environment: &controller-env
    SWITCHYARD_DATABASE_URL: postgresql+psycopg://${DB_USER:-postgres}:${PG_SUPERUSER_PASSWORD}@${DB_HOSTS}/switchyard?target_session_attrs=read-write
    SWITCHYARD_PUBLIC_URL: ${PUBLIC_URL}
    # Behind the proxy: login throttling uses the last X-Forwarded-For entry (ADR 0072).
    SWITCHYARD_TRUST_FORWARDED: "1"
    # Hand-registered engines outside their group's mgmt network, and secret paths shared by tenants.
    SWITCHYARD_ENGINE_CIDRS: ${ENGINE_CIDRS:-}
    SWITCHYARD_SHARED_SECRET_PREFIXES: ${SHARED_SECRET_PREFIXES:-}
    # Bearer token for /metrics and the Prometheus service-discovery endpoint (backend !67).
    SWITCHYARD_METRICS_TOKEN: ${METRICS_TOKEN}
    # Grafana inside the UI (ADR 0085): all five, or the UI keeps only its plain link. Same values on all nodes.
    SWITCHYARD_GRAFANA_INTERNAL_URL: ${GRAFANA_INTERNAL_URL:-}
    SWITCHYARD_GRAFANA_ADMIN_PASSWORD: ${GRAFANA_ADMIN_PASSWORD:-}
    SWITCHYARD_GRAFANA_DS_SECRET: ${GRAFANA_DS_SECRET:-}
    SWITCHYARD_GRAFANA_DS_URL: ${GRAFANA_DS_URL:-}
    SWITCHYARD_PROMETHEUS_URL: ${PROMETHEUS_URL:-}
    SWITCHYARD_LOKI_URL: ${LOKI_URL:-}
    # Email for alert targets (ADR 0121); empty means webhooks and chat only.
    SWITCHYARD_SMTP_HOST: ${SMTP_HOST:-}
    SWITCHYARD_SMTP_PORT: ${SMTP_PORT:-587}
    SWITCHYARD_SMTP_USER: ${SMTP_USER:-}
    SWITCHYARD_SMTP_PASSWORD: ${SMTP_PASSWORD:-}
    SWITCHYARD_SMTP_FROM: ${SMTP_FROM:-switchyard@localhost}
    SWITCHYARD_OPENBAO_ADDR: ${OPENBAO_ADDR:-}
    SWITCHYARD_OPENBAO_ROLE_ID: ${OPENBAO_ROLE_ID:-}
    SWITCHYARD_OPENBAO_SECRET_ID: ${OPENBAO_SECRET_ID:-}
    SWITCHYARD_PVE_URL: ${PVE_URL:-}
    SWITCHYARD_PVE_TOKEN_ID: ${PVE_TOKEN_ID:-}
    SWITCHYARD_BUNDLE_KEY_FILE: /run/switchyard/bundle.key
    # mTLS to agents and Data Plane APIs. The controller refuses to start with a bundle key but no CA.
    SWITCHYARD_DATAPLANE_CA: /run/switchyard/mtls/ca.crt
    SWITCHYARD_DATAPLANE_CERT: /run/switchyard/mtls/client.crt
    SWITCHYARD_DATAPLANE_KEY: /run/switchyard/mtls/client.key
  volumes:
    - ${BUNDLE_KEY_FILE:-./secrets/bundle.key}:/run/switchyard/bundle.key:ro
    - ${MTLS_DIR:-./secrets/mtls}:/run/switchyard/mtls:ro
services:
  etcd:
    image: quay.io/coreos/etcd:v3.5.17
    restart: unless-stopped
    network_mode: host
    command:
      - etcd
      - --name=${NODE_NAME}
      - --data-dir=/etcd-data
      - --listen-client-urls=http://${NODE_IP}:2379,http://127.0.0.1:2379
      - --advertise-client-urls=http://${NODE_IP}:2379
      - --listen-peer-urls=http://${NODE_IP}:2380
      - --initial-advertise-peer-urls=http://${NODE_IP}:2380
      - --initial-cluster=${ETCD_INITIAL_CLUSTER}
      - --initial-cluster-state=${ETCD_CLUSTER_STATE:-new}
      - --initial-cluster-token=switchyard
    volumes: [etcd-data:/etcd-data]
  patroni:
    build: ./patroni
    image: switchyard-patroni:17
    restart: unless-stopped
    network_mode: host
    environment: *patroni-env
    volumes: [pgdata:/data, pgbackrest-repo:/var/lib/pgbackrest, pgbackrest-log:/var/log/pgbackrest]
    stop_grace_period: 60s
    depends_on: [etcd]
  migrate:
    <<: *controller
    restart: "no"
    command: ["db", "upgrade"]   # reads SWITCHYARD_DATABASE_URL
  api:
    <<: *controller
    # Direct access for recovery only (loopback by default); users and Prometheus go through the proxy.
    ports: ["${API_BIND:-127.0.0.1}:8000:8000"]
    depends_on: {migrate: {condition: service_completed_successfully}}
  proxy:
    build:
      context: ../..
      dockerfile: deploy/proxy/Dockerfile
    image: ${PROXY_IMAGE:-switchyard-proxy:latest}
    restart: unless-stopped
    environment:
      CONTROLLER_UPSTREAM: api:8000
    ports: ["${PROXY_BIND:-0.0.0.0}:8080:8080"]   # the management SE group's pool points here
    depends_on: [api]
  worker:
    <<: *controller
    healthcheck: {disable: true}   # the image's HTTP health check is for the API
    command: ["worker", "--name", "${NODE_NAME}"]
    depends_on: {migrate: {condition: service_completed_successfully}}
volumes: {etcd-data: {}, pgdata: {}, pgbackrest-repo: {}, pgbackrest-log: {}}
