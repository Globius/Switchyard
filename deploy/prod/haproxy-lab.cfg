# Lab only: send port 5432 to whichever Patroni member answers 200 on /primary.
defaults
  mode tcp
  timeout connect 3s
  timeout client 1h
  timeout server 1h
listen primary
  bind :5432
  option httpchk GET /primary
  http-check expect status 200
  default-server inter 2s fall 2 rise 1 on-marked-down shutdown-sessions port 8008
  server db1 db1:5432 check
  server db2 db2:5432 check
  server db3 db3:5432 check
