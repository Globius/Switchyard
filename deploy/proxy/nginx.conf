# TLS is terminated in front (the management SE group's HAProxy); this server speaks plain HTTP on 8080.
# $CONTROLLER_UPSTREAM is substituted by the nginx image at start.
limit_req_zone $binary_remote_addr zone=login:10m rate=5r/m;
limit_req_status 429;

# A request without a Host header (an HTTP/1.0 health check such as HAProxy's default `option httpchk`) leaves $host empty, and
# the controller refuses an empty Host. Give it a name so the management SE group's monitor works without extra settings.
map $host $sy_host {
    default $host;
    ""      sy-proxy;
}

map $http_x_forwarded_proto $sy_hsts {
    https   "max-age=31536000; includeSubDomains";
    default "";
}

# The client address comes from X-Forwarded-For, but only when the hop that sent it is a private address (the SE).
set_real_ip_from 10.0.0.0/8;
set_real_ip_from 172.16.0.0/12;
set_real_ip_from 192.168.0.0/16;
real_ip_header X-Forwarded-For;
real_ip_recursive on;

# Resolve the controller name again every few seconds: the API container is recreated on upgrades and gets a new
# address (Docker's embedded DNS; set NGINX_RESOLVER for another network).
resolver ${NGINX_RESOLVER} valid=10s;

server {
    listen 8080;
    server_tokens off;
    root /usr/share/nginx/html;

    # Security headers (docs/security/ui-review.md S1). Monaco needs blob: workers and inline styles.
    add_header Content-Security-Policy "default-src 'self'; script-src 'self'; style-src 'self' 'unsafe-inline'; worker-src 'self' blob:; img-src 'self' data:; connect-src 'self'; frame-ancestors 'none'; base-uri 'none'; form-action 'self'" always;
    add_header X-Content-Type-Options "nosniff" always;
    add_header Referrer-Policy "same-origin" always;
    add_header Strict-Transport-Security $sy_hsts always;

    # Login and break-glass: 5 requests a minute per client address, a short burst allowed.
    location ~ ^/api/v1/auth/(login|break-glass|callback) {
        limit_req zone=login burst=10 nodelay;
        include /etc/nginx/sy-proxy.conf;
        set $sy_upstream "http://$CONTROLLER_UPSTREAM";
        proxy_pass $sy_upstream;
    }

    # Upgrade bundles (hundreds of MB): no body size limit here (the controller caps it), and no buffering to disk.
    location = /api/v1/system/bundles {
        client_max_body_size 4g;
        proxy_request_buffering off;
        include /etc/nginx/sy-proxy.conf;
        set $sy_upstream "http://$CONTROLLER_UPSTREAM";
        proxy_pass $sy_upstream;
    }

    location /api/ {
        include /etc/nginx/sy-proxy.conf;
        set $sy_upstream "http://$CONTROLLER_UPSTREAM";
        proxy_pass $sy_upstream;
    }

    # Grafana behind the controller (ADR 0085), opened by the UI in its own tab. The controller authenticates its own
    # cookie and proxies to Grafana; the data source proxy (/internal/ds) is deliberately not routed here. Grafana's pages
    # need inline scripts and styles, so this location has its own policy, and nothing may frame it.
    location /grafana/ {
        # Not sy-proxy.conf: Grafana compares the Origin header of a write with its Host, port included, and the shared
        # file sends $host (no port); a second Host header would be refused outright.
        proxy_http_version 1.1;
        proxy_set_header Host $http_host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $http_x_forwarded_proto;
        proxy_set_header Connection "";
        proxy_buffering off;
        proxy_read_timeout 1h;
        set $sy_upstream "http://$CONTROLLER_UPSTREAM";
        proxy_pass $sy_upstream;
        add_header Content-Security-Policy "frame-ancestors 'none'" always;
        add_header X-Content-Type-Options "nosniff" always;
        add_header Referrer-Policy "same-origin" always;
        add_header Strict-Transport-Security $sy_hsts always;
    }

    # Prometheus scrape of the controller (bearer token enforced by the controller).
    location = /metrics {
        include /etc/nginx/sy-proxy.conf;
        set $sy_upstream "http://$CONTROLLER_UPSTREAM";
        proxy_pass $sy_upstream;
    }

    # Single-page app: unknown paths fall back to index.html. Hashed assets are immutable.
    location /assets/ {
        add_header Cache-Control "public, max-age=31536000, immutable";
        add_header X-Content-Type-Options "nosniff" always;
        try_files $uri =404;
    }
    location / {
        add_header Cache-Control "no-store";
        add_header Content-Security-Policy "default-src 'self'; script-src 'self'; style-src 'self' 'unsafe-inline'; worker-src 'self' blob:; img-src 'self' data:; connect-src 'self'; frame-ancestors 'none'; base-uri 'none'; form-action 'self'" always;
        add_header X-Content-Type-Options "nosniff" always;
        add_header Referrer-Policy "same-origin" always;
        add_header Strict-Transport-Security $sy_hsts always;
        try_files $uri /index.html;
    }
}
