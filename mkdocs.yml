site_name: Switchyard
site_description: Multi-tenant load balancer controller for Proxmox; an open-source replacement for NSX ALB (Avi).
repo_url: https://git.example.com/globius-oss/switchyard
edit_uri: -/edit/main/docs/
docs_dir: docs
site_dir: public
strict: true
not_in_nav: |
  /adr/0*.md
exclude_docs: |
  requirements.txt
  prompts/
  api/openapi.json
  hooks/
validation:
  omitted_files: warn
  absolute_links: warn
  unrecognized_links: warn
  anchors: warn
theme:
  name: material
  features: [navigation.sections, navigation.top, navigation.indexes, search.suggest, content.code.copy]
  palette:
    - media: "(prefers-color-scheme: light)"
      scheme: default
      toggle: {icon: material/brightness-7, name: Dark mode}
    - media: "(prefers-color-scheme: dark)"
      scheme: slate
      toggle: {icon: material/brightness-4, name: Light mode}
markdown_extensions:
  - admonition
  - attr_list
  - tables
  - toc: {permalink: true}
  - pymdownx.superfences
  - pymdownx.highlight
  - pymdownx.details
hooks:
  - docs/hooks/repo_links.py
nav:
  - Home: index.md
  - Guides:
      - Quickstart - a test instance on its own machine: quickstart.md
      - Production guide: production.md
      - Run on Kubernetes: deploy-kubernetes.md
      - Running and operating the controller: operating.md
      - The controller's own address, VIP and certificate: controller-settings.md
      - Signing in, roles and access: auth.md
      - Login in front of a service (access policy sets): access.md
      - API schema protection (WAF): waf-api-schema.md
      - Device posture and device certificates: device-posture.md
      - Certificates from ACME providers: acme.md
      - Alerting: alerting.md
      - GSLB - wide IPs on PowerDNS: gslb.md
      - DNS records from a virtual service: dns-records.md
      - Automatic scale-out of an SE group: autoscale.md
      - Packet capture on an engine: packet-capture.md
      - Country and reputation lists: ip-lists.md
      - IPv6 and dual-stack: ipv6.md
      - Kubernetes connector: kubernetes.md
      - Pool discovery by Proxmox tag: pool-discovery.md
      - Importing an Avi (NSX ALB) configuration: import-avi.md
      - HTTP API: api.md
      - How Switchyard objects render to HAProxy: render.md
  - Features:
