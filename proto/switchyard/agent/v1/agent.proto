syntax = "proto3";

package switchyard.agent.v1;

option go_package = "switchyard/agent/gen/switchyard/agent/v1;agentv1";

// The SE agent. It only ever writes under /etc/switchyard/ and reloads an allowlisted set of units.
service Agent {
  // Writes a signed bundle atomically and reloads only the units whose files changed.
  rpc ApplyBundle(ApplyBundleRequest) returns (ApplyBundleResponse);
  // Reports file hashes, BGP sessions, VRRP state, IPVS real servers and local HAProxy health.
  rpc GetStatus(GetStatusRequest) returns (Status);
  // Streams a status snapshot every time something changes (and at least every 30 seconds).
  rpc Watch(WatchRequest) returns (stream Status);
  // Runs one health probe from this engine against a pool member that is in the applied
  // configuration. Anything else is refused: this is not a general network tool.
  rpc ProbeMember(ProbeRequest) returns (ProbeResponse);
}

message ProbeRequest {
  string protocol = 1;                 // tcp, http or udp
  string address = 2;                  // must appear as a server in the applied HAProxy or IPVS config
  uint32 port = 3;
  uint32 timeout_ms = 4;               // 100 to 10000
  string http_method = 5;              // GET, HEAD or OPTIONS
  string http_path = 6;
  string http_host = 7;
  repeated uint32 expect_status = 8;   // empty means any 2xx or 3xx
  bytes udp_payload = 9;               // sent as is
  bytes udp_expect = 10;               // the reply must contain this; empty means any reply
}

message ProbeResponse {
  bool ok = 1;
  uint32 latency_ms = 2;
  string detail = 3;                   // what was received, or why it failed (never a stack trace)
  bool refused = 4;                    // the target is not a configured member
}

message File {
  // Relative to /etc/switchyard/, for example "frr/frr.conf".
  string path = 1;
  bytes content = 2;
}

// The signed payload. Serialised with deterministic marshalling and carried as bytes so the
// signature covers exactly what the agent parses.
message Bundle {
  string id = 1;
  repeated File files = 2;
  // The engine this bundle is for (the agent's certificate name). A bundle signed for another
  // engine is refused. Empty only from controllers older than this field.
  string engine = 3;
  // Strictly increasing per engine (milliseconds since the Unix epoch). The agent refuses a
  // sequence at or below the last one it applied, so an old signed bundle cannot be replayed.
  // Zero only from controllers older than this field.
  uint64 sequence = 4;
}

message ApplyBundleRequest {
  bytes bundle = 1;     // a serialised Bundle
  bytes signature = 2;  // Ed25519 signature of `bundle`
}

message ApplyBundleResponse {
  bool ok = 1;
  string error = 2;
  repeated string changed_files = 3;
  repeated string reloaded_units = 4;
  bool restored_previous = 5;  // a reload failed and the previous files were put back
}

message GetStatusRequest {}
message WatchRequest {}

message BgpSession {
  string peer = 1;
  string state = 2;  // Established, Active, Idle, ...
  uint32 remote_asn = 3;
}

message VrrpInstance {
  string name = 1;
  string state = 2;  // MASTER, BACKUP, FAULT
}

// One IPVS real server of a UDP virtual service, in the same shape as an HAProxy member: keyed
// by virtual service (VIP, port) and member (address, port), with state, weight and counters.
message IpvsRealServer {
  string service = 1;         // virtual service name, from the rendered keepalived.conf
  string vip = 2;
  uint32 port = 3;
  string address = 4;         // the real server
  uint32 member_port = 5;
  string state = 6;           // up, down, drain
  uint32 weight = 7;
  uint64 active_conns = 8;
  uint64 inactive_conns = 9;
  uint64 in_packets = 10;     // client to server
  uint64 out_packets = 11;
  uint64 in_bytes = 12;
  uint64 out_bytes = 13;
}

message Status {
  string agent_version = 1;
  string bundle_id = 2;                 // id of the last applied bundle
  map<string, string> file_hashes = 3;  // sha256 of each managed file
  repeated BgpSession bgp = 4;
  repeated VrrpInstance vrrp = 5;
  bool haproxy_healthy = 6;             // local health check result
  bool routes_withdrawn = 7;            // the watchdog has withdrawn BGP prefixes
  int64 observed_at_unix = 8;
  repeated IpvsRealServer ipvs = 9;     // UDP real servers; empty when no UDP service is rendered
  bool keepalived_running = 10;         // only meaningful when `ipvs` is expected
  repeated string withdrawn_prefixes = 11;  // BGP prefixes the watchdog has withdrawn, sorted
  bool waf_expected = 12;               // a Coraza config is present: the WAF sidecar should run
  bool waf_running = 13;                // coraza-spoa is active and its port accepts connections
}
