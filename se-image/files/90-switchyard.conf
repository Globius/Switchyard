net.ipv4.ip_forward = 1
net.ipv4.ip_nonlocal_bind = 1
net.ipv4.conf.all.rp_filter = 2
net.ipv4.vs.conntrack = 1
net.ipv4.conf.all.arp_ignore = 1
net.ipv4.conf.all.arp_announce = 2
net.ipv6.ip_nonlocal_bind = 1
# IPv6 services: IPVS forwards (NAT) UDP between the VIP and the real servers, which needs forwarding; turning it on
# stops the kernel from accepting router advertisements unless accept_ra is 2, so keep them for the default route.
net.ipv6.conf.all.forwarding = 1
net.ipv6.conf.default.forwarding = 1
net.ipv6.conf.all.accept_ra = 2
net.ipv6.conf.default.accept_ra = 2
