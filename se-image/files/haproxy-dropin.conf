[Service]
# Config is written by sy-agent under /etc/switchyard/haproxy.
ExecStart=
ExecStart=/usr/sbin/haproxy -Ws -f /etc/switchyard/haproxy/haproxy.cfg -p /run/haproxy.pid -S /run/haproxy-master.sock
ExecReload=
ExecReload=/usr/sbin/haproxy -Ws -f /etc/switchyard/haproxy/haproxy.cfg -c -q
ExecReload=/bin/kill -USR2 $MAINPID
