#!/usr/sbin/nft -f
# Managed by the SE image. The agent writes the controller's rules to /etc/switchyard/nftables/*.nft and restarts this
# unit: each file declares its own tables. The two lines below make them replace, not add to, what is loaded.
table ip sy_udp
delete table ip sy_udp
table ip6 sy_udp
delete table ip6 sy_udp
include "/etc/switchyard/nftables/*.nft"
