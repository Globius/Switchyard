[Unit]
ConditionPathExists=/etc/switchyard/vector.env

[Service]
EnvironmentFile=-/etc/switchyard/vector.env
Environment=VECTOR_DANGEROUSLY_ALLOW_ENV_VAR_INTERPOLATION=true
# sy-vector-sinks writes the Loki and/or OTLP sinks into /run/switchyard-vector/ (ADR 0221); the directory is private.
RuntimeDirectory=switchyard-vector
RuntimeDirectoryMode=0700
# The packaged unit validates and starts /etc/vector/vector.yaml; this one runs the config the controller owns.
ExecStartPre=
ExecStartPre=/usr/local/sbin/sy-vector-sinks
# /etc/switchyard/vector/ holds what the agent adds from the signed bundle (for example the CrowdSec log feed, ADR 0215).
ExecStartPre=/usr/bin/vector validate --config-dir /etc/switchyard/vector --config-dir /run/switchyard-vector /etc/switchyard/vector.yaml
ExecStart=
ExecStart=/usr/bin/vector --config /etc/switchyard/vector.yaml --config-dir /etc/switchyard/vector --config-dir /run/switchyard-vector
ExecReload=
ExecReload=/bin/kill -HUP $MAINPID
