[Unit]
ConditionPathExists=/etc/switchyard/vector.env

[Service]
EnvironmentFile=-/etc/switchyard/vector.env
Environment=VECTOR_DANGEROUSLY_ALLOW_ENV_VAR_INTERPOLATION=true
# The packaged unit validates and starts /etc/vector/vector.yaml; this one runs the config the controller owns.
ExecStartPre=
ExecStartPre=/usr/bin/vector validate --config-yaml /etc/switchyard/vector.yaml
ExecStart=
ExecStart=/usr/bin/vector --config /etc/switchyard/vector.yaml
ExecReload=
ExecReload=/bin/kill -HUP $MAINPID
