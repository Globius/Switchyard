# Managed by Switchyard. Do not edit: changes are reported as drift.
bind: 127.0.0.1:9000
log_level: info
log_file: /dev/stdout
log_format: json
applications:
  - name: app
    log_level: info
    log_file: /dev/stdout
    log_format: json
    transaction_ttl_ms: 60000
    directives: |
      Include @coraza.conf-recommended
      SecRuleEngine On
      # OWASP CRS 4.8.0, pinned in the SE image
      Include /usr/share/coreruleset/4.8.0/crs-setup.conf.example
      SecAction "id:900000,phase:1,pass,t:none,nolog,setvar:tx.blocking_paranoia_level=1"
      SecAction "id:900110,phase:1,pass,t:none,nolog,setvar:tx.inbound_anomaly_score_threshold=5,setvar:tx.outbound_anomaly_score_threshold=4"
      Include /usr/share/coreruleset/4.8.0/rules/*.conf
